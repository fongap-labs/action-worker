name: Cancel Closed PR Work

on:
  repository_dispatch:
    types: [cancel-pr-work]

permissions: {}

jobs:
  validate:
    name: Validate Cancellation Target
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      repository: ${{ steps.payload.outputs.repository }}
      pr_number: ${{ steps.payload.outputs.pr_number }}

    steps:
      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Validate cancellation payload
        id: payload
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          AW_REPOSITORY_POLICY: ${{ vars.AW_REPOSITORY_POLICY }}
        run: node scripts/validate-pr-payload.ts "$PAYLOAD"

      - name: Validate closed pull request
        env:
          GH_TOKEN: ${{ secrets.AW_CONTROL_TOKEN }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          PR_NUMBER: ${{ steps.payload.outputs.pr_number }}
        shell: bash
        run: |
          set -Eeuo pipefail

          state="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.state')"
          [ "$state" = "closed" ] || {
            echo "::error::Cancellation target is not closed: $REPOSITORY#$PR_NUMBER" >&2
            exit 65
          }

  governance:
    name: Cancel PR Governance
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    concurrency:
      group: pr-governance-${{ needs.validate.outputs.repository }}-${{ needs.validate.outputs.pr_number }}
      cancel-in-progress: true
    steps:
      - run: echo "Cancelled stale PR Governance work for ${{ needs.validate.outputs.repository }}#${{ needs.validate.outputs.pr_number }}."

  central-ci:
    name: Cancel Central CI
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    concurrency:
      group: central-ci-${{ needs.validate.outputs.repository }}-${{ needs.validate.outputs.pr_number }}
      cancel-in-progress: true
    steps:
      - run: echo "Cancelled stale Central CI work for ${{ needs.validate.outputs.repository }}#${{ needs.validate.outputs.pr_number }}."
