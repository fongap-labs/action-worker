name: 自动 · PR 清理

on:
  repository_dispatch:
    types: [cancel-pr-work]

permissions: {}

jobs:
  validate:
    name: Validate Cancellation Target
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      repository: ${{ steps.payload.outputs.repository }}
      pr_number: ${{ steps.payload.outputs.pr_number }}
      merged: ${{ steps.closed.outputs.merged }}

    steps:
      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Validate cancellation payload
        id: payload
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          AW_REPOSITORY_POLICY: ${{ vars.AW_REPOSITORY_POLICY }}
        run: node scripts/validate-pr-payload.ts "$PAYLOAD"

      - name: Validate closed pull request
        id: closed
        env:
          GH_TOKEN: ${{ secrets.AW_CONTROL_TOKEN }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          PR_NUMBER: ${{ steps.payload.outputs.pr_number }}
        shell: bash
        run: |
          set -Eeuo pipefail

          state="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.state')"
          [ "$state" = "closed" ] || {
            echo "::error::Cancellation target is not closed: $REPOSITORY#$PR_NUMBER" >&2
            exit 65
          }
          echo "merged=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.merged')" >> "$GITHUB_OUTPUT"

  # A merged pull request keeps its governance run: the Main Write Guard proves the main write
  # from the PR Governance status on the merged head, so cancelling the run on merge left that
  # status unpublished and the repository main permanently untrusted. Only an abandoned pull
  # request has its governance work cancelled.
  governance:
    name: Cancel PR Governance
    needs: validate
    if: needs.validate.outputs.merged != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    concurrency:
      group: pr-governance-${{ needs.validate.outputs.repository }}-${{ needs.validate.outputs.pr_number }}
      cancel-in-progress: true
    steps:
      - env:
          REPOSITORY: ${{ needs.validate.outputs.repository }}
          PR_NUMBER: ${{ needs.validate.outputs.pr_number }}
        run: echo "Cancelled stale PR Governance work for $REPOSITORY#$PR_NUMBER."

  # A merged pull request still gets its advisory review, so only an abandoned one is cancelled.
  review:
    name: Cancel PR Review
    needs: validate
    if: needs.validate.outputs.merged != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    concurrency:
      group: pr-review-${{ needs.validate.outputs.repository }}-${{ needs.validate.outputs.pr_number }}
      cancel-in-progress: true
    steps:
      - env:
          REPOSITORY: ${{ needs.validate.outputs.repository }}
          PR_NUMBER: ${{ needs.validate.outputs.pr_number }}
        run: echo "Cancelled stale PR Review work for $REPOSITORY#$PR_NUMBER."

  central-ci:
    name: Cancel Central CI
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    concurrency:
      group: central-ci-${{ needs.validate.outputs.repository }}-${{ needs.validate.outputs.pr_number }}
      cancel-in-progress: true
    steps:
      - env:
          REPOSITORY: ${{ needs.validate.outputs.repository }}
          PR_NUMBER: ${{ needs.validate.outputs.pr_number }}
        run: echo "Cancelled stale Central CI work for $REPOSITORY#$PR_NUMBER."
