name: 手动 · 分支授权
run-name: ${{ inputs.confirm && 'Execute' || 'Check only' }} · ${{ inputs.operation }} · ${{ inputs.repository }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 操作类型
        type: choice
        options: [initialize-dev, transfer]
        required: true
      repository:
        description: 目标仓库（如 delta，自动补全组织名）
        type: string
        required: true
      source_sha:
        description: 源提交 SHA（留空自动获取，也可手动指定）
        type: string
        required: false
      pr_number:
        description: 跨分支 PR 编号（初始化保持 0）
        type: number
        default: 0
      confirm:
        description: 确认授权本次锁定的目标及提交（不勾选仅检查）
        type: boolean
        required: true
        default: false
      transfer_snapshot:
        description: 跨分支快照（留空自动生成；也可指定已检查的 scope-v1 值）
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: branch-authorization-${{ contains(inputs.repository, '/') && inputs.repository || format('{0}/{1}', github.repository_owner, inputs.repository) }}
  cancel-in-progress: false

jobs:
  authorize:
    if: github.repository == 'fongap-labs/action-worker' && github.ref == 'refs/heads/main'
    name: Check and authorize managed branch operation
    environment:
      name: admin-ops
      deployment: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Resolve managed PR scope
        id: api_scope
        env:
          TARGET_REPOSITORY: ${{ contains(inputs.repository, '/') && inputs.repository || format('{0}/{1}', github.repository_owner, inputs.repository) }}
        run: node scripts/resolve-github-api-scope.ts pr

      - name: Mint scoped read token
        id: app_read
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.api_scope.outputs.owner }}
          repositories: ${{ steps.api_scope.outputs.is_control_repository == 'true' && github.event.repository.name || format('{0},{1}', github.event.repository.name, steps.api_scope.outputs.repository_name) }}
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read
          permission-statuses: read
          permission-issues: read

      - name: Check source and display authorization scope
        id: plan
        env:
          OPERATION: ${{ inputs.operation }}
          REPOSITORY: ${{ contains(inputs.repository, '/') && inputs.repository || format('{0}/{1}', github.repository_owner, inputs.repository) }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          OPERATOR_CONFIRMED: ${{ inputs.confirm }}
          TRANSFER_SNAPSHOT: ${{ inputs.transfer_snapshot }}
          AW_PROTECTION_READ_TOKEN: ${{ secrets.AW_ADMIN_TOKEN }}
          AW_CONTROL_TOKEN: ${{ steps.app_read.outputs.token }}
          AW_STATUS_KEYRING: ${{ secrets.AW_STATUS_KEYRING }}
          AW_STATUS_API_TOKEN: ${{ steps.app_read.outputs.token }}
        run: node scripts/authorize-branch-operation.ts plan

      - name: Verify approval before issuing initialization receipt
        if: inputs.confirm
        env:
          OPERATION: ${{ inputs.operation }}
          REPOSITORY: ${{ contains(inputs.repository, '/') && inputs.repository || format('{0}/{1}', github.repository_owner, inputs.repository) }}
          SOURCE_SHA: ${{ steps.plan.outputs.source_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          OPERATOR_CONFIRMED: ${{ inputs.confirm }}
          TRANSFER_SNAPSHOT: ${{ steps.plan.outputs.transfer_snapshot }}
          AW_PROTECTION_READ_TOKEN: ${{ secrets.AW_ADMIN_TOKEN }}
          AW_CONTROL_TOKEN: ${{ steps.app_read.outputs.token }}
          AW_STATUS_KEYRING: ${{ secrets.AW_STATUS_KEYRING }}
          AW_STATUS_API_TOKEN: ${{ steps.app_read.outputs.token }}
        run: node scripts/authorize-branch-operation.ts verify

      - name: Mint initialization receipt token
        if: inputs.confirm && inputs.operation == 'initialize-dev'
        id: receipt_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.api_scope.outputs.owner }}
          repositories: ${{ steps.api_scope.outputs.repository_name }}
          permission-statuses: write

      - name: Mint repository-scoped initialization ref token
        if: inputs.confirm && inputs.operation == 'initialize-dev'
        id: ref_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.api_scope.outputs.owner }}
          repositories: ${{ steps.api_scope.outputs.repository_name }}
          permission-contents: write

      - name: Record approved authorization and initialize dev
        if: inputs.confirm
        env:
          OPERATION: ${{ inputs.operation }}
          REPOSITORY: ${{ contains(inputs.repository, '/') && inputs.repository || format('{0}/{1}', github.repository_owner, inputs.repository) }}
          SOURCE_SHA: ${{ steps.plan.outputs.source_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          OPERATOR_CONFIRMED: ${{ inputs.confirm }}
          TRANSFER_SNAPSHOT: ${{ steps.plan.outputs.transfer_snapshot }}
          AW_PROTECTION_READ_TOKEN: ${{ secrets.AW_ADMIN_TOKEN }}
          AW_CONTROL_TOKEN: ${{ steps.app_read.outputs.token }}
          AW_STATUS_KEYRING: ${{ secrets.AW_STATUS_KEYRING }}
          AW_STATUS_API_TOKEN: ${{ steps.receipt_app.outputs.token || steps.app_read.outputs.token }}
          AW_DEV_REF_TOKEN: ${{ steps.ref_app.outputs.token }}
        run: node scripts/authorize-branch-operation.ts approve
