name: 自动 · 初始化 AI Gateway 部署健康密钥

on:
  push:
    branches: [main]
    paths:
      - policies/ai-gateway-health-bootstrap.request

permissions: {}
concurrency:
  group: ai-gateway-ops-secret-management
  cancel-in-progress: false
jobs:
  bootstrap:
    if: github.repository == 'fongap-labs/action-worker' && github.ref == 'refs/heads/main'
    name: Bootstrap one missing health credential with fongap-bot
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: ai-gateway-ops
      deployment: false
    permissions:
      contents: read
    steps:
      - name: Check out trusted control main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Mint fongap-bot installation token for Environment Secrets
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-secrets: write
      - name: Initialize missing Secret in both GitHub Environments and Worker
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CLOUDFLARE_API_TOKEN_OPS: ${{ secrets.CLOUDFLARE_API_TOKEN_OPS }}
          CLOUDFLARE_ACCOUNT_ID_OPS: ${{ vars.CLOUDFLARE_ACCOUNT_ID_OPS }}
          AIG_PUBLIC_URL: ${{ vars.AIG_PUBLIC_URL }}
        run: |
          set -Eeuo pipefail
          node scripts/bootstrap-ai-gateway-health-key.ts
      - name: Redacted operations summary
        if: always()
        shell: bash
        run: |
          {
            echo '## AI Gateway first-time deployment health credential'
            echo '- GitHub: production, ai-gateway-ops'
            echo '- Cloudflare Worker: ai-gateway'
            echo '- Secret values are never logged'
            echo '- Result: ${{ job.status }}'
          } >> "$GITHUB_STEP_SUMMARY"
