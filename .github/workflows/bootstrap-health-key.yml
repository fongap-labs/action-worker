name: 自动 · 初始化 AI Gateway 部署健康密钥

on:
  push:
    branches: [main]
    paths:
      - policies/ai-gateway-health-bootstrap.request

permissions: {}
concurrency:
  group: ai-gateway-ops-secret-management
  cancel-in-progress: false
jobs:
  gateway_metadata:
    if: github.repository == 'fongap-labs/action-worker' && github.ref == 'refs/heads/main'
    name: Read approved non-sensitive AI Gateway metadata from ops
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: ai-gateway-ops
      deployment: false
    permissions:
      contents: read
    outputs:
      account_id: ${{ steps.metadata.outputs.account_id }}
      public_url: ${{ steps.metadata.outputs.public_url }}
    steps:
      - name: Check out trusted control main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Validate approved Gateway ops metadata
        id: metadata
        env:
          AIG_OPS_VARIABLES_JSON: ${{ toJSON(vars) }}
        run: node scripts/gateway-ops-variables.ts
      # Validate the public origin before admin-ops creates any Secret.
      - name: Require configured public health origin
        env:
          AIG_PUBLIC_URL: ${{ steps.metadata.outputs.public_url }}
        shell: bash
        run: |
          if [[ -z "$AIG_PUBLIC_URL" ]]; then
            echo "::error::Approved Gateway public health origin is unavailable." >&2
            exit 77
          fi

  worker-preflight:
    if: github.repository == 'fongap-labs/action-worker' && github.ref == 'refs/heads/main'
    needs: gateway_metadata
    name: Inspect Worker secret names with protected Gateway operations credential
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment:
      name: ai-gateway-ops
      deployment: false
    permissions:
      contents: read
    steps:
      - name: Check out trusted control main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Inspect existing Worker Secret names
        env:
          CLOUDFLARE_API_TOKEN_OPS: ${{ secrets.CLOUDFLARE_API_TOKEN_SECONDARY }}
          CLOUDFLARE_ACCOUNT_ID_OPS: ${{ needs.gateway_metadata.outputs.account_id }}
        run: node scripts/bootstrap-ai-gateway-health-key.ts worker-preflight

  github-bootstrap:
    needs: worker-preflight
    name: Initialize Gateway operations health Secret using admin-ops
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment:
      name: admin-ops
      deployment: false
    permissions:
      contents: read
    steps:
      - name: Check out trusted control main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Generate once and encrypt into approved deployment Environment
        env:
          GH_TOKEN: ${{ secrets.AW_ADMIN_TOKEN }}
        run: node scripts/bootstrap-ai-gateway-health-key.ts github-bootstrap

  worker-publish:
    needs: [github-bootstrap, gateway_metadata]
    name: Publish saved health key through protected Gateway operations
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment:
      name: ai-gateway-ops
      deployment: false
    permissions:
      contents: read
    steps:
      - name: Check out trusted control main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Publish the saved health Secret through the approved operations workflow
        env:
          AIG_DEPLOY_HEALTH_KEY: ${{ secrets.AIG_DEPLOY_HEALTH_KEY }}
          CLOUDFLARE_API_TOKEN_OPS: ${{ secrets.CLOUDFLARE_API_TOKEN_SECONDARY }}
          CLOUDFLARE_ACCOUNT_ID_OPS: ${{ needs.gateway_metadata.outputs.account_id }}
          AIG_PUBLIC_URL: ${{ needs.gateway_metadata.outputs.public_url }}
        run: node scripts/bootstrap-ai-gateway-health-key.ts worker-publish
