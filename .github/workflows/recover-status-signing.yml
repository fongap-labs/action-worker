name: 手动 · 恢复签名密钥

# An explicit protected recovery entry point; maintenance settings remain push/schedule only.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 确认仅恢复缺失的签名密钥，保留历史验签，不修改其他仓库设置
        required: true
        type: boolean
        default: false
  repository_dispatch:
    types: [run-status-signing-recovery]

permissions:
  contents: read
  actions: read

# Share the settings reconciler's lock, so bootstrap cannot race the scheduled initializer.
concurrency:
  group: apply-repository-settings
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Bootstrap missing CI evidence signing keys
    if: github.ref == 'refs/heads/main'
    environment: admin-ops
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out trusted control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Require operator confirmation
        if: github.event_name == 'workflow_dispatch'
        env:
          RECOVERY_CONFIRMED: ${{ inputs.confirm }}
        shell: bash
        run: |
          if [ "$RECOVERY_CONFIRMED" != "true" ]; then
            echo "::error::Explicit operator confirmation is required for signing recovery." >&2
            exit 64
          fi

      - name: Confirm signing recovery is needed
        env:
          AW_LEGACY_VERIFIER_PRESENT: ${{ secrets.AW_STATUS_TOKEN != '' }}
          AW_KEYRING_PRESENT: ${{ secrets.AW_STATUS_SIGNING_KEYS != '' }}
        shell: bash
        run: |
          if [ "$AW_LEGACY_VERIFIER_PRESENT" != "true" ]; then
            echo "::error::Historical AW_STATUS_TOKEN verifier is missing; recovery must preserve existing attestation verification." >&2
            exit 77
          fi
          if [ "$AW_KEYRING_PRESENT" = "true" ]; then
            echo "::error::AW_STATUS_SIGNING_KEYS already exists; this recovery entry must not rotate an existing keyring." >&2
            exit 64
          fi

      - name: Mint status bootstrap dispatch token
        id: bootstrap_dispatch
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Bootstrap status signing keyring
        env:
          GH_TOKEN: ${{ secrets.AW_ADMIN_TOKEN }}
          AW_STATUS_TOKEN: ${{ secrets.AW_STATUS_TOKEN }}
          AW_STATUS_SIGNING_KEYS: ${{ secrets.AW_STATUS_SIGNING_KEYS }}
          AW_STATUS_SIGNING_KEY_ID: k1
          AW_DISPATCH_API_TOKEN: ${{ steps.bootstrap_dispatch.outputs.token }}
          AW_BOOTSTRAP_READ_TOKEN: ${{ github.token }}
        run: node scripts/bootstrap-status-signing.ts
