name: 手动 · 确认控制门禁

# Runs only from trusted main; approval is an actual GitHub environment review,
# not a PR author review (which single-maintainer repositories cannot submit).
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Action Worker PR number"
        required: true
        type: number
      head_sha:
        description: "Exact 40-character PR head SHA that the owner reviewed"
        required: true
        type: string

permissions: {}

concurrency:
  group: control-owner-approval-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  confirm:
    name: Confirm exact control PR revision
    if: github.ref == 'refs/heads/main' && github.actor == 'fongap' && github.triggering_actor == 'fongap'
    environment: control-plane-approval
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: write
    steps:
      - name: Verify owner, environment review, and immutable PR head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REVIEWED_SHA: ${{ inputs.head_sha }}
        run: |
          set -Eeuo pipefail

          # This script runs from protected main; never check out PR code or accept
          # a repository name, status context, or caller-provided approval claim.
          [[ "$GITHUB_REPOSITORY" == "fongap-labs/action-worker" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_ACTOR" == "fongap" ]]
          [[ "$GITHUB_TRIGGERING_ACTOR" == "fongap" ]]
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]

          # A missing or unprotected environment must fail closed; only a real
          # human approval in this run authorizes the current PR revision.
          reviews="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals")"
          count="$(jq '[.[] | select(.state == "approved" and .user.login == "fongap" and .user.type == "User" and any(.environments[]?; .name == "control-plane-approval"))] | length' <<< "$reviews")"
          [[ "$count" =~ ^[0-9]+$ && "$count" -ge 1 ]] || {
            echo "::error::Explicit fongap environment approval is required." >&2
            exit 77
          }

          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          jq -e --arg sha "$REVIEWED_SHA" --arg repo "$GITHUB_REPOSITORY" '
            .state == "open" and
            .base.ref == "main" and
            .head.sha == $sha and
            .base.repo.full_name == $repo
          ' <<< "$pr" > /dev/null || {
            echo "::error::PR is closed, targets another base, or its head changed after approval." >&2
            exit 77
          }

          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$REVIEWED_SHA" \
            -f state=success \
            -f context="Control Owner Approval" \
            -f description="fongap confirmed PR #$PR_NUMBER at ${REVIEWED_SHA:0:12}" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null

          echo "Control owner confirmation published for PR #$PR_NUMBER at $REVIEWED_SHA"
