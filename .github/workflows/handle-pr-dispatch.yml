name: 自动 · PR 分发

on:
  repository_dispatch:
    types: [run-pr-governance]

permissions:
  contents: read
  actions: read
  pull-requests: read
  statuses: read

concurrency:
  group: pr-governance-${{ github.event.client_payload.repository }}-${{ github.event.client_payload.pr_number }}
  # A newer PR revision cancels the obsolete one: stale heads must not write governance statuses
  # after the current revision has finished. The cancelled run still executes its final gate step
  # (which marks failure), so no pending status leaks forever.
  cancel-in-progress: true

jobs:
  route-legacy:
    name: Route legacy PR notification
    # A v1 bridge hint without a branch or a head is not a dev authorization.
    if: ${{ github.event.client_payload.target_branch == null && github.event.client_payload.head_sha == null }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      wake_dev: ${{ steps.route.outputs.wake_dev }}
    steps:
      - name: Mask target repository identity
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -r '(.client_payload.repository // "") | select(type == "string" and length > 0)' "$GITHUB_EVENT_PATH" |
            while IFS= read -r identity; do
              printf '::add-mask::%s\n' "$identity"
            done

      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Validate legacy PR request
        id: payload
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: node scripts/validate-pr-payload.ts "$PAYLOAD"

      - name: Resolve PR API scope
        id: api_scope
        env:
          TARGET_REPOSITORY: ${{ steps.payload.outputs.repository }}
        run: node scripts/resolve-github-api-scope.ts pr

      - name: Mint legacy PR read token
        id: app_read
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.api_scope.outputs.owner }}
          repositories: ${{ steps.api_scope.outputs.repository_name }}
          permission-pull-requests: read

      - name: Resolve live legacy notification route
        id: route
        env:
          GH_TOKEN: ${{ steps.api_scope.outputs.is_control_repository == 'true' && github.token || steps.app_read.outputs.token }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          PR_NUMBER: ${{ steps.payload.outputs.pr_number }}
        run: node scripts/resolve-pr-facts.ts route-legacy

      - name: Mint scoped intake dispatch token
        if: steps.route.outputs.wake_dev == 'true'
        id: dispatch_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Wake central intake for development PR
        if: steps.route.outputs.wake_dev == 'true'
        env:
          GH_TOKEN: ${{ steps.dispatch_app.outputs.token }}
          TARGET_REPOSITORY: ${{ steps.payload.outputs.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -cn --arg repository "$TARGET_REPOSITORY" '{event_type:"run-intake",client_payload:{repository:$repository}}' |
            gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" --input -

  govern:
    needs: route-legacy
    if: ${{ !cancelled() && (needs.route-legacy.result == 'skipped' || (needs.route-legacy.result == 'success' && needs.route-legacy.outputs.wake_dev == 'false')) }}
    name: PR Governance
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      target_branch: ${{ steps.payload.outputs.target_branch }}
      approved: ${{ steps.payload.outputs.target_branch == 'main' && steps.gate.outputs.passed == 'true' && steps.ownership.outputs.current == 'true' && steps.cancellation.outputs.cancelled != 'true' }}
      dev_approved: ${{ steps.dev_admission.outputs.admitted == 'true' && steps.cancellation.outputs.cancelled != 'true' }}
      dev_base: ${{ steps.resolved.outputs.base_sha }}
    env:
      AW_AI_AGENT_CONFIG: ${{ vars.AW_AI_AGENT_CONFIG }}

    steps:
      - name: Mask target repository and commit identities
        shell: bash
        run: |
          set -Eeuo pipefail
          # Never put unmasked client_payload values into a workflow expression or step env.
          jq -r '
            (.client_payload // {}) |
            [.repository, .head_sha, .base_sha, .merge_sha] |
            .[]? | select(type == "string" and length > 0)
          ' "$GITHUB_EVENT_PATH" | while IFS= read -r identity; do
            printf '::add-mask::%s\n' "$identity"
          done

      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Validate PR request
        id: payload
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: node scripts/validate-pr-payload.ts "$PAYLOAD" --pr-governance

      - name: Resolve PR API scope
        id: api_scope
        env:
          TARGET_REPOSITORY: ${{ steps.payload.outputs.repository }}
        run: node scripts/resolve-github-api-scope.ts pr

      - name: Mint PR read token
        id: app_read
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.api_scope.outputs.owner }}
          repositories: ${{ steps.api_scope.outputs.is_control_repository == 'true' && github.event.repository.name || format('{0},{1}', github.event.repository.name, steps.api_scope.outputs.repository_name) }}
          permission-contents: read
          permission-pull-requests: read
          permission-actions: read
          permission-statuses: read

      - name: Validate control credential
        env:
          GH_TOKEN: ${{ steps.api_scope.outputs.is_control_repository == 'true' && github.token || steps.app_read.outputs.token }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          PR_NUMBER: ${{ steps.payload.outputs.pr_number }}
        run: node scripts/validate-control-access.ts "$REPOSITORY" "$PR_NUMBER"

      - name: Fetch PR facts
        id: facts
        env:
          GH_TOKEN: ${{ steps.api_scope.outputs.is_control_repository == 'true' && github.token || steps.app_read.outputs.token }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          PR_NUMBER: ${{ steps.payload.outputs.pr_number }}
          AW_CI_TARGET_BRANCH: ${{ steps.payload.outputs.target_branch }}
        run: node scripts/resolve-pr-facts.ts fetch

      - name: Verify immutable development request
        if: steps.payload.outputs.target_branch == 'dev'
        env:
          REQUESTED_HEAD: ${{ github.event.client_payload.head_sha }}
          RESOLVED_HEAD: ${{ steps.facts.outputs.head_sha }}
        run: test "$REQUESTED_HEAD" = "$RESOLVED_HEAD"

      - name: Checkout target PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.payload.outputs.repository }}
          ref: refs/pull/${{ steps.payload.outputs.pr_number }}/head
          token: ${{ steps.app_read.outputs.token }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve checked-out PR facts
        id: resolved
        env:
          GH_TOKEN: ${{ steps.api_scope.outputs.is_control_repository == 'true' && github.token || steps.app_read.outputs.token }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          PR_NUMBER: ${{ steps.payload.outputs.pr_number }}
          INITIAL_BASE_SHA: ${{ steps.facts.outputs.base_sha }}
          INITIAL_HEAD_SHA: ${{ steps.facts.outputs.head_sha }}
          INITIAL_TITLE: ${{ steps.facts.outputs.title }}
          AW_CI_TARGET_BRANCH: ${{ steps.payload.outputs.target_branch }}
          AW_EXPECTED_PR_HEAD: ${{ github.event.client_payload.head_sha }}
        run: node scripts/resolve-pr-facts.ts resolve

      - name: Fingerprint checked PR title
        id: title
        env:
          PR_TITLE: ${{ steps.resolved.outputs.title }}
        run: node scripts/pr-title-fingerprint.ts "$PR_TITLE"

      - name: Check deploy configuration gaps
        id: deploy_gap
        if: ${{ always() && steps.payload.outputs.target_branch == 'main' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app_read.outputs.token }}
          CONTROL_REPOSITORY: ${{ github.repository }}
          TARGET_REPOSITORY: ${{ steps.payload.outputs.repository }}
          PR_NUMBER: ${{ steps.payload.outputs.pr_number }}
        run: node scripts/check-deploy-gap.ts "$CONTROL_REPOSITORY" "$TARGET_REPOSITORY" "$PR_NUMBER" "$GH_TOKEN"

      - name: Mint pending status token
        id: status_pending_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.api_scope.outputs.owner }}
          repositories: ${{ steps.api_scope.outputs.repository_name }}
          permission-statuses: write

      - name: Mark governance in progress
        id: mark_governance
        env:
          GH_TOKEN: ${{ steps.status_pending_app.outputs.token }}
          AW_STATUS_API_TOKEN: ${{ steps.status_pending_app.outputs.token }}
          AW_STATUS_KEYRING: ${{ secrets.AW_STATUS_KEYRING }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          HEAD_SHA: ${{ steps.resolved.outputs.head_sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AW_PR_TARGET_BRANCH: ${{ steps.payload.outputs.target_branch }}
        run: node scripts/set-pr-status.ts "$REPOSITORY" "$HEAD_SHA" pending "Action Worker PR governance in progress" "$RUN_URL"

      - name: Mark central merge gate in progress
        env:
          GH_TOKEN: ${{ steps.status_pending_app.outputs.token }}
          AW_STATUS_API_TOKEN: ${{ steps.status_pending_app.outputs.token }}
          AW_STATUS_KEYRING: ${{ secrets.AW_STATUS_KEYRING }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          HEAD_SHA: ${{ steps.resolved.outputs.head_sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AW_PR_TARGET_BRANCH: ${{ steps.payload.outputs.target_branch }}
          PR_STATUS_CONTEXT: validate-merge
        run: node scripts/set-pr-status.ts "$REPOSITORY" "$HEAD_SHA" pending "Action Worker merge gate in progress" "$RUN_URL"

      # Fail fast on conflicts. Only same-repository behind branches may be
      # refreshed automatically, and their changed HEAD requires fresh CI.
      - name: Check PR mergeability before expensive CI
        id: merge_preflight
        env:
          GH_TOKEN: ${{ steps.api_scope.outputs.is_control_repository == 'true' && github.token || steps.app_read.outputs.token }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          PR_NUMBER: ${{ steps.payload.outputs.pr_number }}
          HEAD_SHA: ${{ steps.resolved.outputs.head_sha }}
          BASE_SHA: ${{ steps.resolved.outputs.base_sha }}
          AW_PR_TARGET_BRANCH: ${{ steps.payload.outputs.target_branch }}
        run: node scripts/pr-merge-preflight.ts "$REPOSITORY" "$PR_NUMBER" "$HEAD_SHA" "$BASE_SHA"

      - name: Mint PR branch refresh token
        if: steps.payload.outputs.target_branch == 'main' && steps.merge_preflight.outputs.needs_refresh == 'true'
        id: refresh_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.api_scope.outputs.owner }}
          repositories: ${{ steps.api_scope.outputs.repository_name }}
          permission-contents: write

      - name: Refresh behind branch before expensive CI
        if: steps.payload.outputs.target_branch == 'main' && steps.merge_preflight.outputs.needs_refresh == 'true'
        env:
          GH_TOKEN: ${{ steps.refresh_app.outputs.token }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          PR_NUMBER: ${{ steps.payload.outputs.pr_number }}
          HEAD_SHA: ${{ steps.resolved.outputs.head_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api --method PUT "repos/$REPOSITORY/pulls/$PR_NUMBER/update-branch" -f "expected_head_sha=$HEAD_SHA"
          echo "::error::PR branch refreshed before CI; new HEAD requires a fresh signed gate."
          exit 75

      - name: Validate change record
        id: change
        env:
          PR_TITLE: ${{ steps.resolved.outputs.title }}
          AW_VALIDATED_REPOSITORY: ${{ steps.payload.outputs.repository }}
          BASE_SHA: ${{ steps.resolved.outputs.base_sha }}
          HEAD_SHA: ${{ steps.resolved.outputs.head_sha }}
        run: node scripts/validate-change-record.ts "$PR_TITLE" "$BASE_SHA" "$HEAD_SHA" "$GITHUB_WORKSPACE/target" "$GITHUB_WORKSPACE/policies"

      - name: Validate engineering language
        env:
          BASE_SHA: ${{ steps.resolved.outputs.base_sha }}
          HEAD_SHA: ${{ steps.resolved.outputs.head_sha }}
        run: node scripts/validate-engineering-language.ts "$BASE_SHA" "$HEAD_SHA" "$GITHUB_WORKSPACE/target"

      - name: Detect project and change
        id: context
        env:
          BASE_SHA: ${{ steps.resolved.outputs.base_sha }}
          HEAD_SHA: ${{ steps.resolved.outputs.head_sha }}
          CHANGE_RECORD_JSON: ${{ steps.change.outputs.json }}
        run: node scripts/detect-pr-context.ts "$BASE_SHA" "$HEAD_SHA" "$GITHUB_WORKSPACE/target" "$GITHUB_WORKSPACE/policies"

      - name: Resolve base plan
        id: base_plan
        # The preceding detection step wrote the complete context to a job-local
        # file. Passing 20k+ file paths through env/argv exceeds Linux ARG_MAX.
        # Deterministic gates alone authorize auto-merge; advisory AI review is opt-in.
        run: node scripts/resolve-pr-plan.ts @pr-context-file inherit off inherit auto auto "$GITHUB_WORKSPACE/policies"

      - name: Enforce main write CI contract
        if: steps.base_plan.outputs.ci_required != 'true'
        shell: bash
        run: |
          echo "::error::A managed PR must run verified central CI before merge. The CI plan cannot emit a no-CI success in the Main Write Guard trust chain." >&2
          exit 1

      - name: Validate naming rules
        if: steps.base_plan.outputs.naming_required == 'true'
        env:
          BASE_SHA: ${{ steps.resolved.outputs.base_sha }}
          HEAD_SHA: ${{ steps.resolved.outputs.head_sha }}
        working-directory: target
        run: node "$GITHUB_WORKSPACE/scripts/validate-naming-rules.ts" "$BASE_SHA" "$HEAD_SHA"

      - name: Validate security gate
        env:
          BASE_SHA: ${{ steps.resolved.outputs.base_sha }}
          HEAD_SHA: ${{ steps.resolved.outputs.head_sha }}
        run: node scripts/validate-security.ts "$BASE_SHA" "$HEAD_SHA" "$GITHUB_WORKSPACE/target" "$GITHUB_WORKSPACE/policies/security.json"

      # Change code from an author without write access runs centrally only after a maintainer
      # approves the current head commit. Until then the run reports "awaiting approval" and stops
      # before CI; central intake picks the pull request up again once the approval exists.
      - name: Enforce PR trust
        id: trust
        env:
          PR_TRUST_UNTRUSTED: report
          GH_TOKEN: ${{ steps.app_read.outputs.token }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          PR_NUMBER: ${{ steps.payload.outputs.pr_number }}
          HEAD_SHA: ${{ steps.resolved.outputs.head_sha }}
        run: node scripts/pr-trust.ts "$REPOSITORY" "$PR_NUMBER" "$HEAD_SHA"

      - name: Dispatch centralized CI
        if: steps.trust.outputs.trusted == 'true' && steps.base_plan.outputs.ci_required == 'true'
        uses: ./.github/actions/mint-app-token
        id: ci_dispatch_status_app
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.api_scope.outputs.owner }}
          repositories: ${{ steps.api_scope.outputs.repository_name }}
          permission-statuses: write

      - name: Mint centralized CI dispatch token
        if: steps.trust.outputs.trusted == 'true' && steps.base_plan.outputs.ci_required == 'true'
        id: ci_dispatch_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Dispatch centralized CI
        id: ci_dispatch
        if: steps.trust.outputs.trusted == 'true' && steps.base_plan.outputs.ci_required == 'true'
        env:
          GH_TOKEN: ${{ steps.ci_dispatch_status_app.outputs.token }}
          AW_CONTROL_TOKEN: ${{ steps.app_read.outputs.token }}
          AW_STATUS_API_TOKEN: ${{ steps.ci_dispatch_status_app.outputs.token }}
          AW_STATUS_KEYRING: ${{ secrets.AW_STATUS_KEYRING }}
          AW_DISPATCH_API_TOKEN: ${{ steps.ci_dispatch_app.outputs.token }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          PR_NUMBER: ${{ steps.payload.outputs.pr_number }}
          REQUEST_ID: ${{ github.event.client_payload.request_id }}
          TARGET_BRANCH: ${{ steps.payload.outputs.target_branch }}
          HEAD_SHA: ${{ steps.resolved.outputs.head_sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/dispatch-central-ci.ts \
            "$REPOSITORY" \
            "$PR_NUMBER" \
            "$REQUEST_ID" \
            "$HEAD_SHA" \
            "$RUN_URL" \
            "$GITHUB_WORKSPACE/policies/execution.json" \
            "$TARGET_BRANCH"

      # CI now owns a signed pending lease. Release the governance runner and
      # reopen a fresh gate after verified completion instead of polling for
      # the full Windows CI duration. Only terminal evidence may finish a gate.
      - name: Collect CI evidence
        if: steps.trust.outputs.trusted == 'true' && steps.base_plan.outputs.ci_required == 'true' && steps.ci_dispatch.outputs.deferred != 'true'
        env:
          # This step reads both PR metadata and commit statuses through separate scoped credentials.
          # Use the separately configured control read credential; no token fallback.
          GH_TOKEN: ${{ steps.app_read.outputs.token }}
          AW_CONTROL_TOKEN: ${{ steps.app_read.outputs.token }}
          AW_STATUS_API_TOKEN: ${{ steps.api_scope.outputs.is_control_repository == 'true' && github.token || steps.app_read.outputs.token }}
          AW_STATUS_KEYRING: ${{ secrets.AW_STATUS_KEYRING }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          HEAD_SHA: ${{ steps.resolved.outputs.head_sha }}
          PR_NUMBER: ${{ steps.payload.outputs.pr_number }}
          CI_EVIDENCE_PATH: /tmp/ci-evidence.json
          TARGET_BRANCH: ${{ steps.payload.outputs.target_branch }}
        run: node scripts/wait-ci-evidence.ts "$REPOSITORY" "$HEAD_SHA" "$GITHUB_WORKSPACE/policies/execution.json" "$PR_NUMBER" "$TARGET_BRANCH"

      - name: Validate CI evidence
        if: steps.trust.outputs.trusted == 'true' && steps.base_plan.outputs.ci_required == 'true' && steps.ci_dispatch.outputs.deferred != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/validate-ci-evidence.ts /tmp/ci-evidence.json

      - name: Verify current dev governance scope
        id: dev_scope
        if: steps.payload.outputs.target_branch == 'dev' && steps.ci_dispatch.outputs.deferred != 'true'
        env:
          AW_CONTROL_TOKEN: ${{ steps.app_read.outputs.token }}
          AW_STATUS_API_TOKEN: ${{ steps.app_read.outputs.token }}
          AW_STATUS_KEYRING: ${{ secrets.AW_STATUS_KEYRING }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          PR_NUMBER: ${{ steps.payload.outputs.pr_number }}
          HEAD_SHA: ${{ steps.resolved.outputs.head_sha }}
          BASE_SHA: ${{ steps.resolved.outputs.base_sha }}
          TITLE_FINGERPRINT: ${{ steps.title.outputs.fingerprint }}
        run: node scripts/verify-dev-governance.ts

      - name: Mark deterministic gate passed
        id: gate
        if: steps.trust.outputs.trusted == 'true' && steps.ci_dispatch.outputs.deferred != 'true'
        shell: bash
        run: echo "passed=true" >> "$GITHUB_OUTPUT"

      # CI may run longer than one App token lifetime. Re-mint for the final ownership
      # and advisory publication reads rather than reusing the early governance token.
      - name: Mint final governance read token
        id: final_read_app
        if: ${{ always() && steps.api_scope.outputs.repository_name != '' && steps.resolved.outputs.head_sha != '' && steps.ci_dispatch.outputs.deferred != 'true' }}
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.api_scope.outputs.owner }}
          repositories: ${{ steps.api_scope.outputs.is_control_repository == 'true' && github.event.repository.name || format('{0},{1}', github.event.repository.name, steps.api_scope.outputs.repository_name) }}
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read
          permission-statuses: read

      - name: Resolve governance ownership
        id: ownership
        if: ${{ always() && steps.resolved.outputs.head_sha != '' && steps.ci_dispatch.outputs.deferred != 'true' }}
        env:
          GH_TOKEN: ${{ steps.final_read_app.outputs.token }}
          AW_STATUS_API_TOKEN: ${{ steps.api_scope.outputs.is_control_repository == 'true' && github.token || steps.final_read_app.outputs.token }}
          AW_STATUS_KEYRING: ${{ secrets.AW_STATUS_KEYRING }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          HEAD_SHA: ${{ steps.resolved.outputs.head_sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GOVERNANCE_CONTEXT: ${{ steps.payload.outputs.target_branch == 'dev' && 'Dev PR Governance' || 'PR Governance' }}
        run: node scripts/check-status-owner.ts "$REPOSITORY" "$HEAD_SHA" "$RUN_URL" "$GOVERNANCE_CONTEXT"

      # Records a cancelled run. The context is only readable in a step condition, so the final
      # gates below read this output instead of calling cancelled() themselves.
      - name: Note cancellation
        id: cancellation
        if: ${{ cancelled() }}
        run: echo "cancelled=true" >> "$GITHUB_OUTPUT"

      # Runs even when this run is cancelled or times out. Skipping it on cancellation left the
      # status this run published pending for ever, so the Main Write Audit could never trust a merge
      # of that head. A cancelled run is failed explicitly; it never reports success.
      - name: Mint final status token
        if: ${{ always() && steps.ownership.outputs.current == 'true' }}
        id: final_status_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.api_scope.outputs.owner }}
          repositories: ${{ steps.api_scope.outputs.repository_name }}
          permission-statuses: write

      - name: Update final gate
        if: ${{ always() && steps.ownership.outputs.current == 'true' }}
        env:
          GH_TOKEN: ${{ steps.final_status_app.outputs.token }}
          AW_STATUS_API_TOKEN: ${{ steps.final_status_app.outputs.token }}
          AW_STATUS_KEYRING: ${{ secrets.AW_STATUS_KEYRING }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          HEAD_SHA: ${{ steps.resolved.outputs.head_sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATE: ${{ steps.cancellation.outputs.cancelled != 'true' && steps.gate.outputs.passed == 'true' && 'success' || 'failure' }}
          DESCRIPTION: ${{ steps.cancellation.outputs.cancelled == 'true' && 'Action Worker PR governance was cancelled' || steps.gate.outputs.passed == 'true' && 'Action Worker PR governance passed' || steps.trust.outputs.trusted == 'false' && 'Awaiting maintainer approval of the current head commit' || 'Action Worker PR governance failed' }}
          TITLE_FINGERPRINT: ${{ steps.title.outputs.fingerprint }}
          AW_PR_TARGET_BRANCH: ${{ steps.payload.outputs.target_branch }}
          AW_DEV_GOVERNANCE_RECEIPT: ${{ steps.dev_scope.outputs.receipt }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$TITLE_FINGERPRINT" =~ ^[a-f0-9]{64}$ ]] &&
             [[ "$DESCRIPTION" != "Awaiting maintainer approval of the current head commit" ]]; then
            DESCRIPTION="title-sha256=$TITLE_FINGERPRINT $DESCRIPTION"
          fi
          node scripts/set-pr-status.ts "$REPOSITORY" "$HEAD_SHA" "$STATE" "$DESCRIPTION" "$RUN_URL"

      - name: Update central merge gate
        if: ${{ always() && steps.ownership.outputs.current == 'true' }}
        env:
          GH_TOKEN: ${{ steps.final_status_app.outputs.token }}
          AW_STATUS_API_TOKEN: ${{ steps.final_status_app.outputs.token }}
          AW_STATUS_KEYRING: ${{ secrets.AW_STATUS_KEYRING }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          HEAD_SHA: ${{ steps.resolved.outputs.head_sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATE: ${{ steps.cancellation.outputs.cancelled != 'true' && steps.gate.outputs.passed == 'true' && 'success' || 'failure' }}
          DESCRIPTION: ${{ steps.cancellation.outputs.cancelled == 'true' && 'Action Worker merge gate was cancelled' || steps.gate.outputs.passed == 'true' && 'Action Worker merge gate passed' || steps.trust.outputs.trusted == 'false' && 'Awaiting maintainer approval of the current head commit' || 'Action Worker merge gate failed' }}
          TITLE_FINGERPRINT: ${{ steps.title.outputs.fingerprint }}
          AW_PR_TARGET_BRANCH: ${{ steps.payload.outputs.target_branch }}
          AW_DEV_GOVERNANCE_RECEIPT: ${{ steps.dev_scope.outputs.receipt }}
          PR_STATUS_CONTEXT: validate-merge
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$TITLE_FINGERPRINT" =~ ^[a-f0-9]{64}$ ]] &&
             [[ "$DESCRIPTION" != "Awaiting maintainer approval of the current head commit" ]]; then
            DESCRIPTION="title-sha256=$TITLE_FINGERPRINT $DESCRIPTION"
          fi
          node scripts/set-pr-status.ts "$REPOSITORY" "$HEAD_SHA" "$STATE" "$DESCRIPTION" "$RUN_URL"

      - name: Verify dev merge admission without write access
        id: dev_admission
        if: steps.payload.outputs.target_branch == 'dev' && steps.gate.outputs.passed == 'true' && steps.ownership.outputs.current == 'true' && steps.cancellation.outputs.cancelled != 'true' && !cancelled()
        env:
          AW_CONTROL_TOKEN: ${{ steps.final_read_app.outputs.token }}
          AW_STATUS_API_TOKEN: ${{ steps.final_read_app.outputs.token }}
          AW_STATUS_KEYRING: ${{ secrets.AW_STATUS_KEYRING }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          PR_NUMBER: ${{ steps.payload.outputs.pr_number }}
          HEAD_SHA: ${{ steps.resolved.outputs.head_sha }}
          BASE_SHA: ${{ steps.resolved.outputs.base_sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/dev-merge-admission.ts

      # The security verdict is final at this point. Automatic merge execution
      # runs in an independent non-blocking job, never inside PR Governance.

      - name: Publish PR review
        if: ${{ always() && !cancelled() && steps.ownership.outputs.current == 'true' && steps.payload.outputs.target_branch == 'main' }}
        id: issue_app
        continue-on-error: true
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.api_scope.outputs.owner }}
          repositories: ${{ steps.api_scope.outputs.repository_name }}
          permission-issues: write
          permission-pull-requests: write

      - name: Publish PR review
        if: ${{ always() && !cancelled() && steps.ownership.outputs.current == 'true' && steps.payload.outputs.target_branch == 'main' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.issue_app.outputs.token }}
          AW_ISSUE_API_TOKEN: ${{ steps.issue_app.outputs.token }}
          AW_CONTROL_TOKEN: ${{ steps.final_read_app.outputs.token }}
          AW_STATUS_API_TOKEN: ${{ steps.final_status_app.outputs.token }}
          AW_STATUS_KEYRING: ${{ secrets.AW_STATUS_KEYRING }}
          HEAD_SHA: ${{ steps.resolved.outputs.head_sha }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          PR_NUMBER: ${{ steps.payload.outputs.pr_number }}
          GOVERNANCE_STATUS: ${{ steps.gate.outputs.passed == 'true' && 'success' || steps.trust.outputs.trusted == 'false' && 'awaiting-approval' || 'failure' }}
          AI_REVIEW_STATE: ""
          DEPLOY_GAP_HINT: ${{ steps.deploy_gap.outputs.hint }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/publish-pr-review.ts "$REPOSITORY" "$PR_NUMBER" "$GOVERNANCE_STATUS" "$RUN_URL" /tmp/pr-plan.json /tmp/ocr-result.json "$AI_REVIEW_STATE" "$DEPLOY_GAP_HINT"

  # Execution domain. Only a fully completed, successful governance job may
  # request a merge. Operational merge errors remain visible in this job but
  # must never invalidate previously signed CI/security approval of a PR head.
  auto-merge:
    name: Automatic squash merge (operational)
    needs: govern
    if: ${{ needs.govern.result == 'success' && needs.govern.outputs.approved == 'true' }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: read

    steps:
      - name: Mask target repository and commit identities
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -r '
            (.client_payload // {}) |
            [.repository, .head_sha, .base_sha, .merge_sha] |
            .[]? | select(type == "string" and length > 0)
          ' "$GITHUB_EVENT_PATH" | while IFS= read -r identity; do
            printf '::add-mask::%s\n' "$identity"
          done

      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Validate PR request
        id: payload
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: node scripts/validate-pr-payload.ts "$PAYLOAD" --pr-governance

      - name: Resolve PR API scope
        id: api_scope
        env:
          TARGET_REPOSITORY: ${{ steps.payload.outputs.repository }}
        run: node scripts/resolve-github-api-scope.ts pr

      - name: Mint PR read token
        id: app_read
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.api_scope.outputs.owner }}
          repositories: ${{ steps.api_scope.outputs.is_control_repository == 'true' && github.event.repository.name || format('{0},{1}', github.event.repository.name, steps.api_scope.outputs.repository_name) }}
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read
          permission-statuses: read
          permission-issues: read

      - name: Fetch exact pull request identity
        if: needs.govern.outputs.target_branch == 'main'
        id: facts
        env:
          GH_TOKEN: ${{ steps.api_scope.outputs.is_control_repository == 'true' && github.token || steps.app_read.outputs.token }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          PR_NUMBER: ${{ steps.payload.outputs.pr_number }}
          ALLOW_MERGED_PR: "true"
        run: node scripts/resolve-pr-facts.ts fetch

      - name: Mint automatic merge token
        id: merge_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.api_scope.outputs.owner }}
          repositories: ${{ steps.api_scope.outputs.repository_name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Automatically merge CI-green PR
        if: needs.govern.outputs.target_branch == 'main'
        env:
          AW_MERGE_READ_TOKEN: ${{ steps.app_read.outputs.token }}
          AW_MERGE_WRITE_TOKEN: ${{ steps.merge_app.outputs.token }}
          AW_STATUS_KEYRING: ${{ secrets.AW_STATUS_KEYRING }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          PR_NUMBER: ${{ steps.payload.outputs.pr_number }}
          HEAD_SHA: ${{ steps.facts.outputs.head_sha }}
          BASE_SHA: ${{ steps.facts.outputs.base_sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/auto-merge-pr.ts "$REPOSITORY" "$PR_NUMBER" "$HEAD_SHA" "$BASE_SHA" "$RUN_URL"

  dev-merge:
    name: Development squash merge (operational)
    environment:
      name: admin-ops
      deployment: false
    needs: govern
    if: ${{ needs.govern.result == 'success' && needs.govern.outputs.dev_approved == 'true' && needs.govern.outputs.target_branch == 'dev' }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: read

    steps:
      - name: Mask target repository and commit identities
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -r '
            (.client_payload // {}) |
            [.repository, .head_sha, .base_sha, .merge_sha] |
            .[]? | select(type == "string" and length > 0)
          ' "$GITHUB_EVENT_PATH" | while IFS= read -r identity; do
            printf '::add-mask::%s\n' "$identity"
          done

      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Validate PR request
        id: payload
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: node scripts/validate-pr-payload.ts "$PAYLOAD" --pr-governance

      - name: Resolve PR API scope
        id: api_scope
        env:
          TARGET_REPOSITORY: ${{ steps.payload.outputs.repository }}
        run: node scripts/resolve-github-api-scope.ts pr

      - name: Mint PR read token
        id: app_read
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.api_scope.outputs.owner }}
          repositories: ${{ steps.api_scope.outputs.is_control_repository == 'true' && github.event.repository.name || format('{0},{1}', github.event.repository.name, steps.api_scope.outputs.repository_name) }}
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read
          permission-statuses: read
          permission-issues: read

      - name: Verify protected dev execution boundary
        if: needs.govern.outputs.target_branch == 'dev'
        id: dev_execution
        env:
          AW_PROTECTION_READ_TOKEN: ${{ secrets.AW_ADMIN_TOKEN }}
          AW_CONTROL_TOKEN: ${{ steps.app_read.outputs.token }}
          AW_STATUS_API_TOKEN: ${{ steps.app_read.outputs.token }}
          AW_STATUS_KEYRING: ${{ secrets.AW_STATUS_KEYRING }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          PR_NUMBER: ${{ steps.payload.outputs.pr_number }}
          HEAD_SHA: ${{ github.event.client_payload.head_sha }}
          BASE_SHA: ${{ needs.govern.outputs.dev_base }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/dev-merge-execution.ts authorize

      - name: Mint development merge receipt token
        if: steps.dev_execution.outputs.enabled == 'true'
        id: dev_receipt_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.api_scope.outputs.owner }}
          repositories: ${{ steps.api_scope.outputs.repository_name }}
          permission-statuses: write

      - name: Mint automatic merge token
        if: steps.dev_execution.outputs.enabled == 'true'
        id: merge_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.api_scope.outputs.owner }}
          repositories: ${{ steps.api_scope.outputs.repository_name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Execute admitted development merge
        if: steps.dev_execution.outputs.enabled == 'true'
        env:
          AW_PROTECTION_READ_TOKEN: ${{ secrets.AW_ADMIN_TOKEN }}
          AW_CONTROL_TOKEN: ${{ steps.app_read.outputs.token }}
          AW_STATUS_API_TOKEN: ${{ steps.dev_receipt_app.outputs.token }}
          AW_MERGE_WRITE_TOKEN: ${{ steps.merge_app.outputs.token }}
          AW_STATUS_KEYRING: ${{ secrets.AW_STATUS_KEYRING }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          PR_NUMBER: ${{ steps.payload.outputs.pr_number }}
          HEAD_SHA: ${{ github.event.client_payload.head_sha }}
          BASE_SHA: ${{ needs.govern.outputs.dev_base }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/dev-merge-execution.ts execute

  # Control domain. The governance run can end before it marks its head: the pull request may be
  # merged or closed first ("Target PR is not open"), or the run may be cancelled or time out. The
  # status intake queued for it then stays pending for ever, and the Main Write Audit can never
  # accept that head. This job resolves such an unfinished status to a failure. It runs no pull
  # request code, only reads the pull request and writes the status.
  resolve-unfinished:
    name: Resolve unfinished PR Governance
    needs: govern
    if: ${{ always() && (needs.govern.result == 'failure' || needs.govern.result == 'cancelled') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read

    steps:
      - name: Mask target repository and commit identities
        shell: bash
        run: |
          set -Eeuo pipefail
          # Never put unmasked client_payload values into a workflow expression or step env.
          jq -r '
            (.client_payload // {}) |
            [.repository, .head_sha, .base_sha, .merge_sha] |
            .[]? | select(type == "string" and length > 0)
          ' "$GITHUB_EVENT_PATH" | while IFS= read -r identity; do
            printf '::add-mask::%s\n' "$identity"
          done

      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Resolve unfinished status scope
        id: status_scope
        env:
          TARGET_REPOSITORY: ${{ github.event.client_payload.repository }}
        run: node scripts/resolve-github-api-scope.ts pr

      - name: Mint unfinished status token
        id: status_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.status_scope.outputs.owner }}
          repositories: ${{ steps.status_scope.outputs.repository_name }}
          permission-statuses: write

      - name: Mint unfinished governance read token
        id: unfinished_read_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.status_scope.outputs.owner }}
          repositories: ${{ steps.status_scope.outputs.is_control_repository == 'true' && github.event.repository.name || format('{0},{1}', github.event.repository.name, steps.status_scope.outputs.repository_name) }}
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read
          permission-statuses: read

      - name: Resolve unfinished PR governance
        env:
          GH_TOKEN: ${{ steps.unfinished_read_app.outputs.token }}
          AW_CONTROL_TOKEN: ${{ steps.unfinished_read_app.outputs.token }}
          AW_STATUS_API_TOKEN: ${{ steps.status_app.outputs.token }}
          AW_STATUS_KEYRING: ${{ secrets.AW_STATUS_KEYRING }}
          CONTROL_REPOSITORY: ${{ github.repository }}
          REPOSITORY: ${{ github.event.client_payload.repository }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AW_PR_TARGET_BRANCH: ${{ needs.govern.outputs.target_branch || 'main' }}
          AW_EXPECTED_PR_HEAD: ${{ github.event.client_payload.head_sha }}
          REQUESTED_BRANCH: ${{ github.event.client_payload.target_branch || 'main' }}
        run: |
          if [[ "$AW_PR_TARGET_BRANCH" != "$REQUESTED_BRANCH" ]]; then exit 0; fi
          node scripts/resolve-unfinished-governance.ts "$REPOSITORY" "$PR_NUMBER" "$RUN_URL"
