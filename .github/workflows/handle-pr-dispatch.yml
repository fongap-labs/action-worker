name: Handle PR Dispatch

on:
  repository_dispatch:
    types: [run-pr-governance]

permissions:
  contents: read
  actions: read

concurrency:
  group: pr-governance-${{ github.event.client_payload.repository }}-${{ github.event.client_payload.pr_number }}
  cancel-in-progress: true

jobs:
  govern:
    name: PR Governance
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      AW_AI_AGENT_CONFIG: ${{ vars.AW_AI_AGENT_CONFIG }}

    steps:
      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Validate PR request
        id: payload
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          AW_REPOSITORY_POLICY: ${{ vars.AW_REPOSITORY_POLICY }}
        run: node scripts/validate-pr-payload.ts "$PAYLOAD"

      - name: Validate control credential
        env:
          GH_TOKEN: ${{ secrets.AW_CONTROL_TOKEN }}
          AW_REPOSITORY_POLICY: ${{ vars.AW_REPOSITORY_POLICY }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          PR_NUMBER: ${{ steps.payload.outputs.pr_number }}
        run: node scripts/validate-control-access.ts "$REPOSITORY" "$PR_NUMBER"

      - name: Fetch PR facts
        id: facts
        env:
          GH_TOKEN: ${{ secrets.AW_CONTROL_TOKEN }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          PR_NUMBER: ${{ steps.payload.outputs.pr_number }}
        run: node scripts/resolve-pr-facts.ts fetch

      - name: Checkout target PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.payload.outputs.repository }}
          ref: refs/pull/${{ steps.payload.outputs.pr_number }}/head
          token: ${{ secrets.AW_CONTROL_TOKEN }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve checked-out PR facts
        id: resolved
        env:
          GH_TOKEN: ${{ secrets.AW_CONTROL_TOKEN }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          PR_NUMBER: ${{ steps.payload.outputs.pr_number }}
          INITIAL_BASE_SHA: ${{ steps.facts.outputs.base_sha }}
          INITIAL_HEAD_SHA: ${{ steps.facts.outputs.head_sha }}
          INITIAL_TITLE: ${{ steps.facts.outputs.title }}
        run: node scripts/resolve-pr-facts.ts resolve

      - name: Mark governance in progress
        env:
          GH_TOKEN: ${{ secrets.AW_CONTROL_TOKEN }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          HEAD_SHA: ${{ steps.resolved.outputs.head_sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/set-pr-status.ts "$REPOSITORY" "$HEAD_SHA" pending "Action Worker PR governance in progress" "$RUN_URL"

      - name: Mark central merge gate in progress
        env:
          GH_TOKEN: ${{ secrets.AW_CONTROL_TOKEN }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          HEAD_SHA: ${{ steps.resolved.outputs.head_sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_STATUS_CONTEXT: validate-merge
        run: node scripts/set-pr-status.ts "$REPOSITORY" "$HEAD_SHA" pending "Action Worker merge gate in progress" "$RUN_URL"

      - name: Validate change record
        id: change
        env:
          PR_TITLE: ${{ steps.resolved.outputs.title }}
          BASE_SHA: ${{ steps.resolved.outputs.base_sha }}
          HEAD_SHA: ${{ steps.resolved.outputs.head_sha }}
        run: node scripts/validate-change-record.ts "$PR_TITLE" "$BASE_SHA" "$HEAD_SHA" "$GITHUB_WORKSPACE/target" "$GITHUB_WORKSPACE/policies"

      - name: Validate engineering language
        env:
          BASE_SHA: ${{ steps.resolved.outputs.base_sha }}
          HEAD_SHA: ${{ steps.resolved.outputs.head_sha }}
        run: node scripts/validate-engineering-language.ts "$BASE_SHA" "$HEAD_SHA" "$GITHUB_WORKSPACE/target"

      - name: Detect project and change
        id: context
        env:
          BASE_SHA: ${{ steps.resolved.outputs.base_sha }}
          HEAD_SHA: ${{ steps.resolved.outputs.head_sha }}
          CHANGE_RECORD_JSON: ${{ steps.change.outputs.json }}
        run: node scripts/detect-pr-context.ts "$BASE_SHA" "$HEAD_SHA" "$GITHUB_WORKSPACE/target" "$GITHUB_WORKSPACE/policies"

      - name: Resolve base plan
        id: base_plan
        env:
          CONTEXT_JSON: ${{ steps.context.outputs.json }}
        run: node scripts/resolve-pr-plan.ts "$CONTEXT_JSON" inherit inherit inherit auto auto "$GITHUB_WORKSPACE/policies"

      - name: Validate naming rules
        if: steps.base_plan.outputs.naming_required == 'true'
        env:
          BASE_SHA: ${{ steps.resolved.outputs.base_sha }}
          HEAD_SHA: ${{ steps.resolved.outputs.head_sha }}
        working-directory: target
        run: node "$GITHUB_WORKSPACE/scripts/validate-naming-rules.ts" "$BASE_SHA" "$HEAD_SHA"

      - name: Validate security gate
        env:
          BASE_SHA: ${{ steps.resolved.outputs.base_sha }}
          HEAD_SHA: ${{ steps.resolved.outputs.head_sha }}
        run: node scripts/validate-security.ts "$BASE_SHA" "$HEAD_SHA" "$GITHUB_WORKSPACE/target" "$GITHUB_WORKSPACE/policies/security.json"

      # Change code from an author without write access runs centrally only after a maintainer
      # approves the current head commit. Until then the run reports "awaiting approval" and stops
      # before CI; central intake picks the pull request up again once the approval exists.
      - name: Enforce PR trust
        id: trust
        env:
          PR_TRUST_UNTRUSTED: report
          GH_TOKEN: ${{ secrets.AW_CONTROL_TOKEN }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          PR_NUMBER: ${{ steps.payload.outputs.pr_number }}
          HEAD_SHA: ${{ steps.resolved.outputs.head_sha }}
        run: node scripts/pr-trust.ts "$REPOSITORY" "$PR_NUMBER" "$HEAD_SHA"

      - name: Dispatch centralized CI
        if: steps.trust.outputs.trusted == 'true' && steps.base_plan.outputs.ci_required == 'true'
        env:
          GH_TOKEN: ${{ secrets.AW_CONTROL_TOKEN }}
          AW_REPOSITORY_POLICY: ${{ vars.AW_REPOSITORY_POLICY }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          PR_NUMBER: ${{ steps.payload.outputs.pr_number }}
          REQUEST_ID: ${{ github.event.client_payload.request_id }}
          HEAD_SHA: ${{ steps.resolved.outputs.head_sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/dispatch-central-ci.ts \
            "$REPOSITORY" \
            "$PR_NUMBER" \
            "$REQUEST_ID" \
            "$HEAD_SHA" \
            "$RUN_URL" \
            "$GITHUB_WORKSPACE/policies/execution.json"

      - name: Collect CI evidence
        if: steps.trust.outputs.trusted == 'true' && steps.base_plan.outputs.ci_required == 'true'
        env:
          GH_TOKEN: ${{ secrets.AW_CONTROL_TOKEN }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          HEAD_SHA: ${{ steps.resolved.outputs.head_sha }}
          CI_EVIDENCE_PATH: /tmp/ci-evidence.json
        run: node scripts/wait-ci-evidence.ts "$REPOSITORY" "$HEAD_SHA" "$GITHUB_WORKSPACE/policies/execution.json"

      - name: Publish explicit no-CI evidence
        if: steps.trust.outputs.trusted == 'true' && steps.base_plan.outputs.ci_required != 'true'
        env:
          GH_TOKEN: ${{ secrets.AW_CONTROL_TOKEN }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          HEAD_SHA: ${{ steps.resolved.outputs.head_sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -Eeuo pipefail

          gh api \
            --method POST \
            "repos/$REPOSITORY/statuses/$HEAD_SHA" \
            -f state='success' \
            -f "context=CI Evidence" \
            -f description='CI not required by governance plan' \
            -f "target_url=$RUN_URL" >/dev/null

      - name: Validate CI evidence
        if: steps.trust.outputs.trusted == 'true' && steps.base_plan.outputs.ci_required == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/validate-ci-evidence.ts /tmp/ci-evidence.json

      - name: Mark deterministic gate passed
        id: gate
        if: steps.trust.outputs.trusted == 'true'
        shell: bash
        run: echo "passed=true" >> "$GITHUB_OUTPUT"

      - name: Resolve governance ownership
        id: ownership
        if: ${{ always() && steps.resolved.outputs.head_sha != '' }}
        env:
          GH_TOKEN: ${{ secrets.AW_CONTROL_TOKEN }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          HEAD_SHA: ${{ steps.resolved.outputs.head_sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/check-status-owner.ts "$REPOSITORY" "$HEAD_SHA" "$RUN_URL"

      - name: Update final gate
        if: ${{ always() && steps.ownership.outputs.current == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.AW_CONTROL_TOKEN }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          HEAD_SHA: ${{ steps.resolved.outputs.head_sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATE: ${{ steps.gate.outputs.passed == 'true' && 'success' || 'failure' }}
          DESCRIPTION: ${{ steps.gate.outputs.passed == 'true' && 'Action Worker PR governance passed' || steps.trust.outputs.trusted == 'false' && 'Awaiting maintainer approval of the current head commit' || 'Action Worker PR governance failed' }}
        run: node scripts/set-pr-status.ts "$REPOSITORY" "$HEAD_SHA" "$STATE" "$DESCRIPTION" "$RUN_URL"

      - name: Update central merge gate
        if: ${{ always() && steps.ownership.outputs.current == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.AW_CONTROL_TOKEN }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          HEAD_SHA: ${{ steps.resolved.outputs.head_sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATE: ${{ steps.gate.outputs.passed == 'true' && 'success' || 'failure' }}
          DESCRIPTION: ${{ steps.gate.outputs.passed == 'true' && 'Action Worker merge gate passed' || steps.trust.outputs.trusted == 'false' && 'Awaiting maintainer approval of the current head commit' || 'Action Worker merge gate failed' }}
          PR_STATUS_CONTEXT: validate-merge
        run: node scripts/set-pr-status.ts "$REPOSITORY" "$HEAD_SHA" "$STATE" "$DESCRIPTION" "$RUN_URL"

      - name: Publish PR review
        if: ${{ always() && steps.ownership.outputs.current == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.AW_CONTROL_TOKEN }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          PR_NUMBER: ${{ steps.payload.outputs.pr_number }}
          GOVERNANCE_STATUS: ${{ steps.gate.outputs.passed == 'true' && 'success' || steps.trust.outputs.trusted == 'false' && 'awaiting-approval' || 'failure' }}
          AI_REVIEW_STATE: ${{ steps.gate.outputs.passed == 'true' && steps.base_plan.outputs.review_required == 'true' && 'queued' || '' }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/publish-pr-review.ts "$REPOSITORY" "$PR_NUMBER" "$GOVERNANCE_STATUS" "$RUN_URL" /tmp/pr-plan.json /tmp/ocr-result.json "$AI_REVIEW_STATE"

      # AI Review runs as its own workflow after the gate so its queue never waits behind CI.
      - name: Dispatch AI review
        if: ${{ steps.gate.outputs.passed == 'true' && steps.ownership.outputs.current == 'true' && steps.base_plan.outputs.review_required == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.AW_CONTROL_TOKEN }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          PR_NUMBER: ${{ steps.payload.outputs.pr_number }}
          HEAD_SHA: ${{ steps.resolved.outputs.head_sha }}
          REQUEST_ID: review-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/dispatch-pr-review.ts "$REPOSITORY" "$PR_NUMBER" "$REQUEST_ID" "$HEAD_SHA"
