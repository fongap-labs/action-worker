name: 处理 PR 调度

on:
  repository_dispatch:
    types: [run-pr-governance]

permissions:
  contents: read
  actions: read

concurrency:
  group: pr-governance-${{ github.event.client_payload.repository }}-${{ github.event.client_payload.pr_number }}
  cancel-in-progress: true

jobs:
  govern:
    name: PR 治理
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: 检出控制层
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: 校验 PR 请求
        id: payload
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          PR_REPOSITORY_ALLOWLIST: ${{ vars.PR_REPOSITORY_ALLOWLIST }}
        run: node scripts/validate-pr-payload.ts "$PAYLOAD"

      - name: 校验控制凭据
        env:
          GH_TOKEN: ${{ secrets.GH_CONTROL_TOKEN }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          PR_NUMBER: ${{ steps.payload.outputs.pr_number }}
        run: node scripts/validate-control-access.ts "$REPOSITORY" "$PR_NUMBER"

      - name: 获取 PR 事实
        id: facts
        env:
          GH_TOKEN: ${{ secrets.GH_CONTROL_TOKEN }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          PR_NUMBER: ${{ steps.payload.outputs.pr_number }}
        run: node scripts/resolve-pr-facts.ts fetch

      - name: 检出目标 PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.payload.outputs.repository }}
          ref: refs/pull/${{ steps.payload.outputs.pr_number }}/head
          token: ${{ secrets.GH_CONTROL_TOKEN }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: 解析已检出 PR 事实
        id: resolved
        env:
          GH_TOKEN: ${{ secrets.GH_CONTROL_TOKEN }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          PR_NUMBER: ${{ steps.payload.outputs.pr_number }}
          INITIAL_BASE_SHA: ${{ steps.facts.outputs.base_sha }}
          INITIAL_HEAD_SHA: ${{ steps.facts.outputs.head_sha }}
          INITIAL_TITLE: ${{ steps.facts.outputs.title }}
        run: node scripts/resolve-pr-facts.ts resolve

      - name: 标记治理进行中
        env:
          GH_TOKEN: ${{ secrets.GH_CONTROL_TOKEN }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          HEAD_SHA: ${{ steps.resolved.outputs.head_sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/set-pr-status.ts "$REPOSITORY" "$HEAD_SHA" pending "Action Worker 正在执行 PR 治理" "$RUN_URL"

      - name: 校验变更记录
        id: change
        env:
          PR_TITLE: ${{ steps.resolved.outputs.title }}
          BASE_SHA: ${{ steps.resolved.outputs.base_sha }}
          HEAD_SHA: ${{ steps.resolved.outputs.head_sha }}
        run: node scripts/validate-change-record.ts "$PR_TITLE" "$BASE_SHA" "$HEAD_SHA" "$GITHUB_WORKSPACE/target" "$GITHUB_WORKSPACE/policies"

      - name: 识别项目与变更
        id: context
        env:
          BASE_SHA: ${{ steps.resolved.outputs.base_sha }}
          HEAD_SHA: ${{ steps.resolved.outputs.head_sha }}
          CHANGE_RECORD_JSON: ${{ steps.change.outputs.json }}
        run: node scripts/detect-pr-context.ts "$BASE_SHA" "$HEAD_SHA" "$GITHUB_WORKSPACE/target" "$GITHUB_WORKSPACE/policies"

      - name: Resolve base plan
        id: base_plan
        env:
          CONTEXT_JSON: ${{ steps.context.outputs.json }}
        run: node scripts/resolve-pr-plan.ts "$CONTEXT_JSON" inherit inherit inherit inherit auto auto "$GITHUB_WORKSPACE/policies"

      - name: 校验命名规则
        if: steps.base_plan.outputs.naming_required == 'true'
        env:
          BASE_SHA: ${{ steps.resolved.outputs.base_sha }}
          HEAD_SHA: ${{ steps.resolved.outputs.head_sha }}
        working-directory: target
        run: node "$GITHUB_WORKSPACE/scripts/validate-naming-rules.ts" "$BASE_SHA" "$HEAD_SHA"

      - name: 收集 CI 证据
        if: steps.base_plan.outputs.ci_required == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_CONTROL_TOKEN }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          HEAD_SHA: ${{ steps.resolved.outputs.head_sha }}
          CI_EVIDENCE_PATH: /tmp/ci-evidence.json
        run: node scripts/wait-ci-evidence.ts "$REPOSITORY" "$HEAD_SHA" "$GITHUB_WORKSPACE/policies/execution.json"

      - name: Wait for AI queue
        if: steps.base_plan.outputs.review_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/wait-review-turn.ts \
            "$GITHUB_REPOSITORY" \
            "handle-pr-dispatch.yml" \
            "$GITHUB_RUN_ID" \
            "$GITHUB_WORKSPACE/policies/review.json"

      - name: Run AI Triage
        if: steps.base_plan.outputs.triage_required == 'true'
        env:
          AI_GATEWAY_URL: ${{ vars.AI_GATEWAY_URL }}
          TRIAGE_LLM_TOKEN: ${{ secrets.GATEWAY_ACCESS_KEY_AIR }}
          BASE_SHA: ${{ steps.resolved.outputs.base_sha }}
          HEAD_SHA: ${{ steps.resolved.outputs.head_sha }}
          CONTEXT_JSON: ${{ steps.context.outputs.json }}
          TRIAGE_OUTPUT_PATH: /tmp/ai-triage.json
        run: |
          node scripts/run-ai-triage.ts \
            "$BASE_SHA" \
            "$HEAD_SHA" \
            "$GITHUB_WORKSPACE/target" \
            "$CONTEXT_JSON" \
            "$(cat /tmp/pr-plan.base.json)" \
            "$GITHUB_WORKSPACE/policies/triage.json"

      - name: Resolve final plan
        id: plan
        run: |
          node scripts/apply-ai-triage.ts \
            /tmp/pr-plan.base.json \
            /tmp/ai-triage.json \
            "$GITHUB_WORKSPACE/policies/triage.json" \
            "$GITHUB_WORKSPACE/policies/review.json"

      - name: Resolve OCR distribution
        id: ocr_dist
        if: steps.plan.outputs.review_required == 'true'
        env:
          REVIEW_ENGINE_REPOSITORY: ${{ vars.REVIEW_ENGINE_REPOSITORY }}
        run: node scripts/resolve-ocr-distribution.ts "$GITHUB_WORKSPACE/policies/review.json"

      - name: Restore OCR cache
        if: steps.plan.outputs.review_required == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.ocr_dist.outputs.cache_dir }}
          key: ocr-${{ runner.os }}-${{ runner.arch }}-${{ steps.ocr_dist.outputs.version }}-${{ steps.ocr_dist.outputs.asset }}

      - name: 配置 OpenCodeReview
        if: steps.plan.outputs.review_required == 'true'
        env:
          OCR_REPOSITORY: ${{ steps.ocr_dist.outputs.repository }}
          OCR_VERSION: ${{ steps.ocr_dist.outputs.version }}
          OCR_ASSET: ${{ steps.ocr_dist.outputs.asset }}
          OCR_CACHE_DIR: ${{ steps.ocr_dist.outputs.cache_dir }}
        run: node scripts/install-ocr.ts "$OCR_REPOSITORY" "$OCR_VERSION" "$OCR_ASSET" "$OCR_CACHE_DIR"

      - name: 执行 AI 审查
        if: steps.plan.outputs.review_required == 'true'
        env:
          AI_GATEWAY_URL: ${{ vars.AI_GATEWAY_URL }}
          OCR_LLM_TOKEN: ${{ secrets.GATEWAY_ACCESS_KEY_AIR }}
          REVIEW_MODEL: ${{ steps.plan.outputs.review_model }}
          BASE_SHA: ${{ steps.resolved.outputs.base_sha }}
          HEAD_SHA: ${{ steps.resolved.outputs.head_sha }}
          REVIEW_EFFORT: ${{ steps.plan.outputs.review_effort }}
          REVIEW_RULE: ${{ steps.plan.outputs.review_rule }}
          BLOCK_SEVERITY: ${{ steps.plan.outputs.block_severity }}
          REVIEW_TASK_TIMEOUT: ${{ steps.plan.outputs.review_task_timeout }}
          REVIEW_CONCURRENCY: ${{ steps.plan.outputs.review_concurrency }}
          OCR_LLM_TIMEOUT: ${{ steps.plan.outputs.review_llm_timeout }}
          OCR_NO_UPDATE: "1"
        run: |
          node scripts/run-ai-review.ts \
            target \
            "$BASE_SHA" \
            "$HEAD_SHA" \
            "$GITHUB_WORKSPACE/rules/$REVIEW_RULE" \
            "$BLOCK_SEVERITY"

      - name: 校验 CI 证据
        if: steps.plan.outputs.ci_required == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/validate-ci-evidence.ts /tmp/ci-evidence.json

      - name: Resolve governance ownership
        id: ownership
        if: ${{ always() && steps.resolved.outputs.head_sha != '' }}
        env:
          GH_TOKEN: ${{ secrets.GH_CONTROL_TOKEN }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          HEAD_SHA: ${{ steps.resolved.outputs.head_sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/check-status-owner.ts "$REPOSITORY" "$HEAD_SHA" "$RUN_URL"

      - name: 回写 PR 审查
        if: ${{ always() && steps.ownership.outputs.current == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GH_CONTROL_TOKEN }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          PR_NUMBER: ${{ steps.payload.outputs.pr_number }}
          GOVERNANCE_STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/publish-pr-review.ts "$REPOSITORY" "$PR_NUMBER" "$GOVERNANCE_STATUS" "$RUN_URL" /tmp/pr-plan.json /tmp/ocr-result.json

      - name: 更新最终门禁
        if: ${{ always() && steps.ownership.outputs.current == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GH_CONTROL_TOKEN }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          HEAD_SHA: ${{ steps.resolved.outputs.head_sha }}
          GOVERNANCE_STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          DESCRIPTION: ${{ job.status == 'success' && 'Action Worker PR 治理通过' || 'Action Worker PR 治理未通过' }}
        run: node scripts/set-pr-status.ts "$REPOSITORY" "$HEAD_SHA" "$STATE" "$DESCRIPTION" "$RUN_URL"
