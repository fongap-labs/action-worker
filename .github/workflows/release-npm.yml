name: 手动 ·  npm 发包

on:
  repository_dispatch:
    types: [run-npm-republish]
  workflow_dispatch:
    inputs:
      repository:
        description: 仅支持 fongap-labs/dsh-plugin 的正式版产品 Release
        required: true
        type: string
      tag:
        description: 正式版 GitHub Release 标签（例如 dsh-ui-delta-v0.1.0）
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-republish-${{ github.event.client_payload.repository || inputs.repository }}-${{ github.event.client_payload.tag || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish npm package
    if: ${{ (github.event.client_payload.repository || inputs.repository) == 'fongap-labs/dsh-plugin' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Resolve npm Release API scope
        id: api_scope
        env:
          TARGET_REPOSITORY: ${{ github.event.client_payload.repository || inputs.repository }}
        run: node scripts/resolve-github-api-scope.ts release-target

      - name: Mint npm Release read token
        id: release_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.api_scope.outputs.owner }}
          repositories: ${{ steps.api_scope.outputs.repository_name }}
          permission-contents: read

      - name: Publish verified npm Release asset
        env:
          AW_RELEASE_API_TOKEN: ${{ steps.release_app.outputs.token }}
          AW_NPM_TOKEN: ${{ secrets.AW_NPM_TOKEN }}
          AW_CONTROL_REPOSITORY: ${{ github.repository }}
          NPM_REPUBLISH_REPOSITORY: ${{ github.event.client_payload.repository || inputs.repository }}
          NPM_REPUBLISH_TAG: ${{ github.event.client_payload.tag || inputs.tag }}
        run: node scripts/republish-release-npm.ts
