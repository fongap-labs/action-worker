name: Update Work Metrics

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-work-metrics.yml"
  workflow_run:
    workflows:
      - Handle Task Dispatch
      - Handle PR Dispatch
    types: [completed]
  repository_dispatch:
    types: [refresh-work-metrics]
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: update-work-metrics-${{ github.event_name == 'workflow_run' && 'incremental' || 'reconcile' }}
  cancel-in-progress: false

jobs:
  sweep:
    name: Sweep stale metrics branches
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

  update:
    name: Aggregate and update
    needs: sweep
    if: ${{ github.event_name != 'push' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Sweep stale metrics branches
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: metrics/${{ github.run_id }}
        run: node scripts/manage-work-metrics.ts sweep

      - name: Prepare incremental metrics
        id: increment
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node scripts/manage-work-metrics.ts increment

      - name: Resolve managed repositories
        id: repositories
        env:
          AW_REPOSITORY_POLICY: ${{ vars.AW_REPOSITORY_POLICY }}
        run: node scripts/repository-policy.ts list pr

      - name: Aggregate work metrics
        id: metrics
        env:
          METRICS_TOKEN: ${{ secrets.AW_CONTROL_TOKEN }}
          METRICS_REPOSITORIES_JSON: ${{ steps.repositories.outputs.repositories }}
          WORK_METRICS_JSON: ${{ steps.increment.outputs.json }}
        run: node scripts/update-work-metrics.ts README.md

      - name: Check for changes
        id: changes
        run: node scripts/manage-work-metrics.ts changes

      - name: Create update branch
        if: steps.changes.outputs.changed == 'true'
        id: branch
        env:
          BRANCH: metrics/${{ github.run_id }}
        run: node scripts/manage-work-metrics.ts branch

      - name: Create auto-update PR
        if: steps.changes.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
          DISPATCH: ${{ steps.metrics.outputs.dispatch }}
          PR_GOVERNANCE: ${{ steps.metrics.outputs.pr_governance }}
          AI_REVIEW: ${{ steps.metrics.outputs.ai_review }}
          GATE: ${{ steps.metrics.outputs.gate }}
          RELEASE_GOVERNANCE: ${{ steps.metrics.outputs.release_governance }}
        run: node scripts/manage-work-metrics.ts pull

      - name: Trigger CI
        if: steps.changes.outputs.changed == 'true'
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
          HEAD_SHA: ${{ steps.branch.outputs.sha }}
        run: node scripts/manage-work-metrics.ts ci

      - name: Merge update
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: node scripts/manage-work-metrics.ts merge

      - name: Cleanup failed metrics update
        if: ${{ failure() && steps.changes.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          BRANCH: metrics/${{ github.run_id }}
        run: node scripts/manage-work-metrics.ts cleanup

      - name: Refresh main CI
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run validate-ci.yml --ref main
