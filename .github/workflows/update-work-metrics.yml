name: 更新工作统计

on:
  workflow_run:
    workflows:
      - 处理任务调度
      - 处理 PR 调度
    types: [completed]
  repository_dispatch:
    types: [refresh-work-metrics]
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: update-work-metrics-${{ github.event_name == 'workflow_run' && 'incremental' || 'reconcile' }}
  cancel-in-progress: false

jobs:
  update:
    name: 统计并更新
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: 准备增量统计
        id: increment
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node scripts/manage-work-metrics.ts increment

      - name: 统计工作成果
        id: metrics
        env:
          GH_METRICS_TOKEN: ${{ secrets.GH_CONTROL_TOKEN || secrets.GH_METRICS_PAT || secrets.GH_EXECUTION_REPO_PAT || github.token }}
          METRICS_REPOSITORIES_JSON: ${{ vars.PR_REPOSITORY_ALLOWLIST }}
          WORK_METRICS_INCREMENT_JSON: ${{ steps.increment.outputs.json }}
        run: node scripts/update-work-metrics.ts README.md

      - name: 检查是否变化
        id: changes
        run: node scripts/manage-work-metrics.ts changes

      - name: 创建更新分支
        if: steps.changes.outputs.changed == 'true'
        id: branch
        env:
          BRANCH: metrics/${{ github.run_id }}
        run: node scripts/manage-work-metrics.ts branch

      - name: 创建自动更新 PR
        if: steps.changes.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
          DISPATCH: ${{ steps.metrics.outputs.dispatch }}
          PR_GOVERNANCE: ${{ steps.metrics.outputs.pr_governance }}
          AI_REVIEW: ${{ steps.metrics.outputs.ai_review }}
          GATE: ${{ steps.metrics.outputs.gate }}
          RELEASE_GOVERNANCE: ${{ steps.metrics.outputs.release_governance }}
        run: node scripts/manage-work-metrics.ts pull

      - name: Cleanup failed metrics branch
        if: ${{ failure() && steps.changes.outputs.changed == 'true' && steps.branch.outcome == 'success' && steps.pr.outcome == 'failure' }}
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: node scripts/manage-work-metrics.ts cleanup

      - name: 主动执行 CI
        if: steps.changes.outputs.changed == 'true'
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
          HEAD_SHA: ${{ steps.branch.outputs.sha }}
        run: node scripts/manage-work-metrics.ts ci

      - name: 合并更新
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: node scripts/manage-work-metrics.ts merge

      - name: 刷新主线 CI
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run validate-ci.yml --ref main
