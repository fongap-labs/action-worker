name: Apply Repository Settings

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Target repository in owner/name format
        required: true
        type: string
      is_dry_run:
        description: Print managed settings without changing the repository
        required: true
        default: true
        type: boolean
  push:
    branches:
      - main
    paths:
      - policies/repository.json
      - policies/rulesets.json
      - scripts/apply-repo-settings.ts
      - .github/workflows/apply-repo-settings.yml

permissions:
  contents: read

jobs:
  apply-manual:
    if: github.event_name == 'workflow_dispatch'
    name: Apply repository settings
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Apply managed settings
        env:
          GH_TOKEN: ${{ secrets.AW_ADMIN_TOKEN }}
          TARGET_REPOSITORY: ${{ inputs.repository }}
          IS_DRY_RUN: ${{ inputs.is_dry_run }}
        run: node scripts/apply-repo-settings.ts "$TARGET_REPOSITORY" "$IS_DRY_RUN"

  apply-control-plane:
    if: github.event_name == 'push'
    name: Apply control-plane settings
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Apply managed settings
        env:
          GH_TOKEN: ${{ secrets.AW_ADMIN_TOKEN }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: node scripts/apply-repo-settings.ts "$TARGET_REPOSITORY" false

  resolve-managed:
    if: github.event_name == 'push'
    name: Resolve managed repositories
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      repositories: ${{ steps.policy.outputs.repositories }}
    steps:
      - name: Check out control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Resolve repository policy
        id: policy
        env:
          AW_REPOSITORY_POLICY: ${{ vars.AW_REPOSITORY_POLICY }}
        run: node scripts/repository-policy.ts list pr

  apply-managed:
    if: github.event_name == 'push'
    needs: resolve-managed
    name: Apply managed settings · ${{ matrix.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        repository: ${{ fromJSON(needs.resolve-managed.outputs.repositories) }}
    steps:
      - name: Check out control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Apply managed settings
        env:
          GH_TOKEN: ${{ secrets.AW_ADMIN_TOKEN }}
          TARGET_REPOSITORY: ${{ matrix.repository }}
        run: node scripts/apply-repo-settings.ts "$TARGET_REPOSITORY" false
