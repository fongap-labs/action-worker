name: 自动 · 隐私安全覆盖审计

on:
  push:
    branches: [main]
    paths:
      - scripts/security-coverage-audit.ts
      - policies/repository-access.json
      - .github/workflows/audit-security-coverage.yml
  schedule:
    - cron: "49 4 * * *"

permissions:
  contents: read

concurrency:
  group: organization-security-coverage-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Audit installed repository security coverage
    if: github.repository == 'fongap-labs/action-worker' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: admin-ops
      deployment: false
    steps:
      - name: Checkout trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Mint installation inventory token
        id: inventory
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read
      - name: Audit security coverage metadata only
        env:
          AW_INVENTORY_TOKEN: ${{ steps.inventory.outputs.token }}
        run: node scripts/security-coverage-audit.ts
