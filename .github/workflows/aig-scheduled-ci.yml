name: AI Gateway Scheduled CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aig-scheduled-ci.yml"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-gateway-scheduled-ci
  cancel-in-progress: true

jobs:
  validate:
    name: Validate AI Gateway
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout AI Gateway
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fongap-labs/ai-gateway
          ref: main
          path: target
          token: ${{ secrets.AW_CONTROL_TOKEN }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: target/package-lock.json

      - name: Run trusted AI Gateway CI
        env:
          CENTRAL_CI_PR_NUMBER: "0"
        shell: bash
        run: bash target/.github/scripts/central-ci.sh "$GITHUB_WORKSPACE/target"
