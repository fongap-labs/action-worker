name: 自动 · CI 后续

on:
  repository_dispatch:
    types: [run-ci-follow-up]

permissions:
  contents: read

concurrency:
  group: ci-follow-up-${{ github.event.client_payload.repository }}-${{ github.event.client_payload.head_sha }}
  cancel-in-progress: false

jobs:
  follow-up:
    name: Independent CI follow-ups
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Resolve CI evidence repository scope
        id: api_scope
        env:
          AW_REPOSITORY_POLICY: ${{ vars.AW_REPOSITORY_POLICY }}
          TARGET_REPOSITORY: ${{ github.event.client_payload.repository }}
        run: node scripts/resolve-github-api-scope.ts pr

      - name: Mint CI evidence read token
        id: status_read_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.api_scope.outputs.owner }}
          repositories: ${{ steps.api_scope.outputs.repository_name }}
          permission-statuses: read

      - name: Mint control read token
        id: control_read_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.api_scope.outputs.owner }}
          repositories: ${{ steps.api_scope.outputs.is_control_repository == 'true' && github.event.repository.name || format('{0},{1}', github.event.repository.name, steps.api_scope.outputs.repository_name) }}
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read
          permission-issues: read

      - name: Mint control dispatch token
        id: dispatch_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Verify completed CI evidence and source revision
        id: verified
        env:
          AW_CONTROL_TOKEN: ${{ steps.control_read_app.outputs.token }}
          AW_STATUS_API_TOKEN: ${{ steps.status_read_app.outputs.token }}
          AW_STATUS_SIGNING_KEYS: ${{ secrets.AW_STATUS_SIGNING_KEYS }}
          AW_REPOSITORY_POLICY: ${{ vars.AW_REPOSITORY_POLICY }}
          CI_FOLLOW_UP_REQUEST_JSON: ${{ toJSON(github.event.client_payload) }}
        run: node scripts/verify-ci-follow-up.ts

      - name: Dispatch central security scan
        if: steps.verified.outputs.current == 'true'
        env:
          AW_REPOSITORY_POLICY: ${{ vars.AW_REPOSITORY_POLICY }}
          AW_CONTROL_TOKEN: ${{ steps.control_read_app.outputs.token }}
          AW_DISPATCH_API_TOKEN: ${{ steps.dispatch_app.outputs.token }}
          AW_CONTROL_REPOSITORY: ${{ github.repository }}
          TARGET_REPOSITORY: ${{ github.event.client_payload.repository }}
          TARGET_HEAD_SHA: ${{ github.event.client_payload.head_sha }}
          TARGET_PR_NUMBER: ${{ github.event.client_payload.pr_number }}
        run: |
          node scripts/dispatch-security-scan.ts \
            "$TARGET_REPOSITORY" \
            "$TARGET_HEAD_SHA" \
            "$TARGET_PR_NUMBER"

      - name: Mint deploy source status token
        if: ${{ !cancelled() && steps.verified.outputs.current == 'true' && github.event.client_payload.pr_number == 0 }}
        id: attest_status_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.api_scope.outputs.owner }}
          repositories: ${{ steps.api_scope.outputs.repository_name }}
          permission-statuses: write

      - name: Mint deploy source issue token
        if: ${{ !cancelled() && steps.verified.outputs.current == 'true' && github.event.client_payload.pr_number == 0 }}
        id: attest_issue_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.api_scope.outputs.owner }}
          repositories: ${{ steps.api_scope.outputs.repository_name }}
          permission-issues: write

      - name: Attest deploy source main write
        id: attest
        if: ${{ !cancelled() && steps.verified.outputs.current == 'true' && github.event.client_payload.pr_number == 0 }}
        env:
          AW_CONTROL_TOKEN: ${{ steps.control_read_app.outputs.token }}
          AW_STATUS_API_TOKEN: ${{ steps.attest_status_app.outputs.token }}
          AW_STATUS_SIGNING_KEYS: ${{ secrets.AW_STATUS_SIGNING_KEYS }}
          AW_ISSUE_API_TOKEN: ${{ steps.attest_issue_app.outputs.token }}
          AW_REPOSITORY_POLICY: ${{ vars.AW_REPOSITORY_POLICY }}
          MAIN_WRITE_AUDIT_REPOSITORY: ${{ github.event.client_payload.repository }}
          MAIN_WRITE_AUDIT_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/audit-main-writes.ts

      - name: Dispatch automatic deploy
        if: ${{ !cancelled() && steps.verified.outputs.current == 'true' && steps.attest.outcome == 'success' }}
        env:
          AW_DISPATCH_API_TOKEN: ${{ steps.dispatch_app.outputs.token }}
          AW_CONTROL_TOKEN: ${{ steps.control_read_app.outputs.token }}
          AW_REPOSITORY_POLICY: ${{ vars.AW_REPOSITORY_POLICY }}
          TARGET_REPOSITORY: ${{ github.event.client_payload.repository }}
          TARGET_HEAD_SHA: ${{ github.event.client_payload.head_sha }}
          TARGET_PR_NUMBER: ${{ github.event.client_payload.pr_number }}
        run: |
          node scripts/dispatch-central-deploy.ts \
            "$TARGET_REPOSITORY" \
            "$TARGET_HEAD_SHA" \
            "$TARGET_PR_NUMBER" \
            policies/deploy.json \
            policies/runner.json
