name: Security Scan Intake

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/security-scan-intake.yml
      - .github/workflows/security-scan.yml
      - contracts/security-scan.json
      - scripts/dispatch-security-scan.ts
      - scripts/intake-security-scans.ts
      - scripts/publish-security-scan.ts
      - scripts/resolve-security-scan.ts
      - scripts/security-scan.ts
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: security-scan-intake
  cancel-in-progress: false

jobs:
  intake:
    name: Reconcile security scans
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Reconcile default-branch security scans
        env:
          AW_REPOSITORY_POLICY: ${{ vars.AW_REPOSITORY_POLICY }}
          AW_CONTROL_TOKEN: ${{ secrets.AW_CONTROL_TOKEN }}
          AW_INGRESS_TOKEN: ${{ github.token }}
          AW_CONTROL_REPOSITORY: ${{ github.repository }}
        run: node scripts/intake-security-scans.ts
