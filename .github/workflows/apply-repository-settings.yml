name: 自动 · 仓库设置

# A change to the shared policy applies it at once; the daily run corrects drift made by hand in
# repository settings. Both apply the same policy to every managed repository, so nobody has to
# start this workflow.
on:
  push:
    branches:
      - main
    paths:
      - policies/repository.json
      - policies/rulesets.json
      - scripts/apply-repository-settings.ts
      - scripts/apply-review-models.ts
      - scripts/bootstrap-status-signing.ts
      - scripts/status-signing-keys.ts
      - scripts/status-attestation.ts
      - .github/actions/mint-app-token/action.yml
      - policies/review-models.json
      - .github/workflows/apply-repository-settings.yml
  schedule:
    - cron: "43 4 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: apply-repository-settings
  cancel-in-progress: false

jobs:
  apply-control-plane:
    name: Apply control-plane settings
    environment: admin-ops
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Mint control settings administration token
        id: admin_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: write

      - name: Mint control AI Review variable token
        id: review_vars_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-variables: write

      - name: Mint control status signing secret token
        id: signing_secrets_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-secrets: write

      - name: Apply managed settings
        env:
          GH_TOKEN: ${{ steps.admin_app.outputs.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: node scripts/apply-repository-settings.ts "$TARGET_REPOSITORY" false

      - name: Apply AI Review model
        env:
          GH_TOKEN: ${{ steps.review_vars_app.outputs.token }}
          AI_GATEWAY_URL: ${{ vars.AI_GATEWAY_URL }}
          AI_GATEWAY_TOKEN: ${{ secrets.AIG_ACCESS_KEY_AGENT }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: node scripts/apply-review-models.ts "$TARGET_REPOSITORY"

      - name: Mint status bootstrap dispatch token
        id: bootstrap_dispatch
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Bootstrap status signing keyring
        env:
          GH_TOKEN: ${{ steps.signing_secrets_app.outputs.token }}
          AW_STATUS_TOKEN: ${{ secrets.AW_STATUS_TOKEN }}
          AW_STATUS_SIGNING_KEYS: ${{ secrets.AW_STATUS_SIGNING_KEYS }}
          AW_DISPATCH_API_TOKEN: ${{ steps.bootstrap_dispatch.outputs.token }}
          AW_BOOTSTRAP_READ_TOKEN: ${{ github.token }}
        run: node scripts/bootstrap-status-signing.ts

  resolve-managed:
    name: Resolve managed repositories
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      repositories: ${{ steps.policy.outputs.repositories }}
    steps:
      - name: Check out control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Resolve repository policy
        id: policy
        env:
          AW_REPOSITORY_POLICY: ${{ vars.AW_REPOSITORY_POLICY }}
        run: node scripts/repository-policy.ts list pr

  apply-managed:
    needs: resolve-managed
    name: Apply managed settings · ${{ matrix.repository }}
    environment: admin-ops
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        repository: ${{ fromJSON(needs.resolve-managed.outputs.repositories) }}
    steps:
      - name: Check out control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Mint managed settings administration token
        id: admin_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.repository }}
          permission-administration: write

      - name: Apply managed settings
        env:
          GH_TOKEN: ${{ steps.admin_app.outputs.token }}
          TARGET_REPOSITORY: ${{ matrix.repository }}
        run: node scripts/apply-repository-settings.ts "$TARGET_REPOSITORY" false
