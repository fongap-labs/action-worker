name: Apply Repository Settings

# A change to the shared policy applies it at once; the daily run corrects drift made by hand in
# repository settings. Both apply the same policy to every managed repository, so nobody has to
# start this workflow.
on:
  push:
    branches:
      - main
    paths:
      - policies/repository.json
      - policies/rulesets.json
      - scripts/apply-repository-settings.ts
      - .github/workflows/apply-repository-settings.yml
  schedule:
    - cron: "43 4 * * *"

permissions:
  contents: read

concurrency:
  group: apply-repository-settings
  cancel-in-progress: false

jobs:
  apply-control-plane:
    name: Apply control-plane settings
    environment: admin-ops
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Apply managed settings
        env:
          GH_TOKEN: ${{ secrets.AW_ADMIN_TOKEN }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: node scripts/apply-repository-settings.ts "$TARGET_REPOSITORY" false

  resolve-managed:
    name: Resolve managed repositories
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      repositories: ${{ steps.policy.outputs.repositories }}
    steps:
      - name: Check out control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Resolve repository policy
        id: policy
        env:
          AW_REPOSITORY_POLICY: ${{ vars.AW_REPOSITORY_POLICY }}
        run: node scripts/repository-policy.ts list pr

  apply-managed:
    needs: resolve-managed
    name: Apply managed settings · ${{ matrix.repository }}
    environment: admin-ops
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        repository: ${{ fromJSON(needs.resolve-managed.outputs.repositories) }}
    steps:
      - name: Check out control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Apply managed settings
        env:
          GH_TOKEN: ${{ secrets.AW_ADMIN_TOKEN }}
          TARGET_REPOSITORY: ${{ matrix.repository }}
        run: node scripts/apply-repository-settings.ts "$TARGET_REPOSITORY" false
