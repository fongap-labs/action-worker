name: 自动 · 仓库设置

# A change to the shared policy applies it at once; the hourly run corrects drift made by hand in
# repository settings. Both apply the same policy to every managed repository, so nobody has to
# start this workflow.
on:
  push:
    branches:
      - main
    paths:
      - policies/repository.json
      - policies/repository-access.json
      - policies/rulesets.json
      - policies/beta-release-targets.json
      - policies/beta-deploy-targets.json
      - scripts/beta-deploy-authorization.ts
      - scripts/audit-beta-readiness.ts
      - scripts/beta-release-authorization.ts
      - scripts/apply-repository-settings.ts
      - scripts/resolve-dev-settings.ts
      - scripts/apply-review-models.ts
      - scripts/bootstrap-status-signing.ts
      - scripts/status-signing-keys.ts
      - scripts/status-attestation.ts
      - .github/actions/mint-app-token/action.yml
      - policies/review-models.json
      - .github/workflows/apply-repository-settings.yml
  workflow_run:
    workflows: ["自动 · 总控调度"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "43 * * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: apply-repository-settings
  cancel-in-progress: false

jobs:
  apply-control-plane:
    if: github.event_name != 'workflow_run'
    name: Apply control-plane settings
    environment:
      name: admin-ops
      deployment: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Apply AI Review model
        env:
          GH_TOKEN: ${{ secrets.AW_ADMIN_TOKEN }}
          AI_GATEWAY_URL: ${{ vars.AI_GATEWAY_URL }}
          AI_GATEWAY_TOKEN: ${{ secrets.AIG_ACCESS_KEY_AGENT }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: node scripts/apply-review-models.ts "$TARGET_REPOSITORY"

      - name: Audit Beta deployment readiness
        env:
          GH_TOKEN: ${{ secrets.AW_ADMIN_TOKEN }}
        run: node scripts/audit-beta-readiness.ts deploy

  bootstrap-signing:
    if: github.event_name != 'workflow_run'
    name: Bootstrap CI evidence signing keys
    environment:
      name: admin-ops
      deployment: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Mint status bootstrap dispatch token
        id: bootstrap_dispatch
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Bootstrap status signing keyring
        env:
          GH_TOKEN: ${{ secrets.AW_ADMIN_TOKEN }}
          AW_STATUS_TOKEN: ${{ secrets.AW_STATUS_TOKEN }}
          AW_STATUS_KEYRING: ${{ secrets.AW_STATUS_KEYRING }}
          AW_DISPATCH_API_TOKEN: ${{ steps.bootstrap_dispatch.outputs.token }}
          AW_BOOTSTRAP_READ_TOKEN: ${{ github.token }}
        run: node scripts/bootstrap-status-signing.ts

  resolve-managed:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    name: Resolve managed repositories
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      repositories: ${{ github.event_name == 'workflow_run' && steps.dev_settings.outputs.repositories || steps.policy.outputs.repositories }}
    steps:
      - name: Check out control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Resolve repository policy
        id: policy
        run: node scripts/repository-policy.ts list pr

      - name: Mint scoped dev settings read token
        if: github.event_name == 'workflow_run'
        id: dev_read
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.policy.outputs.read_repositories_csv }}
          permission-actions: read
          permission-contents: read
          permission-statuses: read

      - name: Resolve changed dev audit subjects
        if: github.event_name == 'workflow_run'
        id: dev_settings
        env:
          AW_CONTROL_TOKEN: ${{ steps.dev_read.outputs.token }}
          AW_STATUS_KEYRING: ${{ secrets.AW_STATUS_KEYRING }}
          AUDIT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node scripts/resolve-dev-settings.ts

  apply-managed:
    needs: resolve-managed
    if: needs.resolve-managed.outputs.repositories != '[]' && needs.resolve-managed.outputs.repositories != ''
    name: Apply managed settings · ${{ matrix.repository }}
    environment:
      name: admin-ops
      deployment: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        repository: ${{ fromJSON(needs.resolve-managed.outputs.repositories) }}
    steps:
      - name: Check out control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Apply managed settings
        id: applied
        env:
          GH_TOKEN: ${{ secrets.AW_ADMIN_TOKEN }}
          TARGET_REPOSITORY: ${{ matrix.repository }}
          AW_STATUS_KEYRING: ${{ secrets.AW_STATUS_KEYRING }}
        run: node scripts/apply-repository-settings.ts "$TARGET_REPOSITORY" false

      - name: Mint scoped intake wake token
        if: steps.applied.outputs.dev_protection_changed == 'true'
        id: wake_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Wake PR intake after dev protection changes
        if: steps.applied.outputs.dev_protection_changed == 'true'
        env:
          GH_TOKEN: ${{ steps.wake_app.outputs.token }}
          CONTROL_REPOSITORY: ${{ github.repository }}
          TARGET_REPOSITORY: ${{ matrix.repository }}
        run: |
          jq -n --arg repository "$TARGET_REPOSITORY" \
            '{event_type:"run-intake",client_payload:{repository:$repository}}' |
            gh api --method POST "repos/$CONTROL_REPOSITORY/dispatches" --input -

      - name: Plan Beta release readiness check
        if: github.event_name != 'workflow_run'
        id: beta_plan
        env:
          GH_TOKEN: ${{ secrets.AW_ADMIN_TOKEN }}
          TARGET_REPOSITORY: ${{ matrix.repository }}
          BETA_APP_CONFIGURED: ${{ vars.AW_APP_CLIENT_ID != '' && secrets.AW_APP_PRIVATE_KEY != '' }}
        run: node scripts/audit-beta-readiness.ts release-plan

      - name: Probe scoped release App permission
        if: steps.beta_plan.outputs.probe == 'true'
        id: beta_probe
        continue-on-error: true
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.beta_plan.outputs.repository_name }}
          permission-contents: write

      - name: Report Beta release readiness
        if: steps.beta_plan.outputs.probe == 'true'
        env:
          GH_TOKEN: ${{ steps.beta_probe.outputs.token }}
          TARGET_REPOSITORY: ${{ matrix.repository }}
        run: node scripts/audit-beta-readiness.ts release-probe
