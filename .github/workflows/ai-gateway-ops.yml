name: 手动 · 管理网关密钥

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 操作类型（inventory 仅盘点名称；put 更新单个 Cloudflare Worker Secret）
        required: true
        type: choice
        options:
          - inventory
          - put
        default: inventory
      secret_name:
        description: put 操作的目标密钥名称（只接受 AI Gateway 运行时密钥）
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ai-gateway-ops-secret-management
  cancel-in-progress: false

jobs:
  manage:
    if: github.ref == 'refs/heads/main'
    name: Manage AI Gateway runtime secret
    runs-on: ubuntu-24.04
    environment: ai-gateway-ops
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out approved operations implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Inventory Worker Secret names
        if: inputs.operation == 'inventory'
        env:
          CLOUDFLARE_API_TOKEN_OPS: ${{ secrets.CLOUDFLARE_API_TOKEN_OPS }}
          CLOUDFLARE_ACCOUNT_ID_OPS: ${{ vars.CLOUDFLARE_ACCOUNT_ID_OPS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/ai-gateway-ops.ts inventory

      - name: Update one Worker Secret without placeholder code deployment
        if: inputs.operation == 'put'
        env:
          CLOUDFLARE_API_TOKEN_OPS: ${{ secrets.CLOUDFLARE_API_TOKEN_OPS }}
          CLOUDFLARE_ACCOUNT_ID_OPS: ${{ vars.CLOUDFLARE_ACCOUNT_ID_OPS }}
          AIG_OPS_SECRET_VALUE: ${{ secrets.AIG_OPS_SECRET_VALUE }}
          AIG_DEPLOY_HEALTH_KEY: ${{ secrets.AIG_DEPLOY_HEALTH_KEY }}
          AIG_PUBLIC_URL: ${{ vars.AIG_PUBLIC_URL }}
          SECRET_NAME: ${{ inputs.secret_name }}
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/ai-gateway-ops.ts put "$SECRET_NAME"

      - name: Operations summary
        if: always()
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          {
            echo "## AI Gateway secret operations"
            echo
            echo "- Operation: $OPERATION"
            echo "- Worker: ai-gateway"
            echo "- Secret values: never written to workflow output"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
