name: 手动 · 管理网关密钥

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 操作类型（inventory 密钥盘点；runtime-inventory 四 Worker 盘点；put 更新密钥；deploy-center 发布私有中心）
        required: true
        type: choice
        options:
          - inventory
          - runtime-inventory
          - put
          - deploy-center
        default: inventory
      worker:
        description: 运行时 Worker（私有中心必须先完成无公网部署）
        required: true
        type: choice
        options:
          - ai-gateway
          - ai-inference-center
          - ai-generation-center
        default: ai-gateway
      secret_name:
        description: put 操作的目标密钥名称（按 Worker 严格授权）
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ai-gateway-ops-secret-management
  cancel-in-progress: false

jobs:
  manage:
    if: github.ref == 'refs/heads/main'
    name: Manage AI Gateway runtime secret
    runs-on: ubuntu-24.04
    environment:
      name: ai-gateway-ops
      deployment: false
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out approved operations implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Inventory Worker Secret names
        if: inputs.operation == 'inventory'
        env:
          CLOUDFLARE_API_TOKEN_OPS: ${{ secrets.CLOUDFLARE_API_TOKEN_SECONDARY }}
          CLOUDFLARE_ACCOUNT_ID_OPS: ${{ vars.CLOUDFLARE_ACCOUNT_ID_SECONDARY }}
          AIG_OPS_WORKER_NAME: ${{ inputs.worker }}
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/ai-gateway-ops.ts inventory

      # Production metadata is read by code pinned to an independently
      # CI-verified, immutable AI Gateway main commit. Never run arbitrary
      # user-supplied refs with privileged Cloudflare environment credentials.
      - name: Check out approved read-only inventory implementation
        if: inputs.operation == 'runtime-inventory'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fongap-labs/ai-gateway
          ref: b976bbfa2184738e09f7f4c7c885f5836efcbd5a
          path: ag-inspector
          persist-credentials: false

      - name: Inspect four Workers without changing Cloudflare
        if: inputs.operation == 'runtime-inventory'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID_SECONDARY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_SECONDARY }}
          SECRET_NAME: ${{ inputs.secret_name }}
          PINNED_INSPECTOR_SHA: b976bbfa2184738e09f7f4c7c885f5836efcbd5a
        shell: bash
        run: |
          set -Eeuo pipefail
          [ -z "$SECRET_NAME" ] || {
            echo "::error::runtime-inventory must not include secret_name." >&2
            exit 64
          }
          actual_sha="$(git -C ag-inspector rev-parse HEAD)"
          [ "$actual_sha" = "$PINNED_INSPECTOR_SHA" ] || {
            echo "::error::Read-only inspector source SHA mismatch." >&2
            exit 77
          }
          # Both contracts use mock Cloudflare responses and cannot deploy.
          node ag-inspector/scripts/check-cloudflare-live-inventory.mjs
          node ag-inspector/scripts/check-production-cutover-evidence.mjs
          # Live inspection makes only HTTPS GET requests. Its output is a
          # redacted summary; no resource IDs, Secret values or private
          # inventory JSON are uploaded as CI artifacts.
          node ag-inspector/scripts/cloudflare-live-inventory.mjs

      - name: Update one Worker Secret without placeholder code deployment
        if: inputs.operation == 'put'
        env:
          CLOUDFLARE_API_TOKEN_OPS: ${{ secrets.CLOUDFLARE_API_TOKEN_SECONDARY }}
          CLOUDFLARE_ACCOUNT_ID_OPS: ${{ vars.CLOUDFLARE_ACCOUNT_ID_SECONDARY }}
          AIG_OPS_SECRET_VALUE: ${{ secrets.AIG_OPS_SECRET_VALUE }}
          AIG_DEPLOY_HEALTH_KEY: ${{ secrets.AIG_DEPLOY_HEALTH_KEY }}
          AIG_PUBLIC_URL: ${{ vars.AIG_PUBLIC_URL }}
          SECRET_NAME: ${{ inputs.secret_name }}
          AIG_OPS_WORKER_NAME: ${{ inputs.worker }}
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/ai-gateway-ops.ts put "$SECRET_NAME"

      # Privileged manual bootstrap. Source is an immutable CI-verified main SHA,
      # not an untrusted workflow input. Updates to the pin require a reviewed PR.
      - name: Check out approved AI Gateway private centers
        if: inputs.operation == 'deploy-center'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fongap-labs/ai-gateway
          ref: b976bbfa2184738e09f7f4c7c885f5836efcbd5a
          path: ag-center
          persist-credentials: false

      - name: Deploy one approved private center
        if: inputs.operation == 'deploy-center'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_SECONDARY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID_SECONDARY }}
          AIG_OPS_VARIABLES_JSON: ${{ toJSON(vars) }}
          WORKER: ${{ inputs.worker }}
          SECRET_NAME: ${{ inputs.secret_name }}
          PINNED_CENTER_SHA: b976bbfa2184738e09f7f4c7c885f5836efcbd5a
          DEPLOY_SOURCE_SHA: b976bbfa2184738e09f7f4c7c885f5836efcbd5a
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -z "$SECRET_NAME" ]] || {
            echo "::error::deploy-center must not include secret_name." >&2
            exit 64
          }
          case "$WORKER" in
            ai-inference-center|ai-generation-center) ;;
            *) echo "::error::Only the two approved private centers may be deployed." >&2; exit 64 ;;
          esac
          [[ "$(git -C ag-center rev-parse HEAD)" == "$PINNED_CENTER_SHA" ]] || exit 77
          # Do not execute an immutable feature-branch SHA: the source must be
          # the currently reviewed and published main revision.
          main_sha="$(git ls-remote https://github.com/fongap-labs/ai-gateway.git refs/heads/main | cut -f1)"
          [[ "$main_sha" == "$PINNED_CENTER_SHA" ]] || {
            echo "::error::Private center source pin does not match approved AI Gateway main." >&2
            exit 77
          }
          cd ag-center
          npm ci
          npm run validate:deploy
          config="$RUNNER_TEMP/private-center-release.json"
          manifest="$RUNNER_TEMP/private-center-release-manifest.json"
          trap 'rm -f "$config" "$manifest"' EXIT
          node scripts/private-center-config.mjs prepare \
            --worker "$WORKER" --output "$config" --manifest "$manifest"
          node scripts/cloudflare-wrangler.mjs deploy --config "$config"
          echo "Private center code deployed; its Secret inventory and internal auth must be verified before Gateway cutover."

      - name: Operations summary
        if: always()
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          TARGET_WORKER: ${{ inputs.worker }}
        run: |
          {
            echo "## AI Gateway secret operations"
            echo
            echo "- Operation: $OPERATION"
            echo "- Worker: $TARGET_WORKER"
            echo "- Scope: selected runtime Worker (runtime-inventory is read-only for four Workers)"
            echo "- Secret values: never written to workflow output"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
