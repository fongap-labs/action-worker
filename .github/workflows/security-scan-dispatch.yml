name: 自动 · 安全扫描

on:
  repository_dispatch:
    types: [run-security-scan]

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.event.client_payload.repository }}-${{ github.event.client_payload.source_sha }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    outputs:
      repository: ${{ steps.resolve.outputs.repository }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      ref: ${{ steps.resolve.outputs.ref }}
      matrix: ${{ steps.resolve.outputs.matrix }}

    steps:
      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Resolve security scan read scope
        id: api_scope
        env:
          TARGET_REPOSITORY: ${{ github.event.client_payload.repository }}
        run: node scripts/resolve-github-api-scope.ts pr

      - name: Mint security scan read token
        id: app_read
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.api_scope.outputs.owner }}
          repositories: ${{ steps.api_scope.outputs.repository_name }}
          permission-contents: read
          permission-pull-requests: read

      - name: Resolve trusted security scan
        id: resolve
        env:
          AW_CONTROL_TOKEN: ${{ steps.app_read.outputs.token }}
          SECURITY_SCAN_REQUEST_JSON: ${{ toJSON(github.event.client_payload) }}
        run: node scripts/resolve-security-scan.ts policies/runner.json

  analyze:
    name: CodeQL / ${{ matrix.language }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ fromJSON(matrix.runner_labels_json) }}
    timeout-minutes: 90

    steps:
      - name: Checkout target source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.prepare.outputs.repository }}
          ref: ${{ needs.prepare.outputs.source_sha }}
          # Private sources never reach this job (resolve-security-scan.ts refuses them).
          token: ${{ github.token }}
          path: target
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build_mode }}
          source-root: target

      - name: Analyze CodeQL
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          upload: never
          upload-database: false
          output: ${{ runner.temp }}/codeql-results
          checkout_path: ${{ github.workspace }}/target
          ref: ${{ needs.prepare.outputs.ref }}
          sha: ${{ needs.prepare.outputs.source_sha }}
          category: central/language:${{ matrix.language }}

      - name: Upload SARIF
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-results-${{ matrix.language }}
          path: ${{ runner.temp }}/codeql-results
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish SARIF
    environment:
      name: admin-ops
      deployment: false
    needs: [prepare, analyze]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout security publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
          persist-credentials: false

      - name: Setup Node for publisher
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Download SARIF
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: codeql-results-*
          path: ${{ runner.temp }}/codeql-results
          merge-multiple: true

      - name: Resolve SARIF target repository scope
        id: sarif_scope
        working-directory: control
        env:
          TARGET_REPOSITORY: ${{ needs.prepare.outputs.repository }}
        run: node scripts/resolve-github-api-scope.ts pr

      - name: Mint target-only code scanning writer
        id: sarif_app
        uses: ./control/.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.sarif_scope.outputs.owner }}
          repositories: ${{ steps.sarif_scope.outputs.repository_name }}
          permission-security-events: write

      - name: Publish SARIF to target repository
        env:
          AW_SECURITY_EVENTS_API_TOKEN: ${{ steps.sarif_app.outputs.token }}
          TARGET_REPOSITORY: ${{ needs.prepare.outputs.repository }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          SOURCE_REF: ${{ needs.prepare.outputs.ref }}
        run: |
          node control/scripts/publish-security-scan.ts             "$TARGET_REPOSITORY"             "$SOURCE_SHA"             "$SOURCE_REF"             "$RUNNER_TEMP/codeql-results"
