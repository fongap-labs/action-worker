name: 安全 · 任务 Runner 隔离演练

on:
  workflow_dispatch:

permissions: {}

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    name: Prepare synthetic input on trusted runner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout pinned trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Prepare synthetic run-bound manifest
        run: node scripts/task-runner-isolation-canary.ts prepare "$RUNNER_TEMP/prepare.json"
      - name: Upload synthetic input
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canary-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prepare.json
          if-no-files-found: error
          retention-days: 1

  execute:
    needs: prepare
    name: Simulate untrusted task on separate runner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout pinned test source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Download synthetic input
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canary-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/canary-input
      - name: Attempt task workspace and process poisoning
        shell: bash
        run: |
          set -Eeuo pipefail
          # Local-only synthetic attack: no credentials, private data or target service access.
          nohup node -e 'setTimeout(() => require("node:fs").writeFileSync(process.argv[1], "poisoned"), 2000)' "$RUNNER_TEMP/canary-background-poison" >/dev/null 2>&1 &
          echo 'AW_CANARY_POISON=1' >> "$GITHUB_ENV"
          node scripts/task-runner-isolation-canary.ts execute             "$RUNNER_TEMP/canary-input/prepare.json" "$RUNNER_TEMP/result.json"
      - name: Upload untrusted synthetic result only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canary-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/result.json
          if-no-files-found: error
          retention-days: 1

  finalize:
    needs: [prepare, execute]
    name: Verify trusted runner and untrusted artifact isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout pinned trusted source again
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Download synthetic input
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canary-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/canary-input
      - name: Download untrusted synthetic result
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canary-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/canary-result
      - name: Verify isolated environment and trusted checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -n "${AW_CANARY_POISON:-}" ] || [ -e "$RUNNER_TEMP/canary-background-poison" ]; then
            echo "::error::Untrusted execution contaminated the trusted job." >&2
            exit 66
          fi
          node scripts/task-runner-isolation-canary.ts finalize             "$RUNNER_TEMP/canary-input/prepare.json"             "$RUNNER_TEMP/canary-result/result.json"
