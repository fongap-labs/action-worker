name: 自动 · CI 沙箱

# Runs a target repository's trusted CI script against the change under test. Change code executes
# in these jobs, so they reference no central credential: public targets are checked out with the
# run's read-only token, and the caller supplies App credentials only to the trusted, single-repository token mint step.

on:
  workflow_call:
    inputs:
      platform:
        description: Sandbox platform, linux or windows
        required: true
        type: string
      shard:
        description: Manifest-declared Linux shard; all runs every phase
        required: false
        type: string
        default: all
      repository:
        required: true
        type: string
      pr_number:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      diff_base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      merge_sha:
        required: false
        type: string
        default: ""
      control_ref:
        required: true
        type: string
      is_private:
        required: true
        type: string
      app_client_id:
        description: GitHub App client ID for the trusted checkout step
        required: false
        type: string
      private_windows_numeric_diagnostic:
        description: Trusted central policy grant for bounded private Windows numeric diagnostics
        required: false
        type: string
        default: "false"
    outputs:
      windows_diagnostic:
        description: Numeric failure index and count for centrally authorized private Windows suites only
        value: ${{ jobs.windows.outputs.windows_diagnostic }}
    secrets:
      app_private_key:
        description: GitHub App private key used only by the trusted mint step
        required: false

permissions:
  contents: read

jobs:
  linux:
    name: Linux
    if: inputs.platform == 'linux'
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # A pull request is tested as it would merge into the default branch, so the central test pack
      # from the control ref never runs against code that the default branch has already moved past.
      # When the default branch changed under the PR and the merge conflicts, GitHub has no merge
      # ref and the checkout fails as the merge gate.
      - name: Resolve private checkout repository scope
        id: private_scope
        if: inputs.is_private == 'true'
        shell: bash
        env:
          TARGET_REPOSITORY: ${{ inputs.repository }}
          CONTROL_OWNER: ${{ github.repository_owner }}
        run: |
          set -Eeuo pipefail
          node -e '
            const fs = require("node:fs");
            const parts = String(process.env.TARGET_REPOSITORY ?? "").split("/");
            const owner = String(process.env.CONTROL_OWNER ?? "");
            if (parts.length !== 2 || parts[0].toLowerCase() !== owner.toLowerCase() || !/^[A-Za-z0-9_.-]+$/.test(parts[1])) {
              process.stderr.write("::error::Invalid private checkout scope.\n");
              process.exit(77);
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "repository_name=" + parts[1] + "\n");
          '

      - name: Mint private CI checkout read token
        id: private_read_app
        if: inputs.is_private == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.private_scope.outputs.repository_name }}
          permission-contents: read

      - name: Require private checkout token
        if: inputs.is_private == 'true'
        shell: bash
        env:
          CHECKOUT_TOKEN: ${{ steps.private_read_app.outputs.token }}
        run: |
          if [ -z "${CHECKOUT_TOKEN:-}" ]; then
            echo "::error::Missing scoped GitHub App read token for target repository; check App installation Contents: Read. No PAT fallback." >&2
            exit 77
          fi

      - name: Checkout private target PR
        if: inputs.is_private == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.pr_number != '0' && inputs.merge_sha || inputs.head_sha }}
          token: ${{ steps.private_read_app.outputs.token }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout public target PR
        if: inputs.is_private != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.pr_number != '0' && inputs.merge_sha || inputs.head_sha }}
          token: ${{ github.token }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout private trusted CI control
        if: inputs.is_private == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.control_ref }}
          token: ${{ steps.private_read_app.outputs.token }}
          path: ci-control
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout public trusted CI control
        if: inputs.is_private != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.control_ref }}
          token: ${{ github.token }}
          path: ci-control
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout central test pack
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          path: aw

      # This checkout is never rewound to the target's pinned test pack. Security enforcement
      # always uses the trusted control-plane revision for the current workflow run.
      - name: Checkout current central security scanner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: aw-security

      - name: Verify pinned CI checkout
        env:
          PINNED_PR_NUMBER: ${{ inputs.pr_number }}
          PINNED_BASE_SHA: ${{ inputs.base_sha }}
          PINNED_HEAD_SHA: ${{ inputs.head_sha }}
          PINNED_MERGE_SHA: ${{ inputs.merge_sha }}
        run: node aw/scripts/verify-ci-checkout.ts "$GITHUB_WORKSPACE/target" "$PINNED_PR_NUMBER" "$PINNED_BASE_SHA" "$PINNED_HEAD_SHA" "$PINNED_MERGE_SHA"

      - name: Pin central test pack
        shell: pwsh
        run: node aw/scripts/prepare-test-pack.ts "${{ github.workspace }}/aw" "${{ github.workspace }}/ci-control/.github/test-pack.json"

      # Central secret scan uses the current trusted control-plane SHA, not the target's
      # historical test-pack ref. Findings and scanner failures fail closed by default.
      - name: Scan the change for secrets
        env:
          AW_GITLEAKS_MODE: enforce
          TARGET_PRIVATE: ${{ inputs.is_private }}
          SCAN_BASE_SHA: ${{ inputs.diff_base_sha }}
          SCAN_HEAD_SHA: ${{ inputs.head_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          config=""
          if [ -f "$GITHUB_WORKSPACE/ci-control/.gitleaks.toml" ]; then
            config="$GITHUB_WORKSPACE/ci-control/.gitleaks.toml"
          fi
          node aw-security/scripts/central-secret-scan.ts "$GITHUB_WORKSPACE/target" "$SCAN_BASE_SHA" "$SCAN_HEAD_SHA" "$config"

      - name: Run trusted Linux CI
        env:
          CENTRAL_CI_AW_ROOT: ${{ github.workspace }}/aw
          CENTRAL_CI_BASE_SHA: ${{ inputs.base_sha }}
          CENTRAL_CI_HEAD_SHA: ${{ inputs.head_sha }}
          CENTRAL_CI_PR_NUMBER: ${{ inputs.pr_number }}
          CENTRAL_CI_SHARD: ${{ inputs.shard }}
          TARGET_REPOSITORY: ${{ inputs.repository }}
          TARGET_PRIVATE: ${{ inputs.is_private }}
        shell: bash
        run: |
          set -Eeuo pipefail
          script="$GITHUB_WORKSPACE/ci-control/.github/scripts/central-ci.sh"
          test -f "$script"

          # Only a manifest-declared shard is passed on; an unsharded project keeps its exact invocation.
          script_args=("$GITHUB_WORKSPACE/target")
          if [ "$CENTRAL_CI_SHARD" != "all" ]; then
            script_args+=("$CENTRAL_CI_SHARD")
          fi

          log="$RUNNER_TEMP/central-ci-linux.log"
          failure_meta="$RUNNER_TEMP/central-ci-linux.failure"
          wrapper="$RUNNER_TEMP/central-ci-wrapper.sh"
          cat >"$wrapper" <<'EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          record_failure() {
            local code=$?
            if [ "$code" -ne 0 ] && [ -n "${CENTRAL_CI_FAILURE_FILE:-}" ] && [ ! -s "$CENTRAL_CI_FAILURE_FILE" ]; then
              printf "%s:%s\n" "${BASH_LINENO[0]:-$LINENO}" "$code" > "$CENTRAL_CI_FAILURE_FILE"
            fi
          }
          trap record_failure ERR
          trap record_failure EXIT
          script="$1"
          shift
          source "$script" "$@"
          EOF
          chmod 700 "$wrapper"

          set +e
          CENTRAL_CI_FAILURE_FILE="$failure_meta" \
            bash "$wrapper" "$script" "${script_args[@]}" >"$log" 2>&1
          code=$?
          set -e

          if [ "$code" -ne 0 ]; then
            if [ "$TARGET_PRIVATE" = "false" ]; then
              cat "$log"
            else
              diagnostic=""
              if [ -f "$failure_meta" ]; then
                IFS=: read -r failure_line failure_code <"$failure_meta" || true
                if [[ "$failure_line" =~ ^[0-9]+$ ]] && [[ "$failure_code" =~ ^[0-9]+$ ]]; then
                  diagnostic=" Trusted CI failed at line $failure_line with exit code $failure_code."
                fi
              fi
              echo "::error::Central Linux CI failed for $TARGET_REPOSITORY.$diagnostic Detailed output is suppressed because the target repository is private."
            fi
            exit "$code"
          fi

          # Public repositories keep the project script's phase markers so per-phase time stays visible.
          if [ "$TARGET_PRIVATE" = "false" ]; then
            grep '^central-ci:' "$log" || true
          fi

          echo "Central Linux CI passed for $TARGET_REPOSITORY (shard: $CENTRAL_CI_SHARD)."

  windows:
    name: Windows
    if: inputs.platform == 'windows'
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      windows_diagnostic: ${{ steps.private_diag.outputs.windows_diagnostic }}

    steps:
      - name: Setup Node for scoped private checkout
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # A pull request is tested as it would merge into the default branch; see the Linux job.
      - name: Resolve private checkout repository scope
        id: private_scope
        if: inputs.is_private == 'true'
        shell: bash
        env:
          TARGET_REPOSITORY: ${{ inputs.repository }}
          CONTROL_OWNER: ${{ github.repository_owner }}
        run: |
          set -Eeuo pipefail
          node -e '
            const fs = require("node:fs");
            const parts = String(process.env.TARGET_REPOSITORY ?? "").split("/");
            const owner = String(process.env.CONTROL_OWNER ?? "");
            if (parts.length !== 2 || parts[0].toLowerCase() !== owner.toLowerCase() || !/^[A-Za-z0-9_.-]+$/.test(parts[1])) {
              process.stderr.write("::error::Invalid private checkout scope.\n");
              process.exit(77);
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "repository_name=" + parts[1] + "\n");
          '

      - name: Mint private CI checkout read token
        id: private_read_app
        if: inputs.is_private == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.private_scope.outputs.repository_name }}
          permission-contents: read

      - name: Require private checkout token
        if: inputs.is_private == 'true'
        shell: pwsh
        env:
          CHECKOUT_TOKEN: ${{ steps.private_read_app.outputs.token }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CHECKOUT_TOKEN)) {
            Write-Error "Missing scoped GitHub App read token for target repository; check App installation Contents: Read. No PAT fallback."
            exit 77
          }

      - name: Checkout private target PR
        if: inputs.is_private == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.pr_number != '0' && inputs.merge_sha || inputs.head_sha }}
          token: ${{ steps.private_read_app.outputs.token }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout public target PR
        if: inputs.is_private != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.pr_number != '0' && inputs.merge_sha || inputs.head_sha }}
          token: ${{ github.token }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout private trusted CI control
        if: inputs.is_private == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.control_ref }}
          token: ${{ steps.private_read_app.outputs.token }}
          path: ci-control
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout public trusted CI control
        if: inputs.is_private != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.control_ref }}
          token: ${{ github.token }}
          path: ci-control
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Checkout central test pack
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          path: aw

      - name: Verify pinned CI checkout
        shell: pwsh
        env:
          PINNED_PR_NUMBER: ${{ inputs.pr_number }}
          PINNED_BASE_SHA: ${{ inputs.base_sha }}
          PINNED_HEAD_SHA: ${{ inputs.head_sha }}
          PINNED_MERGE_SHA: ${{ inputs.merge_sha }}
        run: node aw/scripts/verify-ci-checkout.ts "$env:GITHUB_WORKSPACE/target" "$env:PINNED_PR_NUMBER" "$env:PINNED_BASE_SHA" "$env:PINNED_HEAD_SHA" "$env:PINNED_MERGE_SHA"

      - name: Pin central test pack
        shell: pwsh
        run: node aw/scripts/prepare-test-pack.ts "${{ github.workspace }}/aw" "${{ github.workspace }}/ci-control/.github/test-pack.json"

      - name: Run trusted Windows CI
        env:
          CENTRAL_CI_AW_ROOT: ${{ github.workspace }}/aw
          CENTRAL_CI_BASE_SHA: ${{ inputs.base_sha }}
          CENTRAL_CI_HEAD_SHA: ${{ inputs.head_sha }}
          CENTRAL_CI_PR_NUMBER: ${{ inputs.pr_number }}
          TARGET_REPOSITORY: ${{ inputs.repository }}
          TARGET_PRIVATE: ${{ inputs.is_private }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $script = "$env:GITHUB_WORKSPACE\ci-control\.github\scripts\central-ci.ps1"
          if (-not (Test-Path $script)) {
            throw "Missing trusted central CI script."
          }

          $log = Join-Path $env:RUNNER_TEMP "central-ci-windows.log"
          try {
            & $script -TargetRoot "$env:GITHUB_WORKSPACE\target" *> $log
            if ($LASTEXITCODE -ne 0) {
              throw "Central Windows CI returned exit code $LASTEXITCODE."
            }
          }
          catch {
            if ($env:TARGET_PRIVATE -eq "false" -and (Test-Path $log)) {
              Get-Content $log
            }
            else {
              Write-Error "Central Windows CI failed for $env:TARGET_REPOSITORY. Detailed output is suppressed because the target repository is private."
            }
            exit 1
          }

          Write-Host "Central Windows CI passed for $env:TARGET_REPOSITORY."

      # Only centrally authorized private Windows suites may export numeric failure indices.
      # The source code, test names, paths and stderr stay in runner-local log.
      # This diagnostic cannot change or bypass any CI success verdict.
      - name: Export private test index
        id: private_diag
        if: always() && inputs.is_private == 'true' && inputs.private_windows_numeric_diagnostic == 'true'
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "central-ci-windows.log"
          if (-not (Test-Path -LiteralPath $log -PathType Leaf)) { exit 0 }
          $body = Get-Content -LiteralPath $log -Raw -ErrorAction SilentlyContinue
          if ([string]::IsNullOrEmpty($body)) { exit 0 }
          $failures = [regex]::Matches($body, '(?m)^WC_TEST_FAIL_INDEX=([1-9][0-9]{0,2})(?![0-9])')
          if ($failures.Count -gt 0 -and $failures.Count -le 999) {
            # Publish up to five distinct numeric indices, never private names,
            # paths or log contents. The failure verdict remains unchanged.
            $indices = @($failures | Select-Object -First 5 | ForEach-Object { [int]$_.Groups[1].Value })
            $joined = $indices -join '.'
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ("windows_diagnostic=wc-tests-{0}-{1}" -f $joined, $failures.Count)
          }
