name: 自动 · CI 沙箱

# Runs a target repository's trusted CI script against the change under test. Change code executes
# in these jobs. Public targets use the run's read-only token; private targets receive a short-lived,
# contents-read-only GitHub App token minted immediately before checkout.

on:
  workflow_call:
    inputs:
      platform:
        description: Sandbox platform, linux or windows
        required: true
        type: string
      shard:
        description: Manifest-declared Linux shard; all runs every phase
        required: false
        type: string
        default: all
      repository:
        required: true
        type: string
      owner:
        required: true
        type: string
      repository_name:
        required: true
        type: string
      app_client_id:
        required: true
        type: string
      pr_number:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      diff_base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      merge_sha:
        required: false
        type: string
        default: ""
      control_ref:
        required: true
        type: string
      is_private:
        required: true
        type: string
      private_windows_numeric_diagnostic:
        description: Trusted central policy grant for bounded private Windows numeric diagnostics
        required: false
        type: string
        default: "false"
    outputs:
      windows_diagnostic:
        description: Numeric failure index and count for centrally authorized private Windows suites only
        value: ${{ jobs.windows.outputs.windows_diagnostic }}
    secrets:
      app_private_key:
        description: App key used only to mint a short-lived contents-read token for the private target
        required: false

permissions:
  contents: read

jobs:
  linux:
    name: Linux
    if: inputs.platform == 'linux'
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Mask target repository and commit identities
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -r '
            (.client_payload // {}) |
            [.repository, .head_sha, .base_sha, .merge_sha] |
            .[]? | select(type == "string" and length > 0)
          ' "$GITHUB_EVENT_PATH" | while IFS= read -r identity; do
            printf '::add-mask::%s\n' "$identity"
          done

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.repository == 'fongap-labs/delta' && '26.13.1' || '22' }}

      - name: Provision pinned Delta package manager
        if: inputs.repository == 'fongap-labs/delta' && inputs.is_private == 'false'
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --prefix "$RUNNER_TEMP/delta-ci-tools" \
            --no-audit --no-fund --no-save --package-lock=false pnpm@11.28.5
          echo "$RUNNER_TEMP/delta-ci-tools/node_modules/.bin" >> "$GITHUB_PATH"

      # A pull request is tested as it would merge into the default branch, so the central test pack
      # from the control ref never runs against code that the default branch has already moved past.
      # When the default branch changed under the PR and the merge conflicts, GitHub has no merge
      # ref and the checkout fails as the merge gate.
      - name: Mint scoped private target read token
        id: private_read
        if: inputs.is_private == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: ${{ inputs.owner }}
          repositories: ${{ inputs.repository_name }}
          permission-contents: read

      - name: Require scoped private target read token
        if: inputs.is_private == 'true'
        shell: bash
        env:
          CHECKOUT_TOKEN: ${{ steps.private_read.outputs.token }}
        run: |
          if [ -z "${CHECKOUT_TOKEN:-}" ]; then
            echo "::error::Unable to mint a Contents: Read App token for the private target. Verify the App installation includes the repository." >&2
            exit 77
          fi

      - name: Checkout private target PR
        if: inputs.is_private == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.pr_number != '0' && inputs.merge_sha || inputs.head_sha }}
          token: ${{ steps.private_read.outputs.token }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout public target PR
        if: inputs.is_private != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.pr_number != '0' && inputs.merge_sha || inputs.head_sha }}
          token: ${{ github.token }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout private trusted CI control
        if: inputs.is_private == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.control_ref }}
          token: ${{ steps.private_read.outputs.token }}
          path: ci-control
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout public trusted CI control
        if: inputs.is_private != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.control_ref }}
          token: ${{ github.token }}
          path: ci-control
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout central test pack
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          path: aw

      # This checkout is never rewound to the target's pinned test pack. Security enforcement
      # always uses the trusted control-plane revision for the current workflow run.
      - name: Checkout current central security scanner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: aw-security

      - name: Verify pinned CI checkout
        env:
          PINNED_PR_NUMBER: ${{ inputs.pr_number }}
          PINNED_BASE_SHA: ${{ inputs.base_sha }}
          PINNED_HEAD_SHA: ${{ inputs.head_sha }}
          PINNED_MERGE_SHA: ${{ inputs.merge_sha }}
        run: node aw/scripts/verify-ci-checkout.ts "$GITHUB_WORKSPACE/target" "$PINNED_PR_NUMBER" "$PINNED_BASE_SHA" "$PINNED_HEAD_SHA" "$PINNED_MERGE_SHA"

      - name: Pin central test pack
        shell: pwsh
        run: node aw/scripts/prepare-test-pack.ts "${{ github.workspace }}/aw" "${{ github.workspace }}/ci-control/.github/test-pack.json"

      # Central secret scan uses the current trusted control-plane SHA, not the target's
      # historical test-pack ref. Findings and scanner failures fail closed by default.
      - name: Scan the change for secrets
        env:
          AW_GITLEAKS_MODE: enforce
          TARGET_PRIVATE: ${{ inputs.is_private }}
          SCAN_BASE_SHA: ${{ inputs.diff_base_sha }}
          SCAN_HEAD_SHA: ${{ inputs.head_sha }}
          TARGET_REPOSITORY: ${{ inputs.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          config=""
          if [ -f "$GITHUB_WORKSPACE/ci-control/.gitleaks.toml" ]; then
            config="$GITHUB_WORKSPACE/ci-control/.gitleaks.toml"
          fi
          node aw-security/scripts/central-secret-scan.ts "$GITHUB_WORKSPACE/target" "$SCAN_BASE_SHA" "$SCAN_HEAD_SHA" "$config"

      # Trusted policy is evaluated independently of a PR-controlled test pack or CI script.
      - name: Enforce central engineering ownership
        env:
          POLICY_BASE_SHA: ${{ inputs.diff_base_sha }}
          POLICY_HEAD_SHA: ${{ inputs.head_sha }}
          TARGET_REPOSITORY: ${{ inputs.repository }}
          TARGET_PRIVATE: ${{ inputs.is_private }}
        shell: bash
        run: |
          set -Eeuo pipefail
          node aw-security/scripts/central-engineering-gate.ts \
            "$GITHUB_WORKSPACE/target" "$POLICY_BASE_SHA" "$POLICY_HEAD_SHA" "$TARGET_REPOSITORY"

      - name: Run trusted Linux CI
        env:
          CENTRAL_CI_AW_ROOT: ${{ github.workspace }}/aw
          CENTRAL_CI_BASE_SHA: ${{ inputs.base_sha }}
          CENTRAL_CI_HEAD_SHA: ${{ inputs.head_sha }}
          CENTRAL_CI_PR_NUMBER: ${{ inputs.pr_number }}
          CENTRAL_CI_SHARD: ${{ inputs.shard }}
          TARGET_REPOSITORY: ${{ inputs.repository }}
          TARGET_PRIVATE: ${{ inputs.is_private }}
        shell: bash
        run: |
          set -Eeuo pipefail
          # The reviewed Delta reinitialization contains only README and LICENSE.
          # Verify its exact immutable Git tree instead of falsely reporting app tests.
          # No other root or repository may use this non-app baseline check.
          if [[ "$TARGET_REPOSITORY" == "fongap-labs/delta" &&
                "$CENTRAL_CI_BASE_SHA" == "96d36e875dcd24a28926b9993843ddac9ed11a8f" &&
                "$CENTRAL_CI_HEAD_SHA" == "96d36e875dcd24a28926b9993843ddac9ed11a8f" &&
                "$CENTRAL_CI_PR_NUMBER" == "0" &&
                "$TARGET_PRIVATE" == "false" ]]; then
            if [[ "$CENTRAL_CI_SHARD" != "all" ]]; then
              echo "::error::The reviewed Delta root cannot declare CI shards." >&2
              exit 65
            fi
            node "$CENTRAL_CI_AW_ROOT/scripts/delta-clean-root.ts" \
              "$TARGET_REPOSITORY" "$CENTRAL_CI_HEAD_SHA" "$GITHUB_WORKSPACE/target"
            exit 0
          fi
          # The immutable first-import base contains an empty-repository placeholder CI.
          # Invoke the centrally trusted real build after the existing scan and
          # engineering ownership gates. Only these exact public imports may use it.
          if [[ "$TARGET_REPOSITORY" == "fongap-labs/delta" &&
                ( "$CENTRAL_CI_BASE_SHA" == "7556dc8dfede03053e35359f2b55dd299da1f3ee" ||
                  "$CENTRAL_CI_BASE_SHA" == "3effeb139e9af5198bfa5d380b1d3457caea4fcb" ) &&
                "$TARGET_PRIVATE" == "false" ]]; then
            if [[ "$CENTRAL_CI_SHARD" != "all" ]]; then
              echo "::error::The pinned Delta first import does not declare CI shards." >&2
              exit 65
            fi
            bash "$CENTRAL_CI_AW_ROOT/tests/packs/delta/desktop-build-ci.sh" "$GITHUB_WORKSPACE/target"
            exit 0
          fi
          script="$GITHUB_WORKSPACE/ci-control/.github/scripts/central-ci.sh"
          if [ ! -f "$script" ]; then
            # The fixed trusted manifest may execute the project's declared Node.js
            # verification in the already isolated sandbox, without central credentials.
            # Legacy empty-repository bridge bootstrap still gets strict source checks.
            node "$CENTRAL_CI_AW_ROOT/scripts/execute-linux-ci.ts" \
              "$GITHUB_WORKSPACE/target" "$GITHUB_WORKSPACE/ci-control" \
              "$CENTRAL_CI_BASE_SHA" "$CENTRAL_CI_HEAD_SHA" "$CENTRAL_CI_SHARD"
            exit 0
          fi

          # Only a manifest-declared shard is passed on; an unsharded project keeps its exact invocation.
          script_args=("$GITHUB_WORKSPACE/target")
          if [ "$CENTRAL_CI_SHARD" != "all" ]; then
            script_args+=("$CENTRAL_CI_SHARD")
          fi

          log="$RUNNER_TEMP/central-ci-linux.log"
          failure_meta="$RUNNER_TEMP/central-ci-linux.failure"
          wrapper="$RUNNER_TEMP/central-ci-wrapper.sh"
          cat >"$wrapper" <<'EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          record_failure() {
            local code=$?
            if [ "$code" -ne 0 ] && [ -n "${CENTRAL_CI_FAILURE_FILE:-}" ] && [ ! -s "$CENTRAL_CI_FAILURE_FILE" ]; then
              printf "%s:%s\n" "${BASH_LINENO[0]:-$LINENO}" "$code" > "$CENTRAL_CI_FAILURE_FILE"
            fi
          }
          trap record_failure ERR
          trap record_failure EXIT
          script="$1"
          shift
          source "$script" "$@"
          EOF
          chmod 700 "$wrapper"

          set +e
          CENTRAL_CI_FAILURE_FILE="$failure_meta" \
            bash "$wrapper" "$script" "${script_args[@]}" >"$log" 2>&1
          code=$?
          set -e

          if [ "$code" -ne 0 ]; then
            if [ "$TARGET_PRIVATE" = "false" ]; then
              cat "$log"
            else
              diagnostic=""
              if [ -f "$failure_meta" ]; then
                IFS=: read -r failure_line failure_code <"$failure_meta" || true
                if [[ "$failure_line" =~ ^[0-9]+$ ]] && [[ "$failure_code" =~ ^[0-9]+$ ]]; then
                  diagnostic=" Trusted CI failed at line $failure_line with exit code $failure_code."
                fi
              fi
              echo "::error::Central Linux CI failed for $TARGET_REPOSITORY.$diagnostic Detailed output is suppressed because the target repository is private."
            fi
            exit "$code"
          fi

          # Public repositories keep the project script's phase markers so per-phase time stays visible.
          if [ "$TARGET_PRIVATE" = "false" ]; then
            grep '^central-ci:' "$log" || true
          fi

          echo "Central Linux CI passed for $TARGET_REPOSITORY (shard: $CENTRAL_CI_SHARD)."

      # Opt-in is declared by a trusted Action Worker test pack, never the target PR.
      # During migration this adds central coverage without deleting legacy tests.
      - name: Run trusted overlay test pack
        env:
          CENTRAL_CI_AW_ROOT: ${{ github.workspace }}/aw
          TARGET_REPOSITORY: ${{ inputs.repository }}
          TARGET_PRIVATE: ${{ inputs.is_private }}
        shell: bash
        run: |
          set -Eeuo pipefail
          pack_name="${TARGET_REPOSITORY##*/}"
          if [[ ! "$pack_name" =~ ^[a-z][a-z0-9-]*$ ]]; then
            exit 0
          fi
          manifest="$CENTRAL_CI_AW_ROOT/tests/packs/$pack_name/pack.json"
          if [ ! -f "$manifest" ]; then
            exit 0
          fi
          if ! jq -e '.overlay == true' "$manifest" >/dev/null; then
            exit 0
          fi
          log="$RUNNER_TEMP/central-test-pack.log"
          set +e
          node "$CENTRAL_CI_AW_ROOT/tests/run-pack.mjs" "$pack_name" "$GITHUB_WORKSPACE/target" all >"$log" 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            if [ "$TARGET_PRIVATE" = "false" ]; then
              cat "$log"
            else
              echo "::error::Central test pack failed. Private test output is suppressed."
            fi
            exit "$code"
          fi
          baseline_file="$(jq -r '.inventory // empty' "$manifest")"
          if [ -n "$baseline_file" ]; then
            node "$CENTRAL_CI_AW_ROOT/tests/kit/verify-tap-inventory.mjs" \
              "$CENTRAL_CI_AW_ROOT/tests/inventory/$baseline_file" "$log"
          fi
          echo "Trusted overlay pack passed."

  windows:
    name: Windows
    if: inputs.platform == 'windows'
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      windows_diagnostic: ${{ steps.private_diag.outputs.windows_diagnostic }}

    steps:
      - name: Mask target repository and commit identities
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $eventData = Get-Content -Raw -Path $env:GITHUB_EVENT_PATH | ConvertFrom-Json
          $client = $eventData.client_payload
          if ($null -eq $client) { exit 0 }
          foreach ($identity in @($client.repository, $client.head_sha, $client.base_sha, $client.merge_sha)) {
            if ($identity -is [string] -and $identity.Length -gt 0) {
              Write-Output "::add-mask::$identity"
            }
          }

      # A pull request is tested as it would merge into the default branch; see the Linux job.
      - name: Mint scoped private target read token
        id: private_read
        if: inputs.is_private == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: ${{ inputs.owner }}
          repositories: ${{ inputs.repository_name }}
          permission-contents: read

      - name: Require scoped private target read token
        if: inputs.is_private == 'true'
        shell: pwsh
        env:
          CHECKOUT_TOKEN: ${{ steps.private_read.outputs.token }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CHECKOUT_TOKEN)) {
            Write-Error "Unable to mint a Contents: Read App token for the private target. Verify the App installation includes the repository."
            exit 77
          }

      - name: Checkout private target PR
        if: inputs.is_private == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.pr_number != '0' && inputs.merge_sha || inputs.head_sha }}
          token: ${{ steps.private_read.outputs.token }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout public target PR
        if: inputs.is_private != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.pr_number != '0' && inputs.merge_sha || inputs.head_sha }}
          token: ${{ github.token }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout private trusted CI control
        if: inputs.is_private == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.control_ref }}
          token: ${{ steps.private_read.outputs.token }}
          path: ci-control
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout public trusted CI control
        if: inputs.is_private != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.control_ref }}
          token: ${{ github.token }}
          path: ci-control
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.repository == 'fongap-labs/delta' && '26.13.1' || '22' }}

      - name: Setup Python for Delta Windows privacy scan
        if: inputs.repository == 'fongap-labs/delta'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pinned pnpm for Delta Windows suite
        if: inputs.repository == 'fongap-labs/delta'
        shell: pwsh
        run: npm.cmd install --global --no-audit --no-fund --ignore-scripts pnpm@11.28.5

      - name: Checkout central test pack
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          path: aw

      - name: Verify pinned CI checkout
        shell: pwsh
        env:
          PINNED_PR_NUMBER: ${{ inputs.pr_number }}
          PINNED_BASE_SHA: ${{ inputs.base_sha }}
          PINNED_HEAD_SHA: ${{ inputs.head_sha }}
          PINNED_MERGE_SHA: ${{ inputs.merge_sha }}
        run: node aw/scripts/verify-ci-checkout.ts "$env:GITHUB_WORKSPACE/target" "$env:PINNED_PR_NUMBER" "$env:PINNED_BASE_SHA" "$env:PINNED_HEAD_SHA" "$env:PINNED_MERGE_SHA"

      - name: Pin central test pack
        shell: pwsh
        run: node aw/scripts/prepare-test-pack.ts "${{ github.workspace }}/aw" "${{ github.workspace }}/ci-control/.github/test-pack.json"

      # Only restore the package store. repository_dispatch runs on control main,
      # so target PR code must NEVER write a shared main-scoped cache.
      # No node_modules, build outputs, credentials or CI evidence is cached.
      - name: Restore Delta Windows pnpm store
        id: delta_pnpm_cache
        if: inputs.repository == 'fongap-labs/delta' && inputs.is_private == 'false'
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/delta-pnpm-store
          key: delta-win-x64-node26.13.1-pnpm11.28.5-${{ hashFiles('target/pnpm-lock.yaml', 'target/pnpm-workspace.yaml') }}

      # On a lockfile change, reuse only the exact control baseline store when available.
      # All entries still undergo the target's frozen install; never save from a PR.
      - name: Restore Delta Windows baseline pnpm store
        id: delta_pnpm_baseline_cache
        if: inputs.repository == 'fongap-labs/delta' && inputs.is_private == 'false' && steps.delta_pnpm_cache.outputs.cache-hit != 'true' && hashFiles('ci-control/pnpm-lock.yaml', 'ci-control/pnpm-workspace.yaml') != '' && hashFiles('target/pnpm-lock.yaml', 'target/pnpm-workspace.yaml') != hashFiles('ci-control/pnpm-lock.yaml', 'ci-control/pnpm-workspace.yaml')
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/delta-pnpm-store
          key: delta-win-x64-node26.13.1-pnpm11.28.5-${{ hashFiles('ci-control/pnpm-lock.yaml', 'ci-control/pnpm-workspace.yaml') }}

      - name: Run trusted Windows CI
        env:
          CENTRAL_CI_AW_ROOT: ${{ github.workspace }}/aw
          CENTRAL_CI_BASE_SHA: ${{ inputs.base_sha }}
          CENTRAL_CI_HEAD_SHA: ${{ inputs.head_sha }}
          CENTRAL_CI_PR_NUMBER: ${{ inputs.pr_number }}
          TARGET_REPOSITORY: ${{ inputs.repository }}
          TARGET_PRIVATE: ${{ inputs.is_private }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Central routes are from the reviewed Action Worker checkout.
          # The target PR cannot inject a Windows CI entrypoint.
          $awRoot = Join-Path $env:GITHUB_WORKSPACE 'aw'
          $policy = Get-Content -Raw -LiteralPath (Join-Path $awRoot 'policies/ci-windows-routes.json') | ConvertFrom-Json
          $matches = @($policy.routes | Where-Object { $_.repository -eq $env:TARGET_REPOSITORY })
          if ($matches.Count -gt 1) { throw "Duplicate central Windows route." }
          if ($matches.Count -eq 1) {
            $relative = [string]$matches[0].script
            if ($relative -cnotmatch '^tests/packs/[a-z0-9-]+/[a-z0-9-]+\.ps1$') {
              throw "Unsafe central Windows suite path."
            }
            $script = Join-Path $awRoot $relative
          }
          else {
            $script = "$env:GITHUB_WORKSPACE\ci-control\.github\scripts\central-ci.ps1"
          }
          if (-not (Test-Path -LiteralPath $script -PathType Leaf)) {
            throw "Missing trusted central CI script."
          }

          $log = Join-Path $env:RUNNER_TEMP "central-ci-windows.log"
          $isPublicDelta = $env:TARGET_PRIVATE -eq "false" -and
            $matches.Count -eq 1 -and $relative -eq 'tests/packs/delta/windows-desktop-ci.ps1'
          $liveStages = @(
            'toolchain-preflight', 'product-policy', 'release-build', 'package-closure-regression',
            'release-acceptance', 'release-privacy', 'release-archive-extraction',
            'portable-output-layout', 'portable-checksum-verification',
            'portable-relocation', 'relocated-executable-startup'
          )
          try {
            if ($isPublicDelta) {
              # Stream fixed phase names and bounded numbers only; retain the full local log.
              # Progress is informational and never replaces the process exit verdict.
              & $script -TargetRoot "$env:GITHUB_WORKSPACE\target" *>&1 |
                Tee-Object -FilePath $log |
                ForEach-Object {
                  $line = [string]$_
                  if ($line -cmatch '^Delta Windows CI (?:start stage=([a-z-]+)|heartbeat stage=([a-z-]+) elapsed_s=[0-9]{1,5}|timing stage=([a-z-]+) duration_ms=[0-9]{1,12})
              throw "Central Windows CI returned exit code $LASTEXITCODE."
            }
          }
          catch {
