name: 自动 · npm 发包

run-name: npm-release-${{ github.event.client_payload.correlation_id }}

on:
  repository_dispatch:
    types: [run-npm-release]

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.event.client_payload.target_repository }}-${{ github.event.client_payload.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verified stable npm publication
    if: >-
      github.event.sender.login == 'fongap-bot[bot]' &&
      github.event.client_payload.source_repository == 'fongap-labs/dsh-plugin' &&
      github.event.client_payload.target_repository == 'fongap-labs/dsh-plugin'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Mint read-only dsh-plugin token
        id: npm_read_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: dsh-plugin
          permission-contents: read

      - name: Publish and verify npm package from governed Draft Release
        env:
          AW_CONTROL_TOKEN: ${{ steps.npm_read_app.outputs.token }}
          AW_NPM_TOKEN: ${{ secrets.AW_NPM_TOKEN }}
          RELEASE_REQUEST_JSON: ${{ toJSON(github.event.client_payload) }}
        run: node scripts/release-npm-dispatch.ts consume
