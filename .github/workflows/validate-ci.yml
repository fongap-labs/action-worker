name: Validate CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  naming:
    name: Naming rules
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Resolve change range
        id: range
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            base="$PUSH_BEFORE_SHA"
            head="$GITHUB_SHA"

            if [[ "$base" == "0000000000000000000000000000000000000000" ]]; then
              base="$(git rev-list --max-parents=0 "$head" | tail -1)"
            fi
          else
            head="$GITHUB_SHA"
            base="$(git rev-parse "$head^" 2>/dev/null || git rev-list --max-parents=0 "$head" | tail -1)"
          fi

          {
            echo "base=$base"
            echo "head=$head"
          } >> "$GITHUB_OUTPUT"

      - name: Validate naming rules
        env:
          BASE_SHA: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
        run: node scripts/validate-naming-rules.ts "$BASE_SHA" "$HEAD_SHA"

  security:
    name: Security checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Resolve security range
        id: range
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            base="$PUSH_BEFORE_SHA"
            head="$GITHUB_SHA"
            if [[ "$base" == "0000000000000000000000000000000000000000" ]]; then
              base="$(git rev-list --max-parents=0 "$head" | tail -1)"
            fi
          else
            head="$GITHUB_SHA"
            base="$(git rev-parse "$head^" 2>/dev/null || git rev-list --max-parents=0 "$head" | tail -1)"
          fi

          {
            echo "base=$base"
            echo "head=$head"
          } >> "$GITHUB_OUTPUT"

      - name: Validate security gate
        env:
          BASE_SHA: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
        run: node scripts/validate-security.ts "$BASE_SHA" "$HEAD_SHA" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/policies/security.json"

  static:
    name: Static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install TypeScript toolchain
        run: npm ci

      - name: Type-check TypeScript
        run: npm run typecheck

      - name: Lint with Biome
        run: npm run lint

      - name: Install actionlint
        id: actionlint
        shell: bash
        env:
          # Pinned release and checksum (bump both together; Dependabot cannot update them).
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -Eeuo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/${archive}" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          echo "executable=$RUNNER_TEMP/actionlint" >> "$GITHUB_OUTPUT"

      - name: Lint GitHub Actions
        env:
          ACTIONLINT_EXECUTABLE: ${{ steps.actionlint.outputs.executable }}
        run: "$ACTIONLINT_EXECUTABLE -color"

  contracts:
    name: Contract tests
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript unit tests
        run: npm test

      - name: Validate source naming
        run: python3 tests/test-source-naming.py

  validate-merge:
    name: validate-merge
    needs:
      - naming
      - security
      - static
      - contracts
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Aggregate merge gate
        env:
          NAMING_RESULT: ${{ needs.naming.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          CONTRACT_RESULT: ${{ needs.contracts.result }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ "$NAMING_RESULT" != "success" ] || [ "$SECURITY_RESULT" != "success" ] || [ "$STATIC_RESULT" != "success" ] || [ "$CONTRACT_RESULT" != "success" ]; then
            echo "::error::CI failed: naming=$NAMING_RESULT security=$SECURITY_RESULT static=$STATIC_RESULT contracts=$CONTRACT_RESULT" >&2
            exit 1
          fi

          echo "CI merge gate passed."
