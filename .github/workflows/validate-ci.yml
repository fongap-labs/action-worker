name: 自动 · CI 验证

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer pull request head makes the older run stale, so it is cancelled. A newer push to main
# must not cancel the validation of an earlier main commit, which would leave that commit without
# a verdict.
concurrency:
  group: validate-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  naming:
    name: Naming rules
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Resolve change range
        id: range
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: bash scripts/ci-change-range.sh

      - name: Validate naming rules
        env:
          BASE_SHA: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
        run: node scripts/validate-naming-rules.ts "$BASE_SHA" "$HEAD_SHA"

  security:
    name: Security checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Resolve security range
        id: range
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: bash scripts/ci-change-range.sh

      - name: Validate security gate
        env:
          BASE_SHA: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
        run: node scripts/validate-security.ts "$BASE_SHA" "$HEAD_SHA" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/policies/security.json"

  static:
    name: Static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install TypeScript toolchain
        run: npm ci

      - name: Type-check TypeScript
        run: npm run typecheck

      - name: Lint with Biome
        run: npm run lint

      # Compile the optional Worker with its real Cloudflare bundler, without
      # requiring an account, granting credentials, or activating a route/Cron.
      - name: Dry-run direct ingress Worker bundle
        env:
          AW_INGRESS_DATABASE_NAME: aw-ingress-ci
          AW_INGRESS_DATABASE_ID: 12345678-1234-4123-8123-123456789abc
          AW_GITHUB_APP_ID: "42"
          AW_GITHUB_APP_INSTALLATION_ID: "101"
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run ingress:staging-config
          npx --yes wrangler@4.158.0 deploy --dry-run \
            --config .direct-ingress-staging.wrangler.json \
            --outdir "$RUNNER_TEMP/aw-ingress-bundle"
          test -n "$(find "$RUNNER_TEMP/aw-ingress-bundle" -type f -name '*.js' -print -quit)"

      - name: Install actionlint
        id: actionlint
        shell: bash
        env:
          # Pinned release and checksum (bump both together; Dependabot cannot update them).
          ACTIONLINT_VERSION: "1.17.0"
          ACTIONLINT_SHA256: 620abd485a12b6ab1125b844a876414e1d5bd2af8a3125b27f82b01d0d9d6e5a
        run: |
          set -Eeuo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          # Both locations address the same SHA-pinned official GitHub release.
          # Failure of both sources or checksum mismatch still blocks the gate.
          if ! curl --fail --location --silent --show-error --retry 3 --retry-all-errors --connect-timeout 15 --max-time 180 --proto '=https' --proto-redir '=https' \
            -o "$RUNNER_TEMP/$archive" "https://github.com/kjanat/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"; then
            curl --fail --location --silent --show-error --retry 3 --retry-all-errors --connect-timeout 15 --max-time 180 --proto '=https' --proto-redir '=https' \
              --header 'Accept: application/octet-stream' --header 'X-GitHub-Api-Version: 2022-11-28' \
              -o "$RUNNER_TEMP/$archive" "https://api.github.com/repos/kjanat/actionlint/releases/assets/561506357"
          fi
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/${archive}" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          echo "executable=$RUNNER_TEMP/actionlint" >> "$GITHUB_OUTPUT"

      - name: Lint GitHub Actions
        env:
          ACTIONLINT_EXECUTABLE: ${{ steps.actionlint.outputs.executable }}
        run: "$ACTIONLINT_EXECUTABLE -color"

  contracts:
    name: Contract tests
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript unit tests
        run: npm test

      - name: Validate source naming
        run: python3 tests/test-source-naming.py

  private-sandbox-integration:
    name: Real private sandbox integration
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout pinned test harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build the disposable non-secret Docker test image
        id: image
        shell: bash
        run: |
          set -Eeuo pipefail
          image_id="$(docker build --quiet -f tests/fixtures/private-sandbox/Dockerfile tests/fixtures/private-sandbox)"
          [[ "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "id=$image_id" >> "$GITHUB_OUTPUT"
      - name: Run real isolated Docker and cryptographic state transfer regressions
        env:
          AW_SANDBOX_TEST_IMAGE_ID: ${{ steps.image.outputs.id }}
        run: node --test tests/integration/private-sandbox-e2e.test.ts tests/integration/private-publication-e2e.test.ts

  downstream-compatibility:
    name: Public downstream compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout candidate with baseline history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install deterministic contract tools
        run: npm ci

      - name: Compare affected public downstream declarations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          if [[ ! "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            echo "No usable baseline; skip compatibility delta for initial push."
            exit 0
          fi
          if ! git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Eq '^(policies/runner\.json|scripts/(validate-release-build-request|runner-policy|deploy-manifest|downstream-compatibility)\.ts|contracts/(release-manifest|deploy-manifest)\.json)$'; then
            echo "No central contract changes; external API scan skipped."
            exit 0
          fi
          node scripts/downstream-compatibility.ts "$BASE_SHA"

  validate-merge:
    name: validate-merge
    needs:
      - naming
      - security
      - static
      - contracts
      - private-sandbox-integration
      - downstream-compatibility
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Aggregate merge gate
        env:
          NAMING_RESULT: ${{ needs.naming.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          CONTRACT_RESULT: ${{ needs.contracts.result }}
          PRIVATE_SANDBOX_RESULT: ${{ needs.private-sandbox-integration.result }}
          DOWNSTREAM_RESULT: ${{ needs.downstream-compatibility.result }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ "$NAMING_RESULT" != "success" ] || [ "$SECURITY_RESULT" != "success" ] || [ "$STATIC_RESULT" != "success" ] || [ "$CONTRACT_RESULT" != "success" ] || [ "$PRIVATE_SANDBOX_RESULT" != "success" ] || [ "$DOWNSTREAM_RESULT" != "success" ]; then
            echo "::error::CI failed: naming=$NAMING_RESULT security=$SECURITY_RESULT static=$STATIC_RESULT contracts=$CONTRACT_RESULT private-sandbox=$PRIVATE_SANDBOX_RESULT downstream=$DOWNSTREAM_RESULT" >&2
            exit 1
          fi

          echo "CI merge gate passed."

      - name: Checkout diagnostic code
        if: failure()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node for diagnostics
        if: failure()
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Classify failed steps
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/diagnose-ci-failure.ts

  # Control-repository PRs are validated by this workflow rather than the
  # cross-repository PR Governance dispatcher. Do not leave them requiring
  # manual merges when every CI gate has passed.
  automatic-squash-merge:
    name: Automatic squash merge after CI
    needs: [validate-merge]
    if: ${{ github.event_name == 'pull_request' && needs.validate-merge.result == 'success' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout trusted main controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Mint narrowly scoped merge token
        id: merge_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Merge the exact validated PR head
        env:
          GH_TOKEN: ${{ steps.merge_app.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          details="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          jq -e --arg head "$HEAD_SHA" --arg base "$BASE_SHA" '
            .state == "open" and .merged == false and .draft == false and
            .head.sha == $head and .base.sha == $base and
            .base.ref == "main" and .head.repo.full_name == .base.repo.full_name
          ' <<< "$details" >/dev/null || {
            echo "::error::PR base, head, or draft state changed since successful CI." >&2
            exit 75
          }
          gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --squash --match-head-commit "$HEAD_SHA"
          gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.merged' | grep -qx true
