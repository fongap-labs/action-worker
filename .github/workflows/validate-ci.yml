name: 自动 · CI 验证

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer pull request head makes the older run stale, so it is cancelled. A newer push to main
# must not cancel the validation of an earlier main commit, which would leave that commit without
# a verdict.
concurrency:
  group: validate-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  naming:
    name: Naming rules
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Resolve change range
        id: range
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            base="$PUSH_BEFORE_SHA"
            head="$GITHUB_SHA"

            if [[ "$base" == "0000000000000000000000000000000000000000" ]]; then
              base="$(git rev-list --max-parents=0 "$head" | tail -1)"
            fi
          else
            head="$GITHUB_SHA"
            base="$(git rev-parse "$head^" 2>/dev/null || git rev-list --max-parents=0 "$head" | tail -1)"
          fi

          {
            echo "base=$base"
            echo "head=$head"
          } >> "$GITHUB_OUTPUT"

      - name: Validate naming rules
        env:
          BASE_SHA: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
        run: node scripts/validate-naming-rules.ts "$BASE_SHA" "$HEAD_SHA"

  security:
    name: Security checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Resolve security range
        id: range
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            base="$PUSH_BEFORE_SHA"
            head="$GITHUB_SHA"
            if [[ "$base" == "0000000000000000000000000000000000000000" ]]; then
              base="$(git rev-list --max-parents=0 "$head" | tail -1)"
            fi
          else
            head="$GITHUB_SHA"
            base="$(git rev-parse "$head^" 2>/dev/null || git rev-list --max-parents=0 "$head" | tail -1)"
          fi

          {
            echo "base=$base"
            echo "head=$head"
          } >> "$GITHUB_OUTPUT"

      - name: Validate security gate
        env:
          BASE_SHA: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
        run: node scripts/validate-security.ts "$BASE_SHA" "$HEAD_SHA" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/policies/security.json"

  static:
    name: Static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install TypeScript toolchain
        run: npm ci

      - name: Type-check TypeScript
        run: npm run typecheck

      - name: Lint with Biome
        run: npm run lint

      - name: Install actionlint
        id: actionlint
        shell: bash
        env:
          # Pinned release and checksum (bump both together; Dependabot cannot update them).
          ACTIONLINT_VERSION: "1.17.0"
          ACTIONLINT_SHA256: 620abd485a12b6ab1125b844a876414e1d5bd2af8a3125b27f82b01d0d9d6e5a
        run: |
          set -Eeuo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/kjanat/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/${archive}" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          echo "executable=$RUNNER_TEMP/actionlint" >> "$GITHUB_OUTPUT"

      - name: Lint GitHub Actions
        env:
          ACTIONLINT_EXECUTABLE: ${{ steps.actionlint.outputs.executable }}
        run: "$ACTIONLINT_EXECUTABLE -color"

  contracts:
    name: Contract tests
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript unit tests
        run: npm test

      - name: Validate source naming
        run: python3 tests/test-source-naming.py

  private-sandbox-integration:
    name: Real private sandbox integration
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout pinned test harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build the disposable non-secret Docker test image
        id: image
        shell: bash
        run: |
          set -Eeuo pipefail
          image_id="$(docker build --quiet -f tests/fixtures/private-sandbox/Dockerfile tests/fixtures/private-sandbox)"
          [[ "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "id=$image_id" >> "$GITHUB_OUTPUT"
      - name: Run real isolated Docker and cryptographic state transfer regressions
        env:
          AW_SANDBOX_TEST_IMAGE_ID: ${{ steps.image.outputs.id }}
        run: node --test tests/integration/private-sandbox-e2e.test.ts tests/integration/private-publication-e2e.test.ts

  downstream-compatibility:
    name: Public downstream compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout candidate with baseline history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install deterministic contract tools
        run: npm ci

      - name: Compare affected public downstream declarations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          if [[ ! "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            echo "No usable baseline; skip compatibility delta for initial push."
            exit 0
          fi
          if ! git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Eq '^(policies/runner\.json|scripts/(validate-release-build-request|runner-policy|deploy-manifest)\.ts|contracts/(release-manifest|deploy-manifest)\.json)$'; then
            echo "No central contract changes; external API scan skipped."
            exit 0
          fi
          node scripts/downstream-compatibility.ts "$BASE_SHA"

  validate-merge:
    name: validate-merge
    needs:
      - naming
      - security
      - static
      - contracts
      - private-sandbox-integration
      - downstream-compatibility
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Aggregate merge gate
        env:
          NAMING_RESULT: ${{ needs.naming.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          CONTRACT_RESULT: ${{ needs.contracts.result }}
          PRIVATE_SANDBOX_RESULT: ${{ needs.private-sandbox-integration.result }}
          DOWNSTREAM_RESULT: ${{ needs.downstream-compatibility.result }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ "$NAMING_RESULT" != "success" ] || [ "$SECURITY_RESULT" != "success" ] || [ "$STATIC_RESULT" != "success" ] || [ "$CONTRACT_RESULT" != "success" ] || [ "$PRIVATE_SANDBOX_RESULT" != "success" ] || [ "$DOWNSTREAM_RESULT" != "success" ]; then
            echo "::error::CI failed: naming=$NAMING_RESULT security=$SECURITY_RESULT static=$STATIC_RESULT contracts=$CONTRACT_RESULT private-sandbox=$PRIVATE_SANDBOX_RESULT downstream=$DOWNSTREAM_RESULT" >&2
            exit 1
          fi

          echo "CI merge gate passed."

      - name: Checkout diagnostic code
        if: failure()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node for diagnostics
        if: failure()
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Classify failed steps
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/diagnose-ci-failure.ts
