name: 自动 · 总控调度

# Finds the work that the managed repositories need and dispatches it. Every job is idempotent: it
# acts only on what has no verdict yet, so running often is safe and cheap. GitHub starts the
# schedule of this repository is a best-effort fallback, so push and run-intake events
# (sent by the repository bridges and by Action Worker itself) are the heartbeat, and the schedule
# is the fallback. Nobody starts this workflow by hand.
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [run-intake]
  schedule:
    - cron: "*/15 * * * *"
    - cron: "17 3 * * 1"

permissions: {}

concurrency:
  group: intake
  cancel-in-progress: false

jobs:
  pull-requests:
    # Control-repository pushes do not change business PR heads.
    if: github.event_name != 'push'
    name: Pull requests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Resolve PR repository scope
        id: pr_scope
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          AW_INTAKE_TARGET_REPOSITORY: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.repository || '' }}
        run: node scripts/repository-policy.ts list pr

      - name: Mint PR status write token
        if: steps.pr_scope.outputs.scan != 'false'
        id: status_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.pr_scope.outputs.repositories_csv }}
          permission-statuses: write

      - name: Mint control dispatch token
        if: steps.pr_scope.outputs.scan != 'false'
        id: dispatch_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Mint scoped intake read token
        if: steps.pr_scope.outputs.scan != 'false'
        id: control_read_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.pr_scope.outputs.read_repositories_csv }}
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read
          permission-statuses: read
          permission-issues: read

      - name: Reconcile open pull requests
        if: steps.pr_scope.outputs.scan != 'false'
        env:
          AW_CONTROL_TOKEN: ${{ steps.control_read_app.outputs.token }}
          AW_GITHUB_API_METRICS: "1"
          AW_STATUS_API_TOKEN: ${{ steps.status_app.outputs.token }}
          AW_STATUS_KEYRING: ${{ secrets.AW_STATUS_KEYRING }}
          AW_DISPATCH_API_TOKEN: ${{ steps.dispatch_app.outputs.token }}
          AW_CONTROL_REPOSITORY: ${{ github.repository }}
          AW_INTAKE_TARGET_REPOSITORY: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.repository || '' }}
        run: node scripts/intake-open-prs.ts

  main-ci:
    name: Main CI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Resolve PR repository scope
        id: pr_scope
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          AW_INTAKE_TARGET_REPOSITORY: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.repository || '' }}
        run: node scripts/repository-policy.ts list pr

      - name: Mint PR status write token
        if: steps.pr_scope.outputs.scan != 'false'
        id: status_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.pr_scope.outputs.repositories_csv }}
          permission-statuses: write

      - name: Mint control dispatch token
        if: steps.pr_scope.outputs.scan != 'false'
        id: dispatch_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Mint scoped intake read token
        if: steps.pr_scope.outputs.scan != 'false'
        id: control_read_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.pr_scope.outputs.read_repositories_csv }}
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read
          permission-statuses: read
          permission-issues: read

      - name: Reconcile main CI
        if: steps.pr_scope.outputs.scan != 'false'
        env:
          AW_CONTROL_TOKEN: ${{ steps.control_read_app.outputs.token }}
          AW_GITHUB_API_METRICS: "1"
          AW_STATUS_API_TOKEN: ${{ steps.status_app.outputs.token }}
          AW_STATUS_KEYRING: ${{ secrets.AW_STATUS_KEYRING }}
          AW_DISPATCH_API_TOKEN: ${{ steps.dispatch_app.outputs.token }}
          AW_CONTROL_REPOSITORY: ${{ github.repository }}
          AW_INTAKE_TARGET_REPOSITORY: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.repository || '' }}
        run: node scripts/intake-main-ci.ts

  main-writes:
    name: Main write audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Resolve PR repository scope
        id: pr_scope
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/repository-policy.ts list pr

      - name: Mint main write status token
        id: status_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.pr_scope.outputs.repositories_csv }}
          permission-statuses: write

      - name: Mint incident issue token
        id: issue_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.pr_scope.outputs.repositories_csv }}
          permission-issues: write

      - name: Mint scoped intake read token
        id: control_read_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.pr_scope.outputs.read_repositories_csv }}
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read
          permission-statuses: read
          permission-issues: read

      - name: Audit managed main branches
        env:
          AW_CONTROL_TOKEN: ${{ steps.control_read_app.outputs.token }}
          AW_GITHUB_API_METRICS: "1"
          AW_STATUS_API_TOKEN: ${{ steps.status_app.outputs.token }}
          AW_STATUS_KEYRING: ${{ secrets.AW_STATUS_KEYRING }}
          AW_ISSUE_API_TOKEN: ${{ steps.issue_app.outputs.token }}
          MAIN_WRITE_AUDIT_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/audit-main-writes.ts

      - name: Audit managed dev branches
        if: ${{ always() && steps.control_read_app.outputs.token != '' && steps.status_app.outputs.token != '' && steps.issue_app.outputs.token != '' }}
        env:
          AW_CONTROL_TOKEN: ${{ steps.control_read_app.outputs.token }}
          AW_STATUS_API_TOKEN: ${{ steps.status_app.outputs.token }}
          AW_STATUS_KEYRING: ${{ secrets.AW_STATUS_KEYRING }}
          AW_ISSUE_API_TOKEN: ${{ steps.issue_app.outputs.token }}
          DEV_WRITE_AUDIT_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/audit-dev-writes.ts

      - name: Observe managed branch differences
        if: ${{ always() && !cancelled() && github.event_name == 'schedule' && steps.control_read_app.outputs.token != '' }}
        env:
          AW_CONTROL_TOKEN: ${{ steps.control_read_app.outputs.token }}
        run: node scripts/audit-branch-drift.ts

  task-sources:
    # Task-source changes arrive through repository_dispatch or periodic reconciliation.
    if: github.event_name != 'push'
    name: Changed task projects
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Resolve task repository scope
        id: task_scope
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          AW_INTAKE_TARGET_REPOSITORY: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.repository || '' }}
        run: node scripts/repository-policy.ts list task

      - name: Mint task status read token
        if: steps.task_scope.outputs.scan != 'false'
        id: status_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.task_scope.outputs.repositories_csv }}
          permission-statuses: read

      - name: Mint control dispatch token
        if: steps.task_scope.outputs.scan != 'false'
        id: dispatch_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Mint scoped intake read token
        if: steps.task_scope.outputs.scan != 'false'
        id: control_read_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.task_scope.outputs.read_repositories_csv }}
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read
          permission-statuses: read
          permission-issues: read

      # This is an advisory reserve for deferrable scans, not a security or merge gate.
      # A failed quota query fails this job; only a valid low-budget verdict may defer work.
      - name: Check optional scan API budget
        if: steps.task_scope.outputs.scan != 'false'
        id: api_budget
        env:
          AW_CONTROL_TOKEN: ${{ steps.control_read_app.outputs.token }}
          AW_GITHUB_API_METRICS: "1"
          AW_API_QUOTA_RESERVE: "300"
        run: node scripts/check-github-api-budget.ts

      - name: Reconcile task sources
        if: steps.task_scope.outputs.scan != 'false' && steps.api_budget.outputs.run == 'true'
        env:
          AW_CONTROL_TOKEN: ${{ steps.control_read_app.outputs.token }}
          AW_GITHUB_API_METRICS: "1"
          AW_STATUS_API_TOKEN: ${{ steps.status_app.outputs.token }}
          AW_STATUS_KEYRING: ${{ secrets.AW_STATUS_KEYRING }}
          AW_DISPATCH_API_TOKEN: ${{ steps.dispatch_app.outputs.token }}
          AW_CONTROL_REPOSITORY: ${{ github.repository }}
          AW_INTAKE_TARGET_REPOSITORY: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.repository || '' }}
        run: node scripts/intake-task-sources.ts

  task-schedules:
    if: github.event_name != 'push'
    name: Scheduled task projects
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Resolve task repository scope
        id: task_scope
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          AW_INTAKE_TARGET_REPOSITORY: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.repository || '' }}
        run: node scripts/repository-policy.ts list task

      - name: Mint task status write token
        if: steps.task_scope.outputs.scan != 'false'
        id: status_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.task_scope.outputs.repositories_csv }}
          permission-statuses: write

      - name: Mint control dispatch token
        if: steps.task_scope.outputs.scan != 'false'
        id: dispatch_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      # A slot up to 12 hours late runs once: only the latest due slot of each project is dispatched,
      # and dispatches are deduplicated per slot.
      - name: Mint scoped intake read token
        if: steps.task_scope.outputs.scan != 'false'
        id: control_read_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.task_scope.outputs.read_repositories_csv }}
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read
          permission-statuses: read
          permission-issues: read

      # This is an advisory reserve for deferrable scans, not a security or merge gate.
      # A failed quota query fails this job; only a valid low-budget verdict may defer work.
      - name: Check optional scan API budget
        if: steps.task_scope.outputs.scan != 'false'
        id: api_budget
        env:
          AW_CONTROL_TOKEN: ${{ steps.control_read_app.outputs.token }}
          AW_GITHUB_API_METRICS: "1"
          AW_API_QUOTA_RESERVE: "300"
        run: node scripts/check-github-api-budget.ts

      - name: Dispatch due scheduled tasks
        if: steps.task_scope.outputs.scan != 'false' && steps.api_budget.outputs.run == 'true'
        env:
          AW_CONTROL_TOKEN: ${{ steps.control_read_app.outputs.token }}
          AW_GITHUB_API_METRICS: "1"
          AW_STATUS_API_TOKEN: ${{ steps.status_app.outputs.token }}
          AW_STATUS_KEYRING: ${{ secrets.AW_STATUS_KEYRING }}
          AW_DISPATCH_API_TOKEN: ${{ steps.dispatch_app.outputs.token }}
          AW_CONTROL_REPOSITORY: ${{ github.repository }}
          AW_INTAKE_TARGET_REPOSITORY: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.repository || '' }}
          TASK_SOURCE_LOOKBACK_MINUTES: "720"
        run: node scripts/dispatch-scheduled-tasks.ts

  deploy-schedules:
    if: github.event_name != 'push'
    name: Scheduled deploys
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Resolve deploy repository scope
        id: deploy_scope
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          AW_INTAKE_TARGET_REPOSITORY: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.repository || '' }}
        run: node scripts/repository-policy.ts list deploy

      - name: Mint deploy status write token
        if: steps.deploy_scope.outputs.scan != 'false'
        id: status_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.deploy_scope.outputs.repositories_csv }}
          permission-statuses: write

      - name: Mint control dispatch token
        if: steps.deploy_scope.outputs.scan != 'false'
        id: dispatch_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      # A slot up to 12 hours late runs once: only the latest due slot of each product environment is dispatched.
      - name: Mint scoped intake read token
        if: steps.deploy_scope.outputs.scan != 'false'
        id: control_read_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.deploy_scope.outputs.read_repositories_csv }}
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read
          permission-statuses: read
          permission-issues: read

      # This is an advisory reserve for deferrable scans, not a security or merge gate.
      # A failed quota query fails this job; only a valid low-budget verdict may defer work.
      - name: Check optional scan API budget
        if: steps.deploy_scope.outputs.scan != 'false'
        id: api_budget
        env:
          AW_CONTROL_TOKEN: ${{ steps.control_read_app.outputs.token }}
          AW_GITHUB_API_METRICS: "1"
          AW_API_QUOTA_RESERVE: "300"
        run: node scripts/check-github-api-budget.ts

      - name: Dispatch due scheduled deploys
        if: steps.deploy_scope.outputs.scan != 'false' && steps.api_budget.outputs.run == 'true'
        env:
          AW_CONTROL_TOKEN: ${{ steps.control_read_app.outputs.token }}
          AW_GITHUB_API_METRICS: "1"
          AW_STATUS_API_TOKEN: ${{ steps.status_app.outputs.token }}
          AW_STATUS_KEYRING: ${{ secrets.AW_STATUS_KEYRING }}
          AW_DISPATCH_API_TOKEN: ${{ steps.dispatch_app.outputs.token }}
          AW_CONTROL_REPOSITORY: ${{ github.repository }}
          AW_INTAKE_TARGET_REPOSITORY: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.repository || '' }}
          DEPLOY_SCHEDULE_LOOKBACK_MINUTES: "720"
        run: node scripts/dispatch-scheduled-deploys.ts

  skill-admissions:
    name: CI-gated Skill admission continuation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout protected Action Worker control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Resolve versioned Skill admission repository scope
        id: scope
        env:
          AW_INTAKE_TARGET_REPOSITORY: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.repository || '' }}
        run: node scripts/skill-admission-scope.ts

      - name: Mint isolated proposal and CI read token
        if: steps.scope.outputs.scan == 'true'
        id: evidence
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.scope.outputs.target_owner }}
          repositories: ${{ steps.scope.outputs.read_repositories_csv }}
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read
          permission-statuses: read

      - name: Mint independently scoped status read token
        if: steps.scope.outputs.scan == 'true'
        id: status
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.scope.outputs.target_owner }}
          repositories: ${{ steps.scope.outputs.target_name }}
          permission-statuses: read

      - name: Verify signed merged proposal and exact main revision
        if: steps.scope.outputs.scan == 'true'
        id: inspect
        env:
          AW_CONTROL_TOKEN: ${{ steps.evidence.outputs.token }}
          AW_STATUS_API_TOKEN: ${{ steps.status.outputs.token }}
          AW_STATUS_KEYRING: ${{ secrets.AW_STATUS_KEYRING }}
          AW_INTAKE_TARGET_REPOSITORY: ${{ steps.scope.outputs.target_repository }}
        run: node scripts/skill-proposal-reconcile.ts

      - name: Checkout signed plugin main at immutable revision
        if: steps.inspect.outputs.eligible == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.inspect.outputs.target_repository }}
          ref: ${{ steps.inspect.outputs.plugin_main_sha }}
          token: ${{ steps.evidence.outputs.token }}
          path: target-source
          fetch-depth: 1
          persist-credentials: false

      - name: Compile trusted plugin-only admission logic
        if: steps.inspect.outputs.eligible == 'true'
        shell: bash
        working-directory: target-source
        run: |
          set -Eeuo pipefail
          npm install --global pnpm@11.28.5 --ignore-scripts --no-audit --no-fund
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec tsc -p packages/shared/tsconfig.json
          pnpm exec tsc -p packages/dsh-delta-code/tsconfig.json

      - name: Mint write token only for verified proposed promotion
        if: steps.inspect.outputs.eligible == 'true'
        id: writer
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.scope.outputs.target_owner }}
          repositories: ${{ steps.scope.outputs.target_name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Recheck signed evidence and submit one separate catalog PR
        if: steps.inspect.outputs.eligible == 'true'
        env:
          AW_CONTROL_TOKEN: ${{ steps.evidence.outputs.token }}
          AW_STATUS_API_TOKEN: ${{ steps.status.outputs.token }}
          AW_STATUS_KEYRING: ${{ secrets.AW_STATUS_KEYRING }}
          AW_SKILL_WRITE_TOKEN: ${{ steps.writer.outputs.token }}
          AW_SKILL_TARGET_REPOSITORY: ${{ steps.inspect.outputs.target_repository }}
          AW_SKILL_PROPOSAL_HEAD: ${{ steps.inspect.outputs.proposal_head }}
          AW_SKILL_PROPOSAL_NUMBER: ${{ steps.inspect.outputs.proposal_number }}
          AW_SKILL_PLUGIN_MAIN_SHA: ${{ steps.inspect.outputs.plugin_main_sha }}
          AW_SKILL_SOURCE_ROOT: target-source
        run: node scripts/skill-proposal-advance.ts

  security-scans:
    name: Weekly security scans
    # Every central CI pass already scans its commit; this weekly run rescans unchanged default
    # branches for newly published vulnerabilities. It dispatches without deduplication, so it runs
    # only on its own schedule and never on the heartbeat.
    if: github.event.schedule == '17 3 * * 1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Resolve PR repository scope
        id: pr_scope
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/repository-policy.ts list pr

      - name: Mint control dispatch token
        id: dispatch_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Mint scoped intake read token
        id: control_read_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.pr_scope.outputs.read_repositories_csv }}
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read
          permission-statuses: read
          permission-issues: read

      - name: Reconcile default-branch security scans
        env:
          AW_CONTROL_TOKEN: ${{ steps.control_read_app.outputs.token }}
          AW_GITHUB_API_METRICS: "1"
          AW_DISPATCH_API_TOKEN: ${{ steps.dispatch_app.outputs.token }}
          AW_CONTROL_REPOSITORY: ${{ github.repository }}
        run: node scripts/intake-security-scans.ts
