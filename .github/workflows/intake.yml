name: 自动 · 总控调度

# Finds the work that the managed repositories need and dispatches it. Every job is idempotent: it
# acts only on what has no verdict yet, so running often is safe and cheap. GitHub starts the
# schedule of this repository only every few hours, so the push of main and the run-intake event
# (sent by the repository bridges and by Action Worker itself) are the heartbeat, and the schedule
# is the fallback. Nobody starts this workflow by hand.
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [run-intake]
  schedule:
    - cron: "*/5 * * * *"
    - cron: "17 3 * * 1"

permissions: {}

concurrency:
  group: intake
  cancel-in-progress: false

jobs:
  pull-requests:
    name: Pull requests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Resolve PR repository scope
        id: pr_scope
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/repository-policy.ts list pr

      - name: Mint PR status write token
        id: status_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.pr_scope.outputs.repositories_csv }}
          permission-statuses: write

      - name: Mint control dispatch token
        id: dispatch_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Mint scoped intake read token
        id: control_read_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ format('{0},{1}', github.event.repository.name, steps.pr_scope.outputs.repositories_csv) }}
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read
          permission-statuses: read
          permission-issues: read

      - name: Reconcile open pull requests
        env:
          AW_CONTROL_TOKEN: ${{ steps.control_read_app.outputs.token }}
          AW_STATUS_API_TOKEN: ${{ steps.status_app.outputs.token }}
          AW_STATUS_KEYRING: ${{ secrets.AW_STATUS_KEYRING }}
          AW_DISPATCH_API_TOKEN: ${{ steps.dispatch_app.outputs.token }}
          AW_CONTROL_REPOSITORY: ${{ github.repository }}
        run: node scripts/intake-open-prs.ts

  main-ci:
    name: Main CI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Resolve PR repository scope
        id: pr_scope
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/repository-policy.ts list pr

      - name: Mint PR status write token
        id: status_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.pr_scope.outputs.repositories_csv }}
          permission-statuses: write

      - name: Mint control dispatch token
        id: dispatch_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Mint scoped intake read token
        id: control_read_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ format('{0},{1}', github.event.repository.name, steps.pr_scope.outputs.repositories_csv) }}
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read
          permission-statuses: read
          permission-issues: read

      - name: Reconcile main CI
        env:
          AW_CONTROL_TOKEN: ${{ steps.control_read_app.outputs.token }}
          AW_STATUS_API_TOKEN: ${{ steps.status_app.outputs.token }}
          AW_STATUS_KEYRING: ${{ secrets.AW_STATUS_KEYRING }}
          AW_DISPATCH_API_TOKEN: ${{ steps.dispatch_app.outputs.token }}
          AW_CONTROL_REPOSITORY: ${{ github.repository }}
        run: node scripts/intake-main-ci.ts

  main-writes:
    name: Main write audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Resolve PR repository scope
        id: pr_scope
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/repository-policy.ts list pr

      - name: Mint main write status token
        id: status_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.pr_scope.outputs.repositories_csv }}
          permission-statuses: write

      - name: Mint incident issue token
        id: issue_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.pr_scope.outputs.repositories_csv }}
          permission-issues: write

      - name: Mint scoped intake read token
        id: control_read_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ format('{0},{1}', github.event.repository.name, steps.pr_scope.outputs.repositories_csv) }}
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read
          permission-statuses: read
          permission-issues: read

      - name: Audit managed main branches
        env:
          AW_CONTROL_TOKEN: ${{ steps.control_read_app.outputs.token }}
          AW_STATUS_API_TOKEN: ${{ steps.status_app.outputs.token }}
          AW_STATUS_KEYRING: ${{ secrets.AW_STATUS_KEYRING }}
          AW_ISSUE_API_TOKEN: ${{ steps.issue_app.outputs.token }}
          MAIN_WRITE_AUDIT_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/audit-main-writes.ts

  task-sources:
    name: Changed task projects
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Resolve task repository scope
        id: task_scope
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/repository-policy.ts list task

      - name: Mint task status read token
        id: status_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.task_scope.outputs.repositories_csv }}
          permission-statuses: read

      - name: Mint control dispatch token
        id: dispatch_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Mint scoped intake read token
        id: control_read_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ format('{0},{1}', github.event.repository.name, steps.task_scope.outputs.repositories_csv) }}
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read
          permission-statuses: read
          permission-issues: read

      - name: Reconcile task sources
        env:
          AW_CONTROL_TOKEN: ${{ steps.control_read_app.outputs.token }}
          AW_STATUS_API_TOKEN: ${{ steps.status_app.outputs.token }}
          AW_DISPATCH_API_TOKEN: ${{ steps.dispatch_app.outputs.token }}
          AW_CONTROL_REPOSITORY: ${{ github.repository }}
        run: node scripts/intake-task-sources.ts

  task-schedules:
    name: Scheduled task projects
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Resolve task repository scope
        id: task_scope
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/repository-policy.ts list task

      - name: Mint task status write token
        id: status_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.task_scope.outputs.repositories_csv }}
          permission-statuses: write

      - name: Mint control dispatch token
        id: dispatch_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      # A slot up to 12 hours late runs once: only the latest due slot of each project is dispatched,
      # and dispatches are deduplicated per slot.
      - name: Mint scoped intake read token
        id: control_read_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ format('{0},{1}', github.event.repository.name, steps.task_scope.outputs.repositories_csv) }}
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read
          permission-statuses: read
          permission-issues: read

      - name: Dispatch due scheduled tasks
        env:
          AW_CONTROL_TOKEN: ${{ steps.control_read_app.outputs.token }}
          AW_STATUS_API_TOKEN: ${{ steps.status_app.outputs.token }}
          AW_STATUS_KEYRING: ${{ secrets.AW_STATUS_KEYRING }}
          AW_DISPATCH_API_TOKEN: ${{ steps.dispatch_app.outputs.token }}
          AW_CONTROL_REPOSITORY: ${{ github.repository }}
          TASK_SOURCE_LOOKBACK_MINUTES: "720"
        run: node scripts/dispatch-scheduled-tasks.ts

  deploy-schedules:
    name: Scheduled deploys
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Resolve deploy repository scope
        id: deploy_scope
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/repository-policy.ts list deploy

      - name: Mint deploy status write token
        id: status_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.deploy_scope.outputs.repositories_csv }}
          permission-statuses: write

      - name: Mint control dispatch token
        id: dispatch_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      # A slot up to 12 hours late runs once: only the latest due slot of each product environment is dispatched.
      - name: Mint scoped intake read token
        id: control_read_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ format('{0},{1}', github.event.repository.name, steps.deploy_scope.outputs.repositories_csv) }}
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read
          permission-statuses: read
          permission-issues: read

      - name: Dispatch due scheduled deploys
        env:
          AW_CONTROL_TOKEN: ${{ steps.control_read_app.outputs.token }}
          AW_STATUS_API_TOKEN: ${{ steps.status_app.outputs.token }}
          AW_STATUS_KEYRING: ${{ secrets.AW_STATUS_KEYRING }}
          AW_DISPATCH_API_TOKEN: ${{ steps.dispatch_app.outputs.token }}
          AW_CONTROL_REPOSITORY: ${{ github.repository }}
          DEPLOY_SCHEDULE_LOOKBACK_MINUTES: "720"
        run: node scripts/dispatch-scheduled-deploys.ts

  security-scans:
    name: Weekly security scans
    # Every central CI pass already scans its commit; this weekly run rescans unchanged default
    # branches for newly published vulnerabilities. It dispatches without deduplication, so it runs
    # only on its own schedule and never on the heartbeat.
    if: github.event.schedule == '17 3 * * 1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Resolve PR repository scope
        id: pr_scope
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/repository-policy.ts list pr

      - name: Mint control dispatch token
        id: dispatch_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Mint scoped intake read token
        id: control_read_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ format('{0},{1}', github.event.repository.name, steps.pr_scope.outputs.repositories_csv) }}
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read
          permission-statuses: read
          permission-issues: read

      - name: Reconcile default-branch security scans
        env:
          AW_CONTROL_TOKEN: ${{ steps.control_read_app.outputs.token }}
          AW_DISPATCH_API_TOKEN: ${{ steps.dispatch_app.outputs.token }}
          AW_CONTROL_REPOSITORY: ${{ github.repository }}
        run: node scripts/intake-security-scans.ts
