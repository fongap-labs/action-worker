name: 手动 · 部署服务

on:
  repository_dispatch:
    types: [run-source-script-deploy]
  workflow_dispatch:
    inputs:
      source_repository:
        description: 源仓库（owner/name 形式，例如 your-org/your-service）
        required: true
        type: string
      source_sha:
        description: 目标提交 SHA（40 位；留空则部署默认分支最新提交）
        required: false
        type: string
      product:
        description: 产品目录名（多产品仓库位于 projects/<产品>/ 下，必填；单产品仓库清单在 .github/ 根下，留空）
        required: false
        type: string
      environment:
        description: 目标环境（须为源清单已声明者，如 production；单环境可留空）
        required: false
        type: string

permissions:
  contents: read

# One pipeline group per repository, product and environment. Must differ from the deploy job-level
# group below, or the deploy job deadlocks behind its own run and fails without starting.
concurrency:
  group: ${{ format('source-script-deploy-pipeline-{0}{1}-{2}', github.event.client_payload.source_repository || inputs.source_repository || 'manual', (github.event.client_payload.product || inputs.product) && format('-{0}', github.event.client_payload.product || inputs.product) || '', github.event.client_payload.environment || inputs.environment || 'manual') }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate source-script deploy request
    runs-on: ubuntu-24.04
    # The source validation waits up to 20 minutes for the central CI verdict of the source.
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
      statuses: read
      issues: read
    outputs:
      source_repository: ${{ steps.source.outputs.source_repository }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      is_private: ${{ steps.source_visibility.outputs.is_private }}
      runner_labels_json: ${{ steps.source.outputs.runner_labels_json }}
      environment: ${{ steps.source.outputs.environment }}
      entrypoint: ${{ steps.source.outputs.entrypoint }}
      product: ${{ steps.source.outputs.product }}
      product_directory: ${{ steps.source.outputs.product_directory }}
      trigger: ${{ steps.source.outputs.trigger }}

    steps:
      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve repository dispatch request
        id: dispatch_request
        if: github.event_name == 'repository_dispatch'
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        shell: bash
        run: |
          set -Eeuo pipefail
          request="$(jq -c . <<< "$PAYLOAD")"
          echo "request_json=$request" >> "$GITHUB_OUTPUT"

      - name: Resolve deploy source API scope
        id: api_scope
        env:
          TARGET_REPOSITORY: ${{ github.event.client_payload.source_repository || inputs.source_repository }}
        run: node scripts/resolve-github-api-scope.ts deploy

      # The prepare job only reads source facts; deployment secrets are available later
      # in the isolated, environment-approved deployment job.
      - name: Mint cross-repository deploy preflight read token
        id: app_read
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.api_scope.outputs.owner }}
          repositories: ${{ format('{0},{1}', github.event.repository.name, steps.api_scope.outputs.repository_name) }}
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read
          permission-checks: read
          permission-statuses: read
          permission-issues: read

      - name: Resolve deploy source visibility
        id: source_visibility
        env:
          GH_TOKEN: ${{ steps.app_read.outputs.token }}
          SOURCE_REPOSITORY: ${{ github.event.client_payload.source_repository || inputs.source_repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          is_private="$(gh api "repos/$SOURCE_REPOSITORY" --jq '.private')"
          [[ "$is_private" == "true" || "$is_private" == "false" ]] || {
            echo "::error::Unable to verify deploy source visibility." >&2
            exit 77
          }
          echo "is_private=$is_private" >> "$GITHUB_OUTPUT"

      - name: Resolve manual deploy request
        id: manual_request
        if: github.event_name == 'workflow_dispatch'
        env:
          AW_DEPLOY_SOURCE_READ_TOKEN: ${{ steps.app_read.outputs.token }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_PRODUCT: ${{ inputs.product }}
          SOURCE_ENVIRONMENT: ${{ inputs.environment }}
        shell: bash
        run: |
          set -Eeuo pipefail
          # Names the offending input and the allowed repositories instead of exiting silently.
          node scripts/repository-policy.ts validate "$SOURCE_REPOSITORY" deploy
          if [ -z "$SOURCE_SHA" ]; then
            # Git transport avoids consuming the shared personal PAT REST quota. The existing
            # short-lived repository-scoped App read credential supports private source repositories too.
            if [ -z "$AW_DEPLOY_SOURCE_READ_TOKEN" ]; then
              echo "::error::Missing scoped GitHub App read token to resolve source HEAD; no personal PAT fallback." >&2
              exit 77
            fi
            auth="$(printf 'x-access-token:%s' "$AW_DEPLOY_SOURCE_READ_TOKEN" | base64 -w 0)"
            SOURCE_SHA="$(
              GIT_TERMINAL_PROMPT=0 \
              GIT_CONFIG_COUNT=1 \
              GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
              GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
              git ls-remote --exit-code "https://github.com/$SOURCE_REPOSITORY.git" HEAD |
                awk '$2 == "HEAD" {print $1}'
            )"
            unset auth
          fi
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::source_sha must be a full 40-character lowercase commit SHA, or empty to deploy the current default-branch HEAD: got '$SOURCE_SHA'." >&2
            exit 64
          }
          {
            echo "source_repository=$SOURCE_REPOSITORY"
            echo "source_sha=$SOURCE_SHA"
          } >> "$GITHUB_OUTPUT"
          request="$(
            jq -cn \
              --arg request_id "manual-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
              --arg source_repository "$SOURCE_REPOSITORY" \
              --arg source_sha "$SOURCE_SHA" \
              --arg product "$SOURCE_PRODUCT" \
              --arg environment "$SOURCE_ENVIRONMENT" \
              '{
                schema_version: "1",
                request_id: $request_id,
                source_repository: $source_repository,
                source_sha: $source_sha,
                product: $product,
                environment: $environment
              }'
          )"
          echo "request_json=$request" >> "$GITHUB_OUTPUT"

      - name: Mint deploy source CI status token
        id: ci_status_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.api_scope.outputs.owner }}
          repositories: ${{ steps.api_scope.outputs.repository_name }}
          permission-statuses: write

      - name: Mint central CI dispatch token
        id: ci_dispatch_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      # Intake may not have reached this source yet, so every deploy asks for central CI and
      # attests the main write on its own source now; both are no-ops when already done. An
      # automatic deploy can name a newer main than the commit whose CI started it (see
      # scripts/dispatch-central-deploy.ts). The validation stays the authority and reports an
      # untrusted write.
      - name: Request central CI for the source
        env:
          AW_CONTROL_TOKEN: ${{ steps.api_scope.outputs.is_control_repository == 'true' && github.token || steps.app_read.outputs.token }}
          AW_STATUS_API_TOKEN: ${{ steps.ci_status_app.outputs.token }}
          AW_STATUS_KEYRING: ${{ secrets.AW_STATUS_KEYRING }}
          AW_DISPATCH_API_TOKEN: ${{ steps.ci_dispatch_app.outputs.token }}
          AW_CONTROL_REPOSITORY: ${{ github.repository }}
          AW_CI_INTAKE_REPOSITORY: ${{ steps.manual_request.outputs.source_repository || github.event.client_payload.source_repository }}
        run: node scripts/intake-main-ci.ts

      - name: Resolve source audit API scope
        id: audit_scope
        env:
          TARGET_REPOSITORY: ${{ steps.manual_request.outputs.source_repository || github.event.client_payload.source_repository }}
        run: node scripts/resolve-github-api-scope.ts pr

      - name: Mint source audit status token
        id: audit_status_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.audit_scope.outputs.owner }}
          repositories: ${{ steps.audit_scope.outputs.repository_name }}
          permission-statuses: write

      - name: Mint source audit issue token
        id: audit_issue_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.audit_scope.outputs.owner }}
          repositories: ${{ steps.audit_scope.outputs.repository_name }}
          permission-issues: write

      - name: Attest the source main write
        env:
          AW_CONTROL_TOKEN: ${{ steps.app_read.outputs.token }}
          AW_STATUS_API_TOKEN: ${{ steps.audit_status_app.outputs.token }}
          AW_STATUS_KEYRING: ${{ secrets.AW_STATUS_KEYRING }}
          AW_ISSUE_API_TOKEN: ${{ steps.audit_issue_app.outputs.token }}
          MAIN_WRITE_AUDIT_REPOSITORY: ${{ steps.manual_request.outputs.source_repository || github.event.client_payload.source_repository }}
          MAIN_WRITE_AUDIT_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/audit-main-writes.ts

      - name: Validate deploy source
        id: source
        env:
          AW_CONTROL_TOKEN: ${{ steps.api_scope.outputs.is_control_repository == 'true' && github.token || steps.app_read.outputs.token }}
          AW_STATUS_API_TOKEN: ${{ steps.api_scope.outputs.is_control_repository == 'true' && github.token || steps.app_read.outputs.token }}
          AW_STATUS_KEYRING: ${{ secrets.AW_STATUS_KEYRING }}
          DEPLOY_REQUEST_JSON: ${{ steps.dispatch_request.outputs.request_json || steps.manual_request.outputs.request_json }}
        run: node scripts/validate-deploy-source.ts source-script true policies/runner.json policies/deploy-environments.json

  gateway_account_id:
    # Only public allowlisted data is exported; no ops Secret crosses the trust boundary.
    needs: prepare
    if: needs.prepare.result == 'success' && needs.prepare.outputs.source_repository == 'fongap-labs/ai-gateway' && needs.prepare.outputs.environment == 'production' && needs.prepare.outputs.product == ''
    name: Resolve AI Gateway deployment Variables from protected ops
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: ai-gateway-ops
      deployment: false
    permissions:
      contents: read
    outputs:
      account_id: ${{ steps.account_id.outputs.account_id }}
      public_url: ${{ steps.account_id.outputs.public_url }}
      affinity_kv_id: ${{ steps.account_id.outputs.affinity_kv_id }}
      usage_d1_id: ${{ steps.account_id.outputs.usage_d1_id }}
      analytics_dataset: ${{ steps.account_id.outputs.analytics_dataset }}
    steps:
      - name: Check out trusted control implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Validate allowlisted non-sensitive ops Variables
        id: account_id
        env:
          CLOUDFLARE_ACCOUNT_ID_SECONDARY: ${{ vars.CLOUDFLARE_ACCOUNT_ID_SECONDARY }}
          AIG_PUBLIC_URL: ${{ vars.AIG_PUBLIC_URL }}
          AIG_AFFINITY_KV_ID: ${{ vars.AIG_AFFINITY_KV_ID }}
          AIG_USAGE_D1_ID: ${{ vars.AIG_USAGE_D1_ID }}
          AIG_ANALYTICS_DATASET: ${{ vars.AIG_ANALYTICS_DATASET }}
        run: node scripts/gateway-ops-variables.ts

  deploy:
    name: Execute source-script deploy
    needs: [prepare, gateway_account_id]
    # A skipped ops job is normal for non-Gateway deployments. Gateway production
    # requires an approved, successful ops read; failure cannot bypass this gate.
    if: ${{ !cancelled() && needs.prepare.result == 'success' && ((needs.prepare.outputs.source_repository == 'fongap-labs/ai-gateway' && needs.prepare.outputs.environment == 'production' && needs.prepare.outputs.product == '' && needs.gateway_account_id.result == 'success') || (needs.prepare.outputs.source_repository != 'fongap-labs/ai-gateway' && needs.gateway_account_id.result == 'skipped')) }}
    # Exactly one GitHub Environment per deployment job. The prepare gate checks
    # the source manifest against the central authorization policy.
    environment: ${{ needs.prepare.outputs.environment }}
    # The group uses the resolved values, so a request that left the product or environment empty
    # still queues behind the same deploy of that product and environment.
    concurrency:
      group: source-script-deploy-${{ needs.prepare.outputs.source_repository }}${{ needs.prepare.outputs.product && format('-{0}', needs.prepare.outputs.product) || '' }}-${{ needs.prepare.outputs.environment }}
      cancel-in-progress: false
    runs-on: ${{ fromJSON(needs.prepare.outputs.runner_labels_json) }}
    timeout-minutes: 45
    env:
      DEPLOY_SOURCE_REPOSITORY: ${{ needs.prepare.outputs.source_repository }}
      DEPLOY_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      DEPLOY_ENVIRONMENT: ${{ needs.prepare.outputs.environment }}
      DEPLOY_ENTRYPOINT: ${{ needs.prepare.outputs.entrypoint }}
      DEPLOY_PRODUCT: ${{ needs.prepare.outputs.product }}
      DEPLOY_PRODUCT_DIRECTORY: ${{ needs.prepare.outputs.product_directory }}
      DEPLOY_TRIGGER: ${{ needs.prepare.outputs.trigger }}

    steps:
      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
          persist-credentials: false

      - name: Validate deploy source visibility
        env:
          IS_PRIVATE: ${{ needs.prepare.outputs.is_private }}
        shell: bash
        run: |
          [[ "$IS_PRIVATE" == "true" || "$IS_PRIVATE" == "false" ]] || {
            echo "::error::Deploy source visibility must be confirmed before checkout." >&2
            exit 77
          }

      - name: Checkout private deploy source
        if: needs.prepare.outputs.is_private == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.prepare.outputs.source_repository }}
          ref: ${{ needs.prepare.outputs.source_sha }}
          token: ${{ secrets.AW_CHECKOUT_TOKEN }}
          path: target
          persist-credentials: false

      - name: Checkout public deploy source
        if: needs.prepare.outputs.is_private == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.prepare.outputs.source_repository }}
          ref: ${{ needs.prepare.outputs.source_sha }}
          token: ${{ github.token }}
          path: target
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Export repository variables
        env:
          REPOSITORY_VARS_JSON: ${{ toJSON(vars) }}
          AW_GATEWAY_ACCOUNT_ID_FROM_OPS: ${{ needs.gateway_account_id.outputs.account_id }}
          AW_GATEWAY_PUBLIC_URL_FROM_OPS: ${{ needs.gateway_account_id.outputs.public_url }}
          AW_GATEWAY_AFFINITY_KV_ID_FROM_OPS: ${{ needs.gateway_account_id.outputs.affinity_kv_id }}
          AW_GATEWAY_USAGE_D1_ID_FROM_OPS: ${{ needs.gateway_account_id.outputs.usage_d1_id }}
          AW_GATEWAY_ANALYTICS_DATASET_FROM_OPS: ${{ needs.gateway_account_id.outputs.analytics_dataset }}
        run: node control/scripts/export-repository-variables.ts

      - name: Resolve deploy Secret plan
        id: secret_plan
        shell: bash
        run: |
          set -Eeuo pipefail
          node control/scripts/resolve-deploy-secret-plan.ts \
            "target/${DEPLOY_PRODUCT_DIRECTORY}/deploy.secrets.required" \
            "target/${DEPLOY_PRODUCT_DIRECTORY}/deploy.secrets.allowed" \
            "control/policies/deploy-secrets.json" \
            "$DEPLOY_SOURCE_REPOSITORY" "$DEPLOY_ENVIRONMENT" "$DEPLOY_PRODUCT"

      - name: Stage authorized deployment Secrets
        env:
          AW_DEPLOY_SECRET_00: ${{ secrets[steps.secret_plan.outputs.secret_00] }}
          AW_DEPLOY_SECRET_01: ${{ secrets[steps.secret_plan.outputs.secret_01] }}
          AW_DEPLOY_SECRET_02: ${{ secrets[steps.secret_plan.outputs.secret_02] }}
          AW_DEPLOY_SECRET_03: ${{ secrets[steps.secret_plan.outputs.secret_03] }}
          AW_DEPLOY_SECRET_04: ${{ secrets[steps.secret_plan.outputs.secret_04] }}
          AW_DEPLOY_SECRET_05: ${{ secrets[steps.secret_plan.outputs.secret_05] }}
          AW_DEPLOY_SECRET_06: ${{ secrets[steps.secret_plan.outputs.secret_06] }}
          AW_DEPLOY_SECRET_07: ${{ secrets[steps.secret_plan.outputs.secret_07] }}
          AW_DEPLOY_SECRET_08: ${{ secrets[steps.secret_plan.outputs.secret_08] }}
          AW_DEPLOY_SECRET_09: ${{ secrets[steps.secret_plan.outputs.secret_09] }}
          AW_DEPLOY_SECRET_10: ${{ secrets[steps.secret_plan.outputs.secret_10] }}
          AW_DEPLOY_SECRET_11: ${{ secrets[steps.secret_plan.outputs.secret_11] }}
          AW_DEPLOY_SECRET_12: ${{ secrets[steps.secret_plan.outputs.secret_12] }}
          AW_DEPLOY_SECRET_13: ${{ secrets[steps.secret_plan.outputs.secret_13] }}
          AW_DEPLOY_SECRET_14: ${{ secrets[steps.secret_plan.outputs.secret_14] }}
          AW_DEPLOY_SECRET_15: ${{ secrets[steps.secret_plan.outputs.secret_15] }}
          AW_DEPLOY_SECRET_16: ${{ secrets[steps.secret_plan.outputs.secret_16] }}
          AW_DEPLOY_SECRET_17: ${{ secrets[steps.secret_plan.outputs.secret_17] }}
          AW_DEPLOY_SECRET_18: ${{ secrets[steps.secret_plan.outputs.secret_18] }}
          AW_DEPLOY_SECRET_19: ${{ secrets[steps.secret_plan.outputs.secret_19] }}
          AW_DEPLOY_SECRET_20: ${{ secrets[steps.secret_plan.outputs.secret_20] }}
          AW_DEPLOY_SECRET_21: ${{ secrets[steps.secret_plan.outputs.secret_21] }}
          AW_DEPLOY_SECRET_22: ${{ secrets[steps.secret_plan.outputs.secret_22] }}
          AW_DEPLOY_SECRET_23: ${{ secrets[steps.secret_plan.outputs.secret_23] }}
          AW_DEPLOY_SECRET_24: ${{ secrets[steps.secret_plan.outputs.secret_24] }}
          AW_DEPLOY_SECRET_25: ${{ secrets[steps.secret_plan.outputs.secret_25] }}
          AW_DEPLOY_SECRET_26: ${{ secrets[steps.secret_plan.outputs.secret_26] }}
          AW_DEPLOY_SECRET_27: ${{ secrets[steps.secret_plan.outputs.secret_27] }}
          AW_DEPLOY_SECRET_28: ${{ secrets[steps.secret_plan.outputs.secret_28] }}
          AW_DEPLOY_SECRET_29: ${{ secrets[steps.secret_plan.outputs.secret_29] }}
          AW_DEPLOY_SECRET_30: ${{ secrets[steps.secret_plan.outputs.secret_30] }}
          AW_DEPLOY_SECRET_31: ${{ secrets[steps.secret_plan.outputs.secret_31] }}
          AW_DEPLOY_SECRET_32: ${{ secrets[steps.secret_plan.outputs.secret_32] }}
          AW_DEPLOY_SECRET_33: ${{ secrets[steps.secret_plan.outputs.secret_33] }}
          AW_DEPLOY_SECRET_34: ${{ secrets[steps.secret_plan.outputs.secret_34] }}
          AW_DEPLOY_SECRET_35: ${{ secrets[steps.secret_plan.outputs.secret_35] }}
          AW_DEPLOY_SECRET_36: ${{ secrets[steps.secret_plan.outputs.secret_36] }}
          AW_DEPLOY_SECRET_37: ${{ secrets[steps.secret_plan.outputs.secret_37] }}
          AW_DEPLOY_SECRET_38: ${{ secrets[steps.secret_plan.outputs.secret_38] }}
          AW_DEPLOY_SECRET_39: ${{ secrets[steps.secret_plan.outputs.secret_39] }}
        run: node control/scripts/stage-deploy-secret-bundle.ts

      - name: Execute source-owned deploy entrypoint
        shell: bash
        run: |
          set -Eeuo pipefail
          node control/scripts/run-scoped-deploy.ts

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Source Script central deployment"
            echo
            echo "- Source: $DEPLOY_SOURCE_REPOSITORY@$DEPLOY_SOURCE_SHA"
            echo "- Product: ${DEPLOY_PRODUCT:-(root)}"
            echo "- Environment: $DEPLOY_ENVIRONMENT"
            echo "- Trigger: $DEPLOY_TRIGGER"
            echo "- Entrypoint: $DEPLOY_ENTRYPOINT"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup deploy Secret staging
        if: always()
        shell: bash
        run: |
          rm -rf \
            "${RUNNER_TEMP}/action-worker-deploy-secrets" \
            "${RUNNER_TEMP}/action-worker-deploy-secret-plan.json"
