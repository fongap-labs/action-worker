name: 自动 · 组织仓库接入

# One automatic enrollment path. GitHub native PR Ruleset remains the merge authority.
on:
  push:
    branches: [main]
    paths:
      - policies/repository-access.json
      - scripts/enroll-organization-repositories.ts
      - scripts/central-ci-enrollment.ts
      - policies/templates/notify-action-worker.yml
      - scripts/private-downstream-compatibility.ts
      - policies/runner.json
      - scripts/validate-release-build-request.ts
      - scripts/deploy-manifest.ts
      - .github/workflows/enroll-organization-repositories.yml
  workflow_run:
    workflows: ["自动 · CI 验证"]
    types: [completed]
  schedule:
    - cron: "11,41 * * * *"

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: organization-repository-onboarding
  cancel-in-progress: false

jobs:
  onboard:
    name: Discover and safely enroll repositories
    if: github.repository == 'fongap-labs/action-worker'
    environment:
      name: admin-ops
      deployment: false
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install deterministic contract dependencies
        run: npm ci

      - name: Mint App inventory read token
        id: inventory
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      - name: Mint control repository PR token
        id: writer
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Audit installed private release/deploy contracts (read only)
        if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ steps.inventory.outputs.token }}
        run: node scripts/private-downstream-compatibility.ts

      - name: Reconcile App installation into protected policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AW_INVENTORY_TOKEN: ${{ steps.inventory.outputs.token }}
          AW_REPOSITORY_WRITE_TOKEN: ${{ steps.writer.outputs.token }}
        run: node scripts/enroll-organization-repositories.ts

      # Discover missing bridges without granting cross-repository write access.
      - name: Plan default central CI enrollment
        id: ci_scope
        env:
          AW_INVENTORY_TOKEN: ${{ steps.inventory.outputs.token }}
        run: node scripts/central-ci-enrollment.ts plan

      - name: Mint bridge-only repository write token
        if: steps.ci_scope.outputs.has_targets == 'true'
        id: ci_writer
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.ci_scope.outputs.repositories_csv }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open missing central CI bridge pull requests
        if: steps.ci_scope.outputs.has_targets == 'true'
        env:
          AW_INVENTORY_TOKEN: ${{ steps.inventory.outputs.token }}
          AW_CI_WRITE_TOKEN: ${{ steps.ci_writer.outputs.token }}
          AW_CI_TARGETS_JSON: ${{ steps.ci_scope.outputs.targets_json }}
        run: node scripts/central-ci-enrollment.ts apply

