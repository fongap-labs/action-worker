name: Validate Deploy Policy

on:
  workflow_call:
    inputs:
      target_sha:
        description: Deploy target commit SHA; empty defaults to current SHA
        required: false
        type: string
        default: ""
      ci_workflow:
        description: CI workflow file name that must have completed successfully
        required: false
        type: string
        default: ci.yml
      require_default_head:
        description: Whether the deploy target must be the default branch HEAD
        required: false
        type: boolean
        default: true
    outputs:
      target_sha:
        description: Validated deploy target commit SHA
        value: ${{ jobs.source.outputs.target_sha }}
      default_branch:
        description: Default branch
        value: ${{ jobs.source.outputs.default_branch }}
      ci_run_id:
        description: Validated successful CI Run ID
        value: ${{ jobs.source.outputs.ci_run_id }}

permissions:
  contents: read
  actions: read

jobs:
  source:
    name: deploy-source-policy
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/validate-source-policy.yml
    with:
      target_sha: ${{ inputs.target_sha }}
      ci_workflow: ${{ inputs.ci_workflow }}
      require_default_head: ${{ inputs.require_default_head }}
