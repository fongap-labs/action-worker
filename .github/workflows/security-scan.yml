name: Handle Security Scan Dispatch

on:
  repository_dispatch:
    types: [run-security-scan]

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.event.client_payload.repository }}-${{ github.event.client_payload.source_sha }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    outputs:
      repository: ${{ steps.resolve.outputs.repository }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      ref: ${{ steps.resolve.outputs.ref }}
      matrix: ${{ steps.resolve.outputs.matrix }}

    steps:
      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Resolve trusted security scan
        id: resolve
        env:
          AW_CONTROL_TOKEN: ${{ secrets.AW_CONTROL_TOKEN }}
          AW_REPOSITORY_POLICY: ${{ vars.AW_REPOSITORY_POLICY }}
          SECURITY_SCAN_REQUEST_JSON: ${{ toJSON(github.event.client_payload) }}
        run: node scripts/resolve-security-scan.ts policies/runner.json

  analyze:
    name: CodeQL / ${{ matrix.language }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ fromJSON(matrix.runner_labels_json) }}
    timeout-minutes: 90

    steps:
      - name: Checkout target source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.prepare.outputs.repository }}
          ref: ${{ needs.prepare.outputs.source_sha }}
          # Private sources never reach this job (resolve-security-scan.ts refuses them).
          token: ${{ github.token }}
          path: target
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build_mode }}
          source-root: target

      - name: Analyze CodeQL
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          upload: never
          upload-database: false
          output: ${{ runner.temp }}/codeql-results
          checkout_path: ${{ github.workspace }}/target
          ref: ${{ needs.prepare.outputs.ref }}
          sha: ${{ needs.prepare.outputs.source_sha }}
          category: central/language:${{ matrix.language }}

      - name: Upload SARIF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-results-${{ matrix.language }}
          path: ${{ runner.temp }}/codeql-results
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish SARIF
    environment: admin-ops
    needs: [prepare, analyze]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout security publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
          persist-credentials: false

      - name: Setup Node for publisher
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Download SARIF
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codeql-results-*
          path: ${{ runner.temp }}/codeql-results
          merge-multiple: true

      - name: Publish SARIF to target repository
        env:
          AW_ADMIN_TOKEN: ${{ secrets.AW_ADMIN_TOKEN }}
          TARGET_REPOSITORY: ${{ needs.prepare.outputs.repository }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          SOURCE_REF: ${{ needs.prepare.outputs.ref }}
        run: |
          node control/scripts/publish-security-scan.ts             "$TARGET_REPOSITORY"             "$SOURCE_SHA"             "$SOURCE_REF"             "$RUNNER_TEMP/codeql-results"
