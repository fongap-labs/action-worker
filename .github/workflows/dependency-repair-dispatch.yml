name: 自动 · 依赖修复

on:
  repository_dispatch:
    types: [run-dependency-repair]

permissions:
  contents: read

concurrency:
  group: dependency-repair-${{ github.event.client_payload.repository }}-${{ github.event.client_payload.pr_number }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare dependency repair
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    outputs:
      enabled: ${{ steps.resolve.outputs.enabled }}
      repository: ${{ steps.resolve.outputs.repository }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      head_ref: ${{ steps.resolve.outputs.head_ref }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      repair_id: ${{ steps.resolve.outputs.repair_id }}
      adapter: ${{ steps.resolve.outputs.adapter }}
      tool_version: ${{ steps.resolve.outputs.tool_version }}
      working_directory: ${{ steps.resolve.outputs.working_directory }}
      output_paths_json: ${{ steps.resolve.outputs.output_paths_json }}
      runner_labels_json: ${{ steps.resolve.outputs.runner_labels_json }}
      is_private: ${{ steps.visibility.outputs.is_private }}

    steps:
      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve central runtime versions
        id: runtime
        run: node scripts/resolve-runtime-versions.mjs --github-output .

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.runtime.outputs.node }}

      - name: Resolve dependency repair status scope
        id: status_scope
        env:
          TARGET_REPOSITORY: ${{ github.event.client_payload.repository }}
        run: node scripts/resolve-github-api-scope.ts pr

      - name: Mint dependency repair status token
        id: status_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.status_scope.outputs.owner }}
          repositories: ${{ steps.status_scope.outputs.repository_name }}
          permission-statuses: write

      - name: Mark dependency repair in progress
        env:
          AW_STATUS_API_TOKEN: ${{ steps.status_app.outputs.token }}
          AW_STATUS_KEYRING: ${{ secrets.AW_STATUS_KEYRING }}
          REPOSITORY: ${{ github.event.client_payload.repository }}
          HEAD_SHA: ${{ github.event.client_payload.head_sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_STATUS_CONTEXT: Dependency Repair
        run: node scripts/set-pr-status.ts "$REPOSITORY" "$HEAD_SHA" pending "Action Worker dependency repair in progress" "$RUN_URL"

      - name: Mint dependency repair read token
        id: prepare_read_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.status_scope.outputs.owner }}
          repositories: ${{ steps.status_scope.outputs.repository_name }}
          permission-contents: read
          permission-pull-requests: read

      - name: Resolve dependency repair
        id: resolve
        env:
          AW_CONTROL_TOKEN: ${{ steps.prepare_read_app.outputs.token }}
          DEPENDENCY_REPAIR_REQUEST_JSON: ${{ toJSON(github.event.client_payload) }}
        run: node scripts/resolve-dependency-repair.ts policies/runner.json

      - name: Resolve target visibility
        id: visibility
        if: steps.resolve.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ steps.prepare_read_app.outputs.token }}
          REPOSITORY: ${{ steps.resolve.outputs.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "is_private=$(gh api "repos/$REPOSITORY" --jq '.private')" >> "$GITHUB_OUTPUT"

  compute:
    name: Dependency repair / ${{ needs.prepare.outputs.repair_id }}
    needs: prepare
    if: needs.prepare.outputs.enabled == 'true'
    runs-on: ${{ fromJSON(needs.prepare.outputs.runner_labels_json) }}
    timeout-minutes: 30

    outputs:
      changed: ${{ steps.collect.outputs.changed }}

    steps:
      - name: Validate target visibility
        env:
          IS_PRIVATE: ${{ needs.prepare.outputs.is_private }}
        shell: bash
        run: |
          if [[ "$IS_PRIVATE" != "true" && "$IS_PRIVATE" != "false" ]]; then
            echo "::error::Target repository visibility must be explicitly confirmed before checkout." >&2
            exit 65
          fi

      - name: Verify public Node repair scope
        if: needs.prepare.outputs.adapter != 'uv-lock'
        env:
          IS_PRIVATE: ${{ needs.prepare.outputs.is_private }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$IS_PRIVATE" == "false" ]]

      - name: Require private checkout token
        if: needs.prepare.outputs.is_private == 'true'
        env:
          AW_CHECKOUT_TOKEN: ${{ secrets.AW_CHECKOUT_TOKEN }}
        shell: bash
        run: |
          if [ -z "${AW_CHECKOUT_TOKEN:-}" ]; then
            echo "::error::Missing required secret AW_CHECKOUT_TOKEN. Grant Contents: Read on the private target repository. Configure in fongap-labs/action-worker → Settings → Secrets and variables → Actions. No token fallback is permitted." >&2
            exit 77
          fi

      - name: Checkout private target source
        if: needs.prepare.outputs.is_private == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.prepare.outputs.repository }}
          ref: ${{ needs.prepare.outputs.head_sha }}
          token: ${{ secrets.AW_CHECKOUT_TOKEN }}
          path: target
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout public target source
        if: needs.prepare.outputs.is_private == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.prepare.outputs.repository }}
          ref: ${{ needs.prepare.outputs.head_sha }}
          token: ${{ github.token }}
          path: target
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
          persist-credentials: false

      - name: Resolve central Node repair versions
        id: runtime
        if: needs.prepare.outputs.adapter != 'uv-lock'
        run: node control/scripts/resolve-runtime-versions.mjs --github-output control

      - name: Setup central Node for lock repair
        if: needs.prepare.outputs.adapter != 'uv-lock'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.runtime.outputs.node }}
          package-manager-cache: false

      - name: Install central pnpm repair tool
        if: needs.prepare.outputs.adapter == 'pnpm-lock'
        working-directory: control
        env:
          PNPM_VERSION: ${{ steps.runtime.outputs.pnpm }}
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --global --prefix "$RUNNER_TEMP/dependency-repair-tools" --ignore-scripts --no-audit --no-fund --registry https://registry.npmjs.org "pnpm@$PNPM_VERSION"
          [[ "$("$RUNNER_TEMP/dependency-repair-tools/bin/pnpm" --version)" == "$PNPM_VERSION" ]]

      - name: Run npm lock adapter
        if: needs.prepare.outputs.adapter == 'npm-lock'
        working-directory: target/${{ needs.prepare.outputs.working_directory }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(pwd -P)" == "$(pwd -L)" ]]
          [[ -f package.json && ! -L package.json && -f package-lock.json && ! -L package-lock.json ]]
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --no-update-notifier

      - name: Run pnpm lock adapter
        if: needs.prepare.outputs.adapter == 'pnpm-lock'
        working-directory: target/${{ needs.prepare.outputs.working_directory }}
        env:
          PNPM_VERSION: ${{ steps.runtime.outputs.pnpm }}
          npm_config_manage_package_manager_versions: "false"
          npm_config_package_manager_strict: "false"
          npm_config_package_manager_strict_version: "false"
          npm_config_pm_on_fail: error
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(pwd -P)" == "$(pwd -L)" ]]
          [[ -f package.json && ! -L package.json && -f pnpm-lock.yaml && ! -L pnpm-lock.yaml ]]
          node -e 'const m=JSON.parse(require("node:fs").readFileSync("package.json","utf8"));if(m.packageManager && m.packageManager.split("+")[0] !== "pnpm@"+process.env.PNPM_VERSION)process.exit(65)'
          pnpm_cmd="$RUNNER_TEMP/dependency-repair-tools/bin/pnpm"
          [[ "$("$pnpm_cmd" --version)" == "$PNPM_VERSION" ]]
          "$pnpm_cmd" install --lockfile-only --ignore-scripts --ignore-pnpmfile --config.manage-package-manager-versions=false

      - name: Set up uv adapter
        if: needs.prepare.outputs.adapter == 'uv-lock'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ needs.prepare.outputs.tool_version }}

      - name: Run uv lock adapter
        if: needs.prepare.outputs.adapter == 'uv-lock'
        working-directory: target/${{ needs.prepare.outputs.working_directory }}
        run: uv lock

      - name: Confine generated outputs
        id: collect
        env:
          OUTPUT_PATHS_JSON: ${{ needs.prepare.outputs.output_paths_json }}
        run: |
          node control/scripts/collect-dependency-repair.ts \
            "$GITHUB_WORKSPACE/target" \
            "$RUNNER_TEMP/dependency-repair" \
            "$OUTPUT_PATHS_JSON"

      - name: Upload generated outputs
        if: steps.collect.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-repair-output
          path: ${{ runner.temp }}/dependency-repair
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish dependency repair
    needs: [prepare, compute]
    if: needs.compute.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Download generated outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dependency-repair-output
          path: ${{ runner.temp }}/dependency-repair

      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
          persist-credentials: false

      - name: Resolve central runtime versions
        id: runtime
        run: node control/scripts/resolve-runtime-versions.mjs --github-output control

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.runtime.outputs.node }}

      - name: Resolve dependency repair publish scope
        id: publish_scope
        env:
          TARGET_REPOSITORY: ${{ needs.prepare.outputs.repository }}
        run: node control/scripts/resolve-github-api-scope.ts pr

      - name: Mint dependency repair publish read token
        id: publish_read_app
        uses: ./control/.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.publish_scope.outputs.owner }}
          repositories: ${{ steps.publish_scope.outputs.repository_name }}
          permission-contents: read
          permission-pull-requests: read

      - name: Mint dependency repair publish push token
        id: publish_push_app
        uses: ./control/.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.publish_scope.outputs.owner }}
          repositories: ${{ steps.publish_scope.outputs.repository_name }}
          permission-contents: write

      - name: Checkout target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.prepare.outputs.repository }}
          ref: ${{ needs.prepare.outputs.head_sha }}
          token: ${{ steps.publish_read_app.outputs.token }}
          path: target
          fetch-depth: 1
          persist-credentials: false

      - name: Revalidate and publish generated outputs
        env:
          AW_CONTROL_TOKEN: ${{ steps.publish_read_app.outputs.token }}
          AW_REPAIR_PUSH_API_TOKEN: ${{ steps.publish_push_app.outputs.token }}
          OUTPUT_PATHS_JSON: ${{ needs.prepare.outputs.output_paths_json }}
          TARGET_REPOSITORY: ${{ needs.prepare.outputs.repository }}
          TARGET_PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          TARGET_HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
          TARGET_HEAD_REF: ${{ needs.prepare.outputs.head_ref }}
          TARGET_BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          REPAIR_ID: ${{ needs.prepare.outputs.repair_id }}
        run: |
          node control/scripts/publish-dependency-repair.ts \
            "$TARGET_REPOSITORY" \
            "$TARGET_PR_NUMBER" \
            "$TARGET_HEAD_SHA" \
            "$TARGET_HEAD_REF" \
            "$TARGET_BASE_SHA" \
            "$REPAIR_ID" \
            "$OUTPUT_PATHS_JSON" \
            "$RUNNER_TEMP/dependency-repair" \
            "$GITHUB_WORKSPACE/target"

  finalize:
    name: Finalize dependency repair
    needs:
      - prepare
      - compute
      - publish
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve central runtime versions
        id: runtime
        run: node scripts/resolve-runtime-versions.mjs --github-output .

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.runtime.outputs.node }}

      - name: Resolve final dependency repair status scope
        id: status_scope
        env:
          TARGET_REPOSITORY: ${{ needs.prepare.outputs.repository || github.event.client_payload.repository }}
        run: node scripts/resolve-github-api-scope.ts pr

      - name: Mint final dependency repair status token
        id: status_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.status_scope.outputs.owner }}
          repositories: ${{ steps.status_scope.outputs.repository_name }}
          permission-statuses: write

      - name: Mint intake dispatch token
        id: dispatch_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Mint dependency repair final PR read token
        id: final_read_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.status_scope.outputs.owner }}
          repositories: ${{ steps.status_scope.outputs.repository_name }}
          permission-pull-requests: read

      - name: Publish repair status and continue intake
        env:
          AW_CONTROL_TOKEN: ${{ steps.final_read_app.outputs.token }}
          AW_STATUS_API_TOKEN: ${{ steps.status_app.outputs.token }}
          AW_STATUS_KEYRING: ${{ secrets.AW_STATUS_KEYRING }}
          AW_DISPATCH_API_TOKEN: ${{ steps.dispatch_app.outputs.token }}
          REPOSITORY: ${{ needs.prepare.outputs.repository || github.event.client_payload.repository }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number || github.event.client_payload.pr_number }}
          HEAD_SHA: ${{ needs.prepare.outputs.head_sha || github.event.client_payload.head_sha }}
          REPAIR_ENABLED: ${{ needs.prepare.outputs.enabled }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          COMPUTE_RESULT: ${{ needs.compute.result }}
          REPAIR_CHANGED: ${{ needs.compute.outputs.changed }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_STATUS_CONTEXT: Dependency Repair
        shell: bash
        run: |
          set -Eeuo pipefail

          state=failure
          description="Action Worker dependency repair failed"
          if [ "$PREPARE_RESULT" = "success" ]; then
            if [ "$REPAIR_ENABLED" != "true" ]; then
              state=success
              description="Dependency repair not required"
            elif [ "$COMPUTE_RESULT" = "success" ] && { [ "$REPAIR_CHANGED" != "true" ] || [ "$PUBLISH_RESULT" = "success" ]; }; then
              state=success
              description="Dependency repair completed"
            fi
          fi

          AW_STATUS_API_TOKEN="$AW_STATUS_API_TOKEN" node scripts/set-pr-status.ts \
            "$REPOSITORY" \
            "$HEAD_SHA" \
            "$state" \
            "$description" \
            "$RUN_URL"

          [ "$state" = "success" ] || exit 1

          current_head="$(
            GH_TOKEN="$AW_CONTROL_TOKEN" gh api \
              "repos/$REPOSITORY/pulls/$PR_NUMBER" \
              --jq '.head.sha'
          )"
          [[ "$current_head" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Current PR head SHA is invalid." >&2
            exit 65
          }

          event_type="run-pr-governance"
          request_prefix="repair-complete"
          if [ "$current_head" != "$HEAD_SHA" ]; then
            event_type="run-dependency-repair"
            request_prefix="repair-followup"
          fi

          safe_repository="${REPOSITORY//\//-}"
          request_id="$request_prefix:$safe_repository:$PR_NUMBER:${current_head:0:12}"
          payload="$(
            jq -cn \
              --arg event_type "$event_type" \
              --arg request_id "$request_id" \
              --arg repository "$REPOSITORY" \
              --argjson pr_number "$PR_NUMBER" \
              --arg head_sha "$current_head" \
              '{
                event_type: $event_type,
                client_payload: {
                  schema_version: "1",
                  request_id: $request_id,
                  repository: $repository,
                  pr_number: $pr_number,
                  head_sha: $head_sha
                }
              }'
          )"

          GH_TOKEN="$AW_DISPATCH_API_TOKEN" gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/dispatches" \
            --input - <<< "$payload"
