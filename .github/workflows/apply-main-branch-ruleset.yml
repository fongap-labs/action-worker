name: Apply Main Branch Ruleset

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Target managed repository in owner/name format
        required: false
        type: string
      is_dry_run:
        description: Print the managed ruleset without changing repositories
        required: true
        default: true
        type: boolean
  push:
    branches:
      - main
    paths:
      - policies/main-branch-ruleset.json
      - scripts/apply-main-branch-ruleset.ts
      - .github/workflows/apply-main-branch-ruleset.yml

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve managed repositories
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      repositories: ${{ steps.policy.outputs.repositories }}
    steps:
      - name: Check out control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve policy
        id: policy
        env:
          INPUT_REPOSITORY: ${{ inputs.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          managed="$(jq -c '.repositories' policies/main-branch-ruleset.json)"
          if [ -n "$INPUT_REPOSITORY" ]; then
            jq -e --arg repository "$INPUT_REPOSITORY" 'index($repository) != null' <<< "$managed" >/dev/null || {
              echo "::error::Repository is not managed: $INPUT_REPOSITORY" >&2
              exit 65
            }
            managed="$(jq -cn --arg repository "$INPUT_REPOSITORY" '[$repository]')"
          fi
          echo "repositories=$managed" >> "$GITHUB_OUTPUT"

  apply:
    name: Apply main ruleset · ${{ matrix.repository }}
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        repository: ${{ fromJSON(needs.resolve.outputs.repositories) }}

    steps:
      - name: Check out control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Apply managed ruleset
        env:
          GH_TOKEN: ${{ secrets.AW_ADMIN_TOKEN }}
          TARGET_REPOSITORY: ${{ matrix.repository }}
          IS_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.is_dry_run || false }}
        run: node scripts/apply-main-branch-ruleset.ts "$TARGET_REPOSITORY" "$IS_DRY_RUN"
