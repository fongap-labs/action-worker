name: Central CI Intake

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ci-intake.yml
      - scripts/intake-main-ci.ts
      - scripts/repository-policy.ts
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: central-ci-intake
  cancel-in-progress: false

jobs:
  intake:
    name: Reconcile Main CI
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Reconcile main CI
        env:
          AW_REPOSITORY_POLICY: ${{ vars.AW_REPOSITORY_POLICY }}
          AW_CONTROL_TOKEN: ${{ secrets.AW_CONTROL_TOKEN }}
          AW_INGRESS_TOKEN: ${{ github.token }}
          AW_CONTROL_REPOSITORY: ${{ github.repository }}
        run: node scripts/intake-main-ci.ts
