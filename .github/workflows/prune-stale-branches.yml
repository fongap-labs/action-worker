name: Prune Stale Branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prune-stale-branches.yml
      - scripts/prune-stale-branches.ts
      - tests/prune-stale-branches.test.ts
  schedule:
    - cron: "31 5 * * *"
  workflow_dispatch:
    inputs:
      is_dry_run:
        description: Report safe deletions without deleting refs
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: prune-stale-branches
  cancel-in-progress: false

jobs:
  prune:
    name: Prune stale branches
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Prune fully subsumed branches
        env:
          AW_ADMIN_TOKEN: ${{ secrets.AW_ADMIN_TOKEN }}
          AW_REPOSITORY_POLICY: ${{ vars.AW_REPOSITORY_POLICY }}
          BRANCH_PRUNE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.is_dry_run || false }}
        run: node scripts/prune-stale-branches.ts
