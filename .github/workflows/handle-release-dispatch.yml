name: 自动 · 发布分发

on:
  repository_dispatch:
    types: [run-release]

permissions:
  contents: read

# One release per artifact. Release publication never opens PRs, changes main, or updates followers.
concurrency:
  group: release-${{ github.event.client_payload.source_repository }}-${{ github.event.client_payload.source_sha }}-${{ github.event.client_payload.artifact_name }}-${{ github.event.client_payload.artifact_run_id }}
  cancel-in-progress: false

jobs:
  release:
    name: Release Governance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      target_repository: ${{ steps.release.outputs.target_repository }}
      release_key: ${{ steps.release.outputs.release_key }}
      version: ${{ steps.release.outputs.version }}
      npm_asset: ${{ steps.release.outputs.npm_asset }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Resolve release source API scope
        id: status_scope
        env:
          AW_REPOSITORY_POLICY: ${{ vars.AW_REPOSITORY_POLICY }}
          TARGET_REPOSITORY: ${{ github.event.client_payload.source_repository }}
        run: node scripts/resolve-github-api-scope.ts release-source

      - name: Resolve release read repository scope
        id: release_scopes
        env:
          AW_REPOSITORY_POLICY: ${{ vars.AW_REPOSITORY_POLICY }}
        run: node scripts/resolve-release-repositories.ts

      - name: Mint governed release read token
        id: release_read_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.release_scopes.outputs.repositories_csv }}
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read
          permission-issues: read

      - name: Mint release status read token
        id: status_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.status_scope.outputs.owner }}
          repositories: ${{ steps.release_scopes.outputs.repositories_csv }}
          permission-statuses: read

      - name: Download proposed release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ github.event.client_payload.artifact_name }}
          run-id: ${{ github.event.client_payload.artifact_run_id }}
          repository: ${{ github.event.client_payload.artifact_repository }}
          github-token: ${{ steps.release_read_app.outputs.token }}
          path: ${{ runner.temp }}/governed-release-target

      - name: Resolve verified release target scope
        id: release_target
        env:
          AW_CONTROL_TOKEN: ${{ steps.release_read_app.outputs.token }}
          AW_REPOSITORY_POLICY: ${{ vars.AW_REPOSITORY_POLICY }}
          RELEASE_REQUEST_JSON: ${{ toJSON(github.event.client_payload) }}
          RELEASE_ARTIFACT_DIR: ${{ runner.temp }}/governed-release-target
        run: node scripts/resolve-release-target.ts

      - name: Mint target-only release publication token
        id: release_write_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.release_target.outputs.owner }}
          repositories: ${{ steps.release_target.outputs.repository_name }}
          permission-contents: write

      - name: Publish governed release
        id: release
        env:
          AW_CONTROL_TOKEN: ${{ steps.release_read_app.outputs.token }}
          AW_RELEASE_WRITE_API_TOKEN: ${{ steps.release_write_app.outputs.token }}
          AW_RELEASE_TARGET_REPOSITORY: ${{ steps.release_target.outputs.target_repository }}
          AW_STATUS_API_TOKEN: ${{ steps.status_app.outputs.token }}
          AW_STATUS_SIGNING_KEYS: ${{ secrets.AW_STATUS_SIGNING_KEYS }}
          AW_REPOSITORY_POLICY: ${{ vars.AW_REPOSITORY_POLICY }}
          RELEASE_REQUEST_JSON: ${{ toJSON(github.event.client_payload) }}
        run: node scripts/publish-release.ts

  # GitHub Release publication is the boundary. npm distribution is a separate, replayable,
  # provenance-verified workflow; npm failure must never roll back an already published Release.
  npm:
    name: Dispatch verified npm release
    needs: release
    if: needs.release.result == 'success' && needs.release.outputs.npm_asset == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read

    steps:
      - name: Mint npm dispatch token
        id: dispatch_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Dispatch npm publication
        env:
          GH_TOKEN: ${{ steps.dispatch_app.outputs.token }}
          RELEASE_REPOSITORY: ${{ needs.release.outputs.target_repository }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        shell: bash
        run: |
          set -Eeuo pipefail

          payload="$(jq -cn \
            --arg repository "$RELEASE_REPOSITORY" \
            --arg tag "$RELEASE_TAG" \
            '{event_type:"run-npm-republish",client_payload:{repository:$repository,tag:$tag}}')"
          gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" --input - <<< "$payload"
