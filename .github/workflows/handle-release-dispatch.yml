name: Handle Release Dispatch

on:
  repository_dispatch:
    types: [run-release]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.client_payload.source_repository }}-${{ github.event.client_payload.source_sha }}-${{ github.event.client_payload.artifact_run_id }}
  cancel-in-progress: false

jobs:
  release:
    name: Release Governance
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Publish governed release
        id: release
        env:
          AW_CONTROL_TOKEN: ${{ secrets.AW_CONTROL_TOKEN }}
          AW_REPOSITORY_POLICY: ${{ vars.AW_REPOSITORY_POLICY }}
          RELEASE_REQUEST_JSON: ${{ toJSON(github.event.client_payload) }}
        run: node scripts/publish-release.ts
