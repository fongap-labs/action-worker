name: Handle Release Dispatch

on:
  repository_dispatch:
    types: [run-release]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.client_payload.repository }}-${{ github.event.client_payload.source_run_id }}
  cancel-in-progress: false

jobs:
  release:
    name: Release Governance
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Validate central credentials
        env:
          GITHUB_CONTROL_TOKEN: ${{ secrets.GITHUB_CONTROL_TOKEN }}
          GITHUB_RELEASE_TOKEN: ${{ secrets.GITHUB_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [ -n "$GITHUB_CONTROL_TOKEN" ] || {
            echo "::error::GITHUB_CONTROL_TOKEN is not configured." >&2
            exit 77
          }
          [ -n "$GITHUB_RELEASE_TOKEN" ] || {
            echo "::error::GITHUB_RELEASE_TOKEN is not configured." >&2
            exit 77
          }

      - name: Materialize release request
        env:
          RELEASE_REQUEST_JSON: ${{ toJSON(github.event.client_payload) }}
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '%s\n' "$RELEASE_REQUEST_JSON" > "$RUNNER_TEMP/release-request.json"

      - name: Publish governed release
        id: release
        env:
          GITHUB_CONTROL_TOKEN: ${{ secrets.GITHUB_CONTROL_TOKEN }}
          GITHUB_RELEASE_TOKEN: ${{ secrets.GITHUB_RELEASE_TOKEN }}
          RELEASE_SOURCE_ALLOWLIST: ${{ vars.RELEASE_SOURCE_ALLOWLIST }}
          RELEASE_TARGET_ALLOWLIST: ${{ vars.RELEASE_TARGET_ALLOWLIST }}
        shell: bash
        run: node scripts/publish-release.ts "$RUNNER_TEMP/release-request.json"
