name: 自动 · 发布分发

on:
  repository_dispatch:
    types: [run-release]

permissions:
  contents: read

# One release per artifact. GitHub keeps only one pending run per group and cancels the others, so a
# group shared by every tool of one sync run cancelled all but two of them. Releases of different
# artifacts do not share a group; the changelog release pull request resolves any clash itself.
concurrency:
  group: release-${{ github.event.client_payload.source_repository }}-${{ github.event.client_payload.source_sha }}-${{ github.event.client_payload.artifact_name }}-${{ github.event.client_payload.artifact_run_id }}
  cancel-in-progress: false

jobs:
  release:
    name: Release Governance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      target_repository: ${{ steps.release.outputs.target_repository }}
      release_key: ${{ steps.release.outputs.release_key }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Publish governed release
        id: release
        env:
          AW_CONTROL_TOKEN: ${{ secrets.AW_CONTROL_TOKEN }}
          AW_REPOSITORY_POLICY: ${{ vars.AW_REPOSITORY_POLICY }}
          RELEASE_REQUEST_JSON: ${{ toJSON(github.event.client_payload) }}
        run: node scripts/publish-release.ts

  # Control domain. Moves the pins of every follower of the published release to its tag, one commit
  # per follower on aw/follow/<product>, and opens or finds the pull request for that branch.
  # A beta is a pre-release: followers keep pointing at the last formal release, so the job is
  # skipped for any version that carries a pre-release part (X.Y.Z-beta.N).
  follow:
    name: Dispatch follow updates
    needs: release
    if: needs.release.result == 'success' && !contains(needs.release.outputs.version, '-')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      lock_followers: ${{ steps.dispatch.outputs.lock_followers }}

    steps:
      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # The TOML parser is a pinned runtime dependency; the job installs only production dependencies
      # and runs no install scripts.
      - name: Install runtime dependencies
        run: npm ci --omit=dev --ignore-scripts

      - name: Move follower pins to the release
        id: dispatch
        env:
          AW_CONTROL_TOKEN: ${{ secrets.AW_CONTROL_TOKEN }}
          AW_REPOSITORY_POLICY: ${{ vars.AW_REPOSITORY_POLICY }}
          AW_CONTROL_REPOSITORY: ${{ github.repository }}
          FOLLOW_UPSTREAM_REPOSITORY: ${{ needs.release.outputs.target_repository }}
          FOLLOW_RELEASE_KEY: ${{ needs.release.outputs.release_key }}
          FOLLOW_RELEASE_VERSION: ${{ needs.release.outputs.version }}
          FOLLOW_RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: node scripts/dispatch-follow-updates.ts

  # Sandbox. Runs the follower's own uv lock with no central credential. The public target is read
  # with the run's read-only token; a private target gets the read-only checkout token only.
  follow-lock:
    name: Refresh follower uv.lock
    needs: follow
    if: needs.follow.outputs.lock_followers != '[]' && needs.follow.outputs.lock_followers != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        follower: ${{ fromJSON(needs.follow.outputs.lock_followers) }}
    permissions:
      contents: read

    steps:
      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: aw
          persist-credentials: false

      - name: Checkout follower branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.follower.repository }}
          ref: ${{ matrix.follower.head_sha }}
          token: ${{ matrix.follower.is_private == true && secrets.AW_CHECKOUT_TOKEN || github.token }}
          path: target
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install lock script dependencies
        working-directory: aw
        run: npm ci --omit=dev --ignore-scripts

      - name: Lock and write the uv.lock patch
        working-directory: target
        env:
          FOLLOW_PROJECT_DIR: ${{ matrix.follower.project_dir }}
          FOLLOW_SLUG: ${{ matrix.follower.slug }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/follow-lock/$FOLLOW_SLUG"
          node ../aw/scripts/lock-follow.ts "$FOLLOW_PROJECT_DIR" "$RUNNER_TEMP/follow-lock/$FOLLOW_SLUG/uv-lock.patch"

      - name: Record the follow request
        env:
          FOLLOW_SLUG: ${{ matrix.follower.slug }}
          FOLLOW_REQUEST_JSON: ${{ toJSON(matrix.follower) }}
        run: |
          set -Eeuo pipefail
          jq -c '{repository, branch, head_sha, project_dir}' <<< "$FOLLOW_REQUEST_JSON" \
            > "$RUNNER_TEMP/follow-lock/$FOLLOW_SLUG/follow-lock.json"

      - name: Upload the uv.lock patch
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: follow-lock-${{ matrix.follower.slug }}
          path: ${{ runner.temp }}/follow-lock/${{ matrix.follower.slug }}
          if-no-files-found: error
          retention-days: 3

  # Control domain. Checks each patch is a plain change to that follower's uv.lock and that its branch
  # has not moved, applies it to the current file in a scratch directory, and commits that one file.
  follow-commit:
    name: Commit follower uv.lock
    needs: [follow, follow-lock]
    if: >-
      always() && needs.follow.result == 'success' && needs.follow-lock.result == 'success' &&
      needs.follow.outputs.lock_followers != '[]' && needs.follow.outputs.lock_followers != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install runtime dependencies
        run: npm ci --omit=dev --ignore-scripts

      - name: Download the uv.lock patches
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: follow-lock-*
          path: follow-lock

      - name: Commit the uv.lock changes
        env:
          AW_CONTROL_TOKEN: ${{ secrets.AW_CONTROL_TOKEN }}
          FOLLOW_LOCK_DIR: follow-lock
        run: node scripts/commit-follow-lock.ts
