name: 自动 · 发布分发

on:
  repository_dispatch:
    types: [run-release]

permissions:
  contents: read

# Serialize all release requests for the same product, even across different build runs.
# A DSH npm package must be published and registry-verified before the formal tag.
concurrency:
  group: release-${{ github.event.client_payload.source_repository }}-${{ github.event.client_payload.artifact_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Release Governance
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      target_repository: ${{ steps.release.outputs.target_repository }}
      release_key: ${{ steps.release.outputs.release_key }}
      version: ${{ steps.release.outputs.version }}
      is_prerelease: ${{ steps.release.outputs.is_prerelease }}
      npm_asset: ${{ steps.release.outputs.npm_asset }}

    steps:
      - name: Mask release/deploy source identities before checkout or token use
        shell: bash
        run: |
          set -Eeuo pipefail
          # Only inspect the local event file; never interpolate untrusted payload values.
          jq -r '
            (.client_payload // .inputs // {}) |
            [.head_sha, .base_sha, .merge_sha, .source_sha] |
            .[]? | select(type == "string" and length > 0 and length <= 256 and (test("[\r\n]") | not))
          ' "$GITHUB_EVENT_PATH" | while IFS= read -r identity; do
            printf '::add-mask::%s\n' "$identity"
          done

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Resolve release source API scope
        id: status_scope
        env:
          TARGET_REPOSITORY: ${{ github.event.client_payload.source_repository }}
        run: node scripts/resolve-github-api-scope.ts release-source

      - name: Resolve release read repository scope
        id: release_scopes
        run: node scripts/resolve-release-repositories.ts

      - name: Mint governed release read token
        id: release_read_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.release_scopes.outputs.repositories_csv }}
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read
          permission-issues: read

      - name: Mint release status read token
        id: status_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.status_scope.outputs.owner }}
          repositories: ${{ steps.release_scopes.outputs.repositories_csv }}
          permission-statuses: read

      - name: Download proposed release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ github.event.client_payload.artifact_name }}
          run-id: ${{ github.event.client_payload.artifact_run_id }}
          repository: ${{ github.event.client_payload.artifact_repository }}
          github-token: ${{ steps.release_read_app.outputs.token }}
          path: ${{ runner.temp }}/governed-release-target

      - name: Resolve verified release target scope
        id: release_target
        env:
          AW_CONTROL_TOKEN: ${{ steps.release_read_app.outputs.token }}
          AW_STATUS_API_TOKEN: ${{ steps.status_app.outputs.token }}
          AW_STATUS_KEYRING: ${{ secrets.AW_STATUS_KEYRING }}
          RELEASE_REQUEST_JSON: ${{ toJSON(github.event.client_payload) }}
          RELEASE_ARTIFACT_DIR: ${{ runner.temp }}/governed-release-target
        run: node scripts/resolve-release-target.ts

      - name: Mint automatic npm workflow dispatch token
        id: npm_dispatch_app
        if: steps.release_target.outputs.npm_required == 'true'
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: action-worker
          permission-contents: write
          permission-actions: read

      - name: Mint target-only release publication token
        if: steps.release_target.outputs.source_branch == 'main'
        id: release_write_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.release_target.outputs.owner }}
          repositories: ${{ steps.release_target.outputs.repository_name }}
          permission-contents: write

      - name: Verify independent Beta App identity
        if: steps.release_target.outputs.source_branch == 'dev'
        env:
          BETA_CLIENT_ID: ${{ vars.AW_BETA_RELEASE_APP_CLIENT_ID }}
          MAIN_CLIENT_ID: ${{ vars.AW_APP_CLIENT_ID }}
        run: test -n "$BETA_CLIENT_ID" && test "$BETA_CLIENT_ID" != "$MAIN_CLIENT_ID"

      - name: Mint Beta-only release publication token
        if: steps.release_target.outputs.source_branch == 'dev'
        id: beta_write_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_BETA_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_BETA_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ steps.release_target.outputs.owner }}
          repositories: ${{ steps.release_target.outputs.repository_name }}
          permission-contents: write

      - name: Publish governed release
        id: release
        env:
          AW_CONTROL_TOKEN: ${{ steps.release_read_app.outputs.token }}
          AW_RELEASE_WRITE_API_TOKEN: ${{ steps.release_write_app.outputs.token }}
          AW_BETA_RELEASE_WRITE_API_TOKEN: ${{ steps.beta_write_app.outputs.token }}
          AW_RELEASE_TARGET_REPOSITORY: ${{ steps.release_target.outputs.target_repository }}
          # Only validated stable shared-plugin releases can dispatch the separate npm workflow.
          AW_NPM_DISPATCH_TOKEN: ${{ steps.npm_dispatch_app.outputs.token }}
          AW_STATUS_API_TOKEN: ${{ steps.status_app.outputs.token }}
          AW_STATUS_KEYRING: ${{ secrets.AW_STATUS_KEYRING }}
          RELEASE_REQUEST_JSON: ${{ toJSON(github.event.client_payload) }}
        run: node scripts/publish-release.ts
