name: 自动 · Delta 上游镜像

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-delta-upstream.yml
      - scripts/sync-delta-upstream.ts
  schedule:
    - cron: "29 3 * * *"

permissions:
  contents: read

concurrency:
  group: delta-upstream-mirror
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror official Harness to isolated Delta branch
    if: github.repository == 'fongap-labs/action-worker'
    environment:
      name: admin-ops
      deployment: false
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout trusted control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install pinned workflow parser
        run: npm ci --ignore-scripts

      - name: Mint Delta-only branch writer
        id: writer
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: delta
          permission-contents: write
          permission-workflows: write

      - name: Sync upstream to upstream/deepseek-harness only
        env:
          AW_DELTA_MIRROR_TOKEN: ${{ steps.writer.outputs.token }}
        run: node scripts/sync-delta-upstream.ts
