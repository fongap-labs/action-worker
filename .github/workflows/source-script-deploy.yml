name: Source Script Deploy

on:
  repository_dispatch:
    types: [run-source-script-deploy]
  workflow_dispatch:
    inputs:
      source_repository:
        description: Managed source repository
        required: true
        type: string
      source_sha:
        description: Exact 40-character source commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: source-script-deploy-${{ github.event.client_payload.source_repository || inputs.source_repository || 'manual' }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate source-script deploy request
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source_repository: ${{ steps.source.outputs.source_repository }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      runner_labels_json: ${{ steps.source.outputs.runner_labels_json }}
      environment: ${{ steps.source.outputs.environment }}
      entrypoint: ${{ steps.source.outputs.entrypoint }}

    steps:
      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Resolve repository dispatch request
        id: dispatch_request
        if: github.event_name == 'repository_dispatch'
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        shell: bash
        run: |
          set -Eeuo pipefail
          request="$(jq -c . <<< "$PAYLOAD")"
          echo "request_json=$request" >> "$GITHUB_OUTPUT"

      - name: Resolve manual deploy request
        id: manual_request
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$SOURCE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          request="$(
            jq -cn               --arg request_id "manual-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"               --arg source_repository "$SOURCE_REPOSITORY"               --arg source_sha "$SOURCE_SHA"               '{
                schema_version: "1",
                request_id: $request_id,
                source_repository: $source_repository,
                source_sha: $source_sha
              }'
          )"
          echo "request_json=$request" >> "$GITHUB_OUTPUT"

      - name: Validate deploy source
        id: source
        env:
          AW_CONTROL_TOKEN: ${{ secrets.AW_CONTROL_TOKEN }}
          AW_REPOSITORY_POLICY: ${{ vars.AW_REPOSITORY_POLICY }}
          DEPLOY_REQUEST_JSON: ${{ steps.dispatch_request.outputs.request_json || steps.manual_request.outputs.request_json }}
        run: node scripts/validate-deploy-source.ts source-script true policies/runner.json

  deploy:
    name: Execute source-script deploy
    needs: prepare
    runs-on: ${{ fromJSON(needs.prepare.outputs.runner_labels_json) }}
    timeout-minutes: 30
    env:
      SERVER_EDGE_TRANSPORT: ${{ vars.SERVER_EDGE_TRANSPORT }}
      SERVER_EDGE_TARGET_HOST: ${{ vars.SERVER_EDGE_TARGET_HOST }}
      SERVER_EDGE_TARGET_USER: ${{ vars.SERVER_EDGE_TARGET_USER }}
      SERVER_EDGE_TARGET_PORT: ${{ vars.SERVER_EDGE_TARGET_PORT }}
      SERVER_EDGE_TARGET_ROOT: ${{ vars.SERVER_EDGE_TARGET_ROOT }}
      SERVER_EDGE_PROFILE: ${{ vars.SERVER_EDGE_PROFILE }}
      SERVER_EDGE_SSH_KNOWN_HOSTS: ${{ vars.SERVER_EDGE_SSH_KNOWN_HOSTS }}
      SERVER_EDGE_CONFIG_BUNDLE: ${{ vars.SERVER_EDGE_CONFIG_BUNDLE }}
      SERVER_EDGE_SSH_PRIVATE_KEY: ${{ secrets.SERVER_EDGE_SSH_PRIVATE_KEY }}
      SERVER_EDGE_SECRET_BUNDLE: ${{ secrets.SERVER_EDGE_SECRET_BUNDLE }}
      SERVER_EDGE_TAILSCALE_AUTH_KEY: ${{ secrets.SERVER_EDGE_TAILSCALE_AUTH_KEY }}

    steps:
      - name: Checkout deploy source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.prepare.outputs.source_repository }}
          ref: ${{ needs.prepare.outputs.source_sha }}
          token: ${{ secrets.AW_CONTROL_TOKEN }}
          path: target
          persist-credentials: false

      - name: Validate source-script adapter inputs
        shell: bash
        run: |
          set -Eeuo pipefail

          missing=()
          require() {
            local name="$1"
            [ -n "${!name:-}" ] || missing+=("$name")
          }

          require SERVER_EDGE_TARGET_HOST
          require SERVER_EDGE_TARGET_USER
          require SERVER_EDGE_CONFIG_BUNDLE
          require SERVER_EDGE_SECRET_BUNDLE

          transport="${SERVER_EDGE_TRANSPORT:-ssh}"
          case "$transport" in
            ssh)
              require SERVER_EDGE_SSH_PRIVATE_KEY
              require SERVER_EDGE_SSH_KNOWN_HOSTS
              ;;
            tailscale)
              require SERVER_EDGE_TAILSCALE_AUTH_KEY
              ;;
            *)
              echo "::error::SERVER_EDGE_TRANSPORT must be ssh or tailscale." >&2
              exit 2
              ;;
          esac

          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing source-script deployment configuration: %s
' "$(IFS=,; echo "${missing[*]}")" >&2
            exit 77
          fi

      - name: Connect deployment runner to Tailnet
        if: env.SERVER_EDGE_TRANSPORT == 'tailscale'
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          authkey: ${{ secrets.SERVER_EDGE_TAILSCALE_AUTH_KEY }}
          hostname: source-script-deploy-${{ github.run_id }}
          args: --accept-dns=false

      - name: Execute source-owned deploy entrypoint
        working-directory: target
        env:
          DEPLOY_ENTRYPOINT: ${{ needs.prepare.outputs.entrypoint }}
          EDGE_ENVIRONMENT: ${{ needs.prepare.outputs.environment }}
          EDGE_REF: ${{ needs.prepare.outputs.source_sha }}
          EDGE_TRANSPORT: ${{ env.SERVER_EDGE_TRANSPORT }}
          EDGE_TARGET_HOST: ${{ env.SERVER_EDGE_TARGET_HOST }}
          EDGE_TARGET_USER: ${{ env.SERVER_EDGE_TARGET_USER }}
          EDGE_TARGET_PORT: ${{ env.SERVER_EDGE_TARGET_PORT }}
          EDGE_TARGET_ROOT: ${{ env.SERVER_EDGE_TARGET_ROOT }}
          EDGE_PROFILE: ${{ env.SERVER_EDGE_PROFILE }}
          SSH_KNOWN_HOSTS: ${{ env.SERVER_EDGE_SSH_KNOWN_HOSTS }}
          EDGE_CONFIG_BUNDLE: ${{ env.SERVER_EDGE_CONFIG_BUNDLE }}
          SSH_PRIVATE_KEY: ${{ env.SERVER_EDGE_SSH_PRIVATE_KEY }}
          EDGE_SECRET_BUNDLE: ${{ env.SERVER_EDGE_SECRET_BUNDLE }}
        shell: bash
        run: |
          set -Eeuo pipefail
          bash "$DEPLOY_ENTRYPOINT"

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Source Script central deployment"
            echo
            echo "- Source: ${{ needs.prepare.outputs.source_repository }}@${{ needs.prepare.outputs.source_sha }}"
            echo "- Environment: ${{ needs.prepare.outputs.environment }}"
            echo "- Entrypoint: ${{ needs.prepare.outputs.entrypoint }}"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
