name: 手动 · 发布应用

on:
  repository_dispatch:
    types: [run-release-build]
  workflow_dispatch:
    inputs:
      source_repository:
        description: 源仓库（owner/name 形式，例如 your-org/your-app）
        required: true
        type: string
      requested_version:
        description: 发布版本号（稳定语义化版本，如 1.2.3，可带 v 前缀）
        required: true
        type: string
      product:
        description: 产品目录（位于源仓库 projects/ 下；多产品必填，单产品可留空）
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.event.client_payload.source_repository || inputs.source_repository }}${{ (github.event.client_payload.product || inputs.product) && format('-{0}', github.event.client_payload.product || inputs.product) || '' }}-${{ github.event.client_payload.source_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release build
    runs-on: ubuntu-24.04
    # The request validation waits up to 20 minutes for the central CI verdict of the source.
    timeout-minutes: 30
    # Asking for central CI sends an event to this repository, which needs contents: write.
    permissions:
      contents: write

    outputs:
      source_repository: ${{ steps.request.outputs.source_repository }}
      source_sha: ${{ steps.request.outputs.source_sha }}
      version: ${{ steps.request.outputs.version }}
      artifact_name: ${{ steps.request.outputs.artifact_name }}
      target_repository: ${{ steps.request.outputs.target_repository }}
      matrix: ${{ steps.request.outputs.matrix }}
      node_version_file: ${{ steps.request.outputs.node_version_file }}
      python_version_file: ${{ steps.request.outputs.python_version_file }}
      sbom_asset: ${{ steps.request.outputs.sbom_asset }}
      manifest_path: ${{ steps.request.outputs.manifest_path }}
      product_root: ${{ steps.request.outputs.product_root }}

    steps:
      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Resolve release build ingress
        id: ingress
        env:
          AW_CONTROL_TOKEN: ${{ secrets.AW_CONTROL_TOKEN }}
          AW_REPOSITORY_POLICY: ${{ vars.AW_REPOSITORY_POLICY }}
          RELEASE_DISPATCH_JSON: ${{ toJSON(github.event.client_payload) }}
          RELEASE_SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          RELEASE_REQUESTED_VERSION: ${{ inputs.requested_version }}
          RELEASE_PRODUCT: ${{ inputs.product }}
        run: node scripts/resolve-release-build-ingress.ts

      # Intake may not have reached this source yet, so a release asks for central CI on its own
      # source now; the validation below waits for the verdict.
      - name: Request central CI for the source
        env:
          AW_REPOSITORY_POLICY: ${{ vars.AW_REPOSITORY_POLICY }}
          AW_CONTROL_TOKEN: ${{ secrets.AW_CONTROL_TOKEN }}
          AW_INGRESS_TOKEN: ${{ github.token }}
          AW_CONTROL_REPOSITORY: ${{ github.repository }}
          AW_CI_INTAKE_REPOSITORY: ${{ steps.ingress.outputs.source_repository }}
        run: node scripts/intake-main-ci.ts

      # The validation accepts only a main SHA attested as a merged pull request. Attest it now, the
      # same way Intake does, so the release does not wait for the next Intake run. The validation
      # stays the authority and reports an untrusted write.
      - name: Attest the source main write
        continue-on-error: true
        env:
          AW_CONTROL_TOKEN: ${{ secrets.AW_CONTROL_TOKEN }}
          AW_REPOSITORY_POLICY: ${{ vars.AW_REPOSITORY_POLICY }}
          MAIN_WRITE_AUDIT_REPOSITORY: ${{ steps.ingress.outputs.source_repository }}
          MAIN_WRITE_AUDIT_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/audit-main-writes.ts

      - name: Validate release build request
        id: request
        env:
          AW_CONTROL_TOKEN: ${{ secrets.AW_CONTROL_TOKEN }}
          AW_REPOSITORY_POLICY: ${{ vars.AW_REPOSITORY_POLICY }}
          RELEASE_BUILD_REQUEST_JSON: ${{ steps.ingress.outputs.request_json }}
        run: node scripts/validate-release-build-request.ts policies/runner.json

  build-windows:
    name: Build release / ${{ matrix.id }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ fromJSON(matrix.runner_labels_json) }}
    timeout-minutes: 90

    permissions:
      contents: read
      attestations: write
      id-token: write

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.prepare.outputs.source_repository }}
          ref: ${{ needs.prepare.outputs.source_sha }}
          token: ${{ secrets.AW_CONTROL_TOKEN }}
          path: source
          persist-credentials: false

      - name: Setup Python
        if: ${{ needs.prepare.outputs.python_version_file != '' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: source/${{ needs.prepare.outputs.python_version_file }}

      - name: Setup Node
        if: ${{ needs.prepare.outputs.node_version_file != '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: source/${{ needs.prepare.outputs.node_version_file }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Run repository release build
        shell: pwsh
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_SCRIPT: ${{ matrix.script }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_OUTPUT_DIR: ${{ runner.temp }}\release-build
          RELEASE_PRODUCT_RELATIVE_ROOT: ${{ needs.prepare.outputs.product_root }}
        run: |
          $ErrorActionPreference = "Stop"
          $script = Join-Path "$PWD\source" $env:RELEASE_SCRIPT
          if (-not (Test-Path -LiteralPath $script -PathType Leaf)) {
            throw "release build script not found: $script"
          }
          # The product root is the build root from the release manifest; the empty root is the repository root.
          $relativeRoot = if ($env:RELEASE_PRODUCT_RELATIVE_ROOT) { $env:RELEASE_PRODUCT_RELATIVE_ROOT } else { "." }
          $env:RELEASE_PRODUCT_ROOT = [System.IO.Path]::GetFullPath((Join-Path "$PWD\source" $relativeRoot))
          if (-not (Test-Path -LiteralPath $env:RELEASE_PRODUCT_ROOT -PathType Container)) {
            throw "release product root not found: $env:RELEASE_PRODUCT_ROOT"
          }
          & $script -Target $env:RELEASE_TARGET -Version $env:RELEASE_VERSION -OutputDir $env:RELEASE_OUTPUT_DIR
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Attest build provenance
        if: ${{ matrix.attest_asset != '' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}\release-build\${{ matrix.attest_asset }}

      - name: Upload build assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build-${{ matrix.id }}
          path: ${{ runner.temp }}\release-build\*
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package governed release
    needs:
      - prepare
      - build-windows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Sending the run-release event needs contents: write.
    permissions:
      contents: write

    steps:
      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Download build assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-build-*
          path: ${{ runner.temp }}/release-package
          merge-multiple: true

      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.prepare.outputs.source_repository }}
          ref: ${{ needs.prepare.outputs.source_sha }}
          token: ${{ secrets.AW_CONTROL_TOKEN }}
          path: source
          persist-credentials: false

      - name: Generate release CycloneDX SBOM
        if: ${{ needs.prepare.outputs.sbom_asset != '' }}
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: source
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/release-package/${{ needs.prepare.outputs.sbom_asset }}
          artifact-name: release-build-sbom
          upload-artifact: false
          upload-release-assets: false

      - name: Build manifest and provenance
        env:
          SOURCE_REPOSITORY: ${{ needs.prepare.outputs.source_repository }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_MANIFEST_PATH: ${{ needs.prepare.outputs.manifest_path }}
        run: |
          node scripts/package-release-build.ts \
            "$GITHUB_WORKSPACE/source/$RELEASE_MANIFEST_PATH" \
            "$SOURCE_REPOSITORY" \
            "$SOURCE_SHA" \
            "$RELEASE_VERSION" \
            "$RUNNER_TEMP/release-package"

      - name: Upload governed release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: ${{ runner.temp }}/release-package/*
          if-no-files-found: error
          retention-days: 7

      - name: Dispatch Release Governance
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ needs.prepare.outputs.source_repository }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          ARTIFACT_NAME: ${{ needs.prepare.outputs.artifact_name }}
        shell: bash
        run: |
          set -Eeuo pipefail

          payload="$(
            jq -cn \
              --arg request_id "release-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --arg source_repository "$SOURCE_REPOSITORY" \
              --arg source_sha "$SOURCE_SHA" \
              --arg artifact_repository "$GITHUB_REPOSITORY" \
              --argjson artifact_run_id "$GITHUB_RUN_ID" \
              --arg artifact_name "$ARTIFACT_NAME" \
              '{
                event_type: "run-release",
                client_payload: {
                  schema_version: "2",
                  request_id: $request_id,
                  source_repository: $source_repository,
                  source_sha: $source_sha,
                  artifact_repository: $artifact_repository,
                  artifact_run_id: $artifact_run_id,
                  artifact_name: $artifact_name
                }
              }'
          )"

          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/dispatches" \
            --input - <<< "$payload"
