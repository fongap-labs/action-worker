name: Handle Central CI

on:
  repository_dispatch:
    types: [run-central-ci]

permissions:
  contents: read

concurrency:
  group: central-ci-${{ github.event.client_payload.repository }}-${{ github.event.client_payload.pr_number }}
  cancel-in-progress: true

jobs:
  linux:
    if: ${{ contains(fromJSON('["fongap-labs/delta-suite","fongap-labs/app-source","fongap-labs/internal-vault"]'), github.event.client_payload.repository) }}
    name: Central CI Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout target PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.client_payload.repository }}
          ref: ${{ github.event.client_payload.head_sha }}
          token: ${{ secrets.AW_CONTROL_TOKEN }}
          path: target
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout trusted CI control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.client_payload.repository }}
          ref: main
          token: ${{ secrets.AW_CONTROL_TOKEN }}
          path: ci-control
          fetch-depth: 1
          persist-credentials: false

      - name: Run trusted Linux CI
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.client_payload.head_sha }}
          TARGET_REPOSITORY: ${{ github.event.client_payload.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail

          actual_head="$(git -C "$GITHUB_WORKSPACE/target" rev-parse HEAD)"
          if [ "$actual_head" != "$EXPECTED_HEAD_SHA" ]; then
            echo "::error::Central CI checked out an unexpected target revision."
            exit 1
          fi

          log="$RUNNER_TEMP/central-ci-linux.log"
          set +e
          bash "$GITHUB_WORKSPACE/ci-control/.github/central-ci/run-linux.sh"             "$GITHUB_WORKSPACE/target" >"$log" 2>&1
          code=$?
          set -e

          if [ "$code" -ne 0 ]; then
            echo "::error::Central Linux CI failed for $TARGET_REPOSITORY. Detailed output is suppressed because the target repository is private."
            exit "$code"
          fi

          echo "Central Linux CI passed for $TARGET_REPOSITORY."

  windows:
    if: ${{ github.event.client_payload.repository == 'fongap-labs/app-source' }}
    name: Central CI Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout target PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.client_payload.repository }}
          ref: ${{ github.event.client_payload.head_sha }}
          token: ${{ secrets.AW_CONTROL_TOKEN }}
          path: target
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout trusted CI control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.client_payload.repository }}
          ref: main
          token: ${{ secrets.AW_CONTROL_TOKEN }}
          path: ci-control
          fetch-depth: 1
          persist-credentials: false

      - name: Run trusted Windows CI
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.client_payload.head_sha }}
          TARGET_REPOSITORY: ${{ github.event.client_payload.repository }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $actualHead = (git -C "$env:GITHUB_WORKSPACE\target" rev-parse HEAD).Trim()
          if ($actualHead -ne $env:EXPECTED_HEAD_SHA) {
            Write-Error "Central CI checked out an unexpected target revision."
            exit 1
          }

          $log = Join-Path $env:RUNNER_TEMP "central-ci-windows.log"
          try {
            & "$env:GITHUB_WORKSPACE\ci-control\.github\central-ci\run-windows.ps1" -TargetRoot "$env:GITHUB_WORKSPACE\target" *> $log
            if ($LASTEXITCODE -ne 0) {
              throw "Central Windows CI returned exit code $LASTEXITCODE."
            }
          }
          catch {
            Write-Error "Central Windows CI failed for $env:TARGET_REPOSITORY. Detailed output is suppressed because the target repository is private."
            exit 1
          }

          Write-Host "Central Windows CI passed for $env:TARGET_REPOSITORY."

  publish:
    name: Publish CI Evidence
    if: ${{ always() }}
    needs:
      - linux
      - windows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Publish target commit status
        env:
          GH_TOKEN: ${{ secrets.AW_CONTROL_TOKEN }}
          TARGET_REPOSITORY: ${{ github.event.client_payload.repository }}
          HEAD_SHA: ${{ github.event.client_payload.head_sha }}
          LINUX_RESULT: ${{ needs.linux.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -Eeuo pipefail

          state="failure"
          description="Central CI failed in Action Worker"
          if [ "$LINUX_RESULT" = "success" ] && { [ "$WINDOWS_RESULT" = "success" ] || [ "$WINDOWS_RESULT" = "skipped" ]; }; then
            state="success"
            description="Central CI passed in Action Worker"
          fi

          for context in "CI Evidence" "ci-evidence" "validate-merge"; do
            payload="$(jq -cn               --arg state "$state"               --arg context "$context"               --arg description "$description"               --arg target_url "$RUN_URL"               '{state:$state,context:$context,description:$description,target_url:$target_url}')"

            curl -fsS               --request POST               --header "Authorization: Bearer $GH_TOKEN"               --header "Accept: application/vnd.github+json"               --header "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/$TARGET_REPOSITORY/statuses/$HEAD_SHA"               --data "$payload" >/dev/null
          done

          if [ "$state" != "success" ]; then
            exit 1
          fi
