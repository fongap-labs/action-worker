name: 校验源代码策略

on:
  workflow_call:
    inputs:
      target_sha:
        description: 目标 Commit SHA；留空使用当前 SHA
        required: false
        type: string
        default: ""
      ci_workflow:
        description: 必须已成功完成的 CI workflow 文件名
        required: false
        type: string
        default: ci.yml
      should_match_default:
        description: 是否要求目标 Commit 为默认分支当前 HEAD
        required: false
        type: boolean
        default: true
    outputs:
      target_sha:
        description: 已验证目标 Commit SHA
        value: ${{ jobs.policy.outputs.target_sha }}
      default_branch:
        description: 默认分支
        value: ${{ jobs.policy.outputs.default_branch }}
      ci_run_id:
        description: 已验证成功的 CI Run ID
        value: ${{ jobs.policy.outputs.ci_run_id }}

permissions:
  contents: read
  actions: read

jobs:
  policy:
    name: 源代码准入门禁
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      target_sha: ${{ steps.validate.outputs.target_sha }}
      default_branch: ${{ steps.validate.outputs.default_branch }}
      ci_run_id: ${{ steps.validate.outputs.ci_run_id }}

    steps:
      - name: 校验目标 Commit 与 CI
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.target_sha }}
          CI_WORKFLOW: ${{ inputs.ci_workflow }}
          SHOULD_MATCH_DEFAULT: ${{ inputs.should_match_default }}
        shell: bash
        run: |
          set -Eeuo pipefail

          target="${TARGET_SHA:-$GITHUB_SHA}"

          if [ "$SHOULD_MATCH_DEFAULT" != "true" ] && ! [[ "$target" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::非默认 HEAD 部署必须使用不可变的 40 位 Commit SHA。" >&2
            exit 64
          fi

          resolved_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${target}" --jq '.sha')"
          default_branch="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')"
          default_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${default_branch}" --jq '.sha')"

          if [ "$SHOULD_MATCH_DEFAULT" = "true" ] && [ "$resolved_sha" != "$default_sha" ]; then
            echo "::error::目标必须是默认分支当前 HEAD：expected=$default_sha actual=$resolved_sha。" >&2
            exit 65
          fi

          runs="$(
            gh run list               --repo "$GITHUB_REPOSITORY"               --workflow "$CI_WORKFLOW"               --commit "$resolved_sha"               --limit 20               --json status,conclusion,headSha,databaseId
          )"

          ci_run_id="$(
            jq -r --arg sha "$resolved_sha" '
              [
                .[]
                | select(
                    .headSha == $sha
                    and .status == "completed"
                    and .conclusion == "success"
                  )
              ]
              | sort_by(.databaseId)
              | reverse
              | .[0].databaseId // empty
            ' <<< "$runs"
          )"

          [ -n "$ci_run_id" ] || {
            echo "::error::未找到目标 Commit 的成功 CI：workflow=$CI_WORKFLOW sha=$resolved_sha。" >&2
            exit 1
          }

          {
            echo "target_sha=$resolved_sha"
            echo "default_branch=$default_branch"
            echo "ci_run_id=$ci_run_id"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Source Gate"
            echo
            echo "- Commit: $resolved_sha"
            echo "- CI: $CI_WORKFLOW"
            echo "- CI Run: $ci_run_id"
            echo "- Default branch: $default_branch"
            echo "- Require default HEAD: $SHOULD_MATCH_DEFAULT"
          } >> "$GITHUB_STEP_SUMMARY"
