name: Validate Source Policy

on:
  workflow_call:
    inputs:
      target_sha:
        description: Target commit SHA; empty defaults to current SHA
        required: false
        type: string
        default: ""
      ci_workflow:
        description: CI workflow file name that must have completed successfully
        required: false
        type: string
        default: ci.yml
      require_default_head:
        description: Whether the target commit must be the default branch HEAD
        required: false
        type: boolean
        default: true
    outputs:
      target_sha:
        description: Validated target commit SHA
        value: ${{ jobs.policy.outputs.target_sha }}
      default_branch:
        description: Default branch
        value: ${{ jobs.policy.outputs.default_branch }}
      ci_run_id:
        description: Validated successful CI Run ID
        value: ${{ jobs.policy.outputs.ci_run_id }}

permissions:
  contents: read
  actions: read

jobs:
  policy:
    name: Source admission gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      target_sha: ${{ steps.validate.outputs.target_sha }}
      default_branch: ${{ steps.validate.outputs.default_branch }}
      ci_run_id: ${{ steps.validate.outputs.ci_run_id }}

    steps:
      - name: Validate target commit and CI
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.target_sha }}
          CI_WORKFLOW: ${{ inputs.ci_workflow }}
          REQUIRE_DEFAULT_HEAD: ${{ inputs.require_default_head }}
        shell: bash
        run: |
          set -Eeuo pipefail

          target="${TARGET_SHA:-$GITHUB_SHA}"

          if [ "$REQUIRE_DEFAULT_HEAD" != "true" ] && ! [[ "$target" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Non-default-HEAD deployment requires an immutable 40-character commit SHA." >&2
            exit 64
          fi

          resolved_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${target}" --jq '.sha')"
          default_branch="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')"
          default_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${default_branch}" --jq '.sha')"

          if [ "$REQUIRE_DEFAULT_HEAD" = "true" ] && [ "$resolved_sha" != "$default_sha" ]; then
            echo "::error::Target must be the default branch HEAD: expected=$default_sha actual=$resolved_sha." >&2
            exit 65
          fi

          runs="$(
            gh run list               --repo "$GITHUB_REPOSITORY"               --workflow "$CI_WORKFLOW"               --commit "$resolved_sha"               --limit 20               --json status,conclusion,headSha,databaseId
          )"

          ci_run_id="$(
            jq -r --arg sha "$resolved_sha" '
              [
                .[]
                | select(
                    .headSha == $sha
                    and .status == "completed"
                    and .conclusion == "success"
                  )
              ]
              | sort_by(.databaseId)
              | reverse
              | .[0].databaseId // empty
            ' <<< "$runs"
          )"

          [ -n "$ci_run_id" ] || {
            echo "::error::No successful CI found for target commit: workflow=$CI_WORKFLOW sha=$resolved_sha." >&2
            exit 1
          }

          {
            echo "target_sha=$resolved_sha"
            echo "default_branch=$default_branch"
            echo "ci_run_id=$ci_run_id"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Source Gate"
            echo
            echo "- Commit: $resolved_sha"
            echo "- CI: $CI_WORKFLOW"
            echo "- CI Run: $ci_run_id"
            echo "- Default branch: $default_branch"
            echo "- Require default HEAD: $REQUIRE_DEFAULT_HEAD"
          } >> "$GITHUB_STEP_SUMMARY"
