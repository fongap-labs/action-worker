name: 自动 · 上游镜像

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-upstream-mirror.yml
      - scripts/sync-upstream-mirror.ts
      - policies/upstream-mirror-sources.json
  schedule:
    - cron: "29 3 * * *"

permissions:
  contents: read

concurrency:
  group: governed-upstream-mirror
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror approved upstream to isolated governed branch
    if: github.repository == 'fongap-labs/action-worker'
    environment:
      name: admin-ops
      deployment: false
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_repository: fongap-labs/ds-harness
            repository_name: ds-harness
          - target_repository: fongap-labs/delta
            repository_name: delta
    steps:
      - name: Checkout trusted control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install pinned workflow parser
        run: npm ci --ignore-scripts

      - name: Mint scoped upstream mirror branch writer
        id: writer
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.repository_name }}
          permission-contents: write
          permission-workflows: write

      - name: Sync approved upstream to isolated branch
        env:
          AW_UPSTREAM_MIRROR_TOKEN: ${{ steps.writer.outputs.token }}
          AW_UPSTREAM_MIRROR_TARGET: ${{ matrix.target_repository }}
        run: node scripts/sync-upstream-mirror.ts
