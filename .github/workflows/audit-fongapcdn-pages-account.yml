name: 诊断 · FongapCDN Pages 账号

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-fongapcdn-pages-account.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: audit-fongapcdn-pages-account
  cancel-in-progress: false

jobs:
  identify:
    name: Read-only Pages project account check
    if: github.repository == 'fongap-labs/action-worker' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: internal-vault-ops
      deployment: false
    steps:
      - name: Verify Pages project ownership without any Cloudflare writes
        shell: bash
        env:
          CF_PAGES_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PRIMARY }}
          CF_CONFIGURED_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID_PRIMARY }}
          CF_TOKEN_ACCOUNT_ID: 7fbb64830cdcae5b80e5729f13b4aeb2
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          const token = process.env.CF_PAGES_TOKEN;
          const configured = process.env.CF_CONFIGURED_ACCOUNT_ID;
          const reportedByWrangler = process.env.CF_TOKEN_ACCOUNT_ID;
          const accountPattern = /^[0-9a-f]{32}$/;
          if (!token || !accountPattern.test(configured || "") ||
              !accountPattern.test(reportedByWrangler || "")) {
            console.error("Missing Cloudflare token or invalid account metadata; no mutation.");
            process.exit(77);
          }
          const results = [];
          for (const id of new Set([configured, reportedByWrangler])) {
            try {
              const response = await fetch(
                "https://api.cloudflare.com/client/v4/accounts/" + id +
                  "/pages/projects/fongapcdn",
                {
                  method: "GET",
                  headers: { Authorization: "Bearer " + token },
                  signal: AbortSignal.timeout(12000),
                }
              );
              const data = await response.json();
              const exists =
                response.ok && data?.success === true &&
                data?.result?.name === "fongapcdn";
              const codes = Array.isArray(data?.errors)
                ? data.errors.map((e) => e.code).filter(Number.isInteger)
                : [];
              console.log(
                "account=" + id + " http=" + response.status +
                  " project_confirmed=" + exists +
                  " api_error_codes=" + codes.join(",")
              );
              results.push({ id, exists });
            } catch (error) {
              console.error("Read-only Pages account probe failed: " + id +
                " (" + (error?.name || "network error") + ")");
              process.exitCode = 77;
              break;
            }
          }
          if (process.exitCode) process.exit();
          const owners = results.filter((entry) => entry.exists).map((entry) => entry.id);
          if (owners.length !== 1) {
            console.error(
              "Cannot uniquely establish FongapCDN Pages ownership; " +
              "no GitHub Environment variable or Secret has been changed."
            );
            process.exit(77);
          }
          console.log("verified_pages_owner=" + owners[0]);
          console.log("configured_account_matches_project=" + (owners[0] === configured));
          if (owners[0] !== configured) {
            console.error("Verified project belongs to a different Cloudflare account; " +
              "a central ops Environment correction is required before deploy.");
            process.exit(77);
          }
          NODE
