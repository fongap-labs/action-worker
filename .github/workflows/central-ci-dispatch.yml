name: Handle Central CI Dispatch

on:
  repository_dispatch:
    types: [run-central-ci, run-central-ci-ref]

permissions:
  contents: read

concurrency:
  group: central-ci-${{ github.event.client_payload.repository }}-${{ github.event.client_payload.pr_number || github.event.client_payload.head_sha }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare Central CI
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      repository: ${{ steps.payload.outputs.repository || steps.ref_facts.outputs.repository }}
      pr_number: ${{ steps.payload.outputs.pr_number || steps.ref_facts.outputs.pr_number }}
      base_sha: ${{ steps.facts.outputs.base_sha || steps.ref_facts.outputs.base_sha }}
      head_sha: ${{ steps.facts.outputs.head_sha || steps.ref_facts.outputs.head_sha }}
      control_ref: ${{ steps.ref_facts.outputs.control_ref || 'main' }}

    steps:
      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Validate PR request
        id: payload
        if: github.event.action == 'run-central-ci'
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          AW_REPOSITORY_POLICY: ${{ vars.AW_REPOSITORY_POLICY }}
        run: node scripts/validate-pr-payload.ts "$PAYLOAD"

      - name: Resolve branch CI request
        id: ref_facts
        if: github.event.action == 'run-central-ci-ref'
        env:
          GH_TOKEN: ${{ secrets.AW_CONTROL_TOKEN }}
          REPOSITORY: ${{ github.event.client_payload.repository }}
          REQUESTED_HEAD_SHA: ${{ github.event.client_payload.head_sha }}
          SCHEMA_VERSION: ${{ github.event.client_payload.schema_version }}
          REQUEST_ID: ${{ github.event.client_payload.request_id }}
        shell: bash
        run: |
          set -Eeuo pipefail

          [ "$SCHEMA_VERSION" = "1" ] || {
            echo "::error::Unsupported schema_version: $SCHEMA_VERSION" >&2
            exit 64
          }
          [ -n "$REQUEST_ID" ] || {
            echo "::error::request_id is required." >&2
            exit 64
          }
          [[ "$REQUESTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::head_sha must be a full commit SHA." >&2
            exit 64
          }

          default_branch="$(gh api "repos/$REPOSITORY" --jq '.default_branch')"
          default_sha="$(gh api "repos/$REPOSITORY/commits/$default_branch" --jq '.sha')"
          [ "$REQUESTED_HEAD_SHA" = "$default_sha" ] || {
            echo "::error::Central CI request is stale; default branch has moved." >&2
            exit 75
          }

          base_sha="$(gh api "repos/$REPOSITORY/commits/$REQUESTED_HEAD_SHA" --jq '.parents[0].sha // .sha')"
          {
            echo "repository=$REPOSITORY"
            echo "pr_number=0"
            echo "base_sha=$base_sha"
            echo "head_sha=$REQUESTED_HEAD_SHA"
            echo "control_ref=$REQUESTED_HEAD_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Validate central CI target
        env:
          REPOSITORY: ${{ steps.payload.outputs.repository || steps.ref_facts.outputs.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          case "$REPOSITORY" in
            fongap-labs/ai-gateway|fongap-labs/delta|fongap-labs/delta-suite|fongap-labs/app-source|fongap-labs/internal-vault|fongap-labs/external-vault) ;;
            *)
              echo "::error::Repository is not configured for central CI: $REPOSITORY" >&2
              exit 65
              ;;
          esac

      - name: Validate control credential
        if: github.event.action == 'run-central-ci'
        env:
          GH_TOKEN: ${{ secrets.AW_CONTROL_TOKEN }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          PR_NUMBER: ${{ steps.payload.outputs.pr_number }}
        run: node scripts/validate-control-access.ts "$REPOSITORY" "$PR_NUMBER"

      - name: Resolve PR facts
        id: facts
        if: github.event.action == 'run-central-ci'
        env:
          GH_TOKEN: ${{ secrets.AW_CONTROL_TOKEN }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          PR_NUMBER: ${{ steps.payload.outputs.pr_number }}
        run: node scripts/resolve-pr-facts.ts fetch

      - name: Validate requested revision
        if: github.event.action == 'run-central-ci'
        env:
          REQUESTED_HEAD_SHA: ${{ github.event.client_payload.head_sha }}
          RESOLVED_HEAD_SHA: ${{ steps.facts.outputs.head_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$REQUESTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [ "$REQUESTED_HEAD_SHA" != "$RESOLVED_HEAD_SHA" ]; then
            echo "::error::Central CI request is stale; PR head changed after dispatch." >&2
            exit 75
          fi

  linux:
    name: Central CI / Linux
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Checkout target PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.prepare.outputs.repository }}
          ref: ${{ needs.prepare.outputs.head_sha }}
          token: ${{ secrets.AW_CONTROL_TOKEN }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout trusted CI control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.prepare.outputs.repository }}
          ref: ${{ needs.prepare.outputs.control_ref }}
          token: ${{ secrets.AW_CONTROL_TOKEN }}
          path: ci-control
          fetch-depth: 1
          persist-credentials: false

      - name: Run trusted Linux CI
        env:
          CENTRAL_CI_BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          CENTRAL_CI_HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
          CENTRAL_CI_PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          TARGET_REPOSITORY: ${{ needs.prepare.outputs.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          script="$GITHUB_WORKSPACE/ci-control/.github/scripts/central-ci.sh"
          test -f "$script"

          log="$RUNNER_TEMP/central-ci-linux.log"
          set +e
          bash "$script" "$GITHUB_WORKSPACE/target" >"$log" 2>&1
          code=$?
          set -e

          if [ "$code" -ne 0 ]; then
            echo "::error::Central Linux CI failed for $TARGET_REPOSITORY. Detailed output is suppressed because the target repository is private."
            exit "$code"
          fi

          echo "Central Linux CI passed for $TARGET_REPOSITORY."

  windows:
    name: Central CI / Windows
    needs: prepare
    if: needs.prepare.outputs.repository == 'fongap-labs/app-source' || needs.prepare.outputs.repository == 'fongap-labs/delta'
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout target PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.prepare.outputs.repository }}
          ref: ${{ needs.prepare.outputs.head_sha }}
          token: ${{ secrets.AW_CONTROL_TOKEN }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout trusted CI control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.prepare.outputs.repository }}
          ref: ${{ needs.prepare.outputs.control_ref }}
          token: ${{ secrets.AW_CONTROL_TOKEN }}
          path: ci-control
          fetch-depth: 1
          persist-credentials: false

      - name: Run trusted Windows CI
        env:
          CENTRAL_CI_BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          CENTRAL_CI_HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
          CENTRAL_CI_PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          TARGET_REPOSITORY: ${{ needs.prepare.outputs.repository }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $script = "$env:GITHUB_WORKSPACE\ci-control\.github\scripts\central-ci.ps1"
          if (-not (Test-Path $script)) {
            throw "Missing trusted central CI script."
          }

          $log = Join-Path $env:RUNNER_TEMP "central-ci-windows.log"
          try {
            & $script -TargetRoot "$env:GITHUB_WORKSPACE\target" *> $log
            if ($LASTEXITCODE -ne 0) {
              throw "Central Windows CI returned exit code $LASTEXITCODE."
            }
          }
          catch {
            Write-Error "Central Windows CI failed for $env:TARGET_REPOSITORY. Detailed output is suppressed because the target repository is private."
            exit 1
          }

          Write-Host "Central Windows CI passed for $env:TARGET_REPOSITORY."

  finalize:
    name: Publish Central CI
    needs:
      - prepare
      - linux
      - windows
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Publish target status
        env:
          GH_TOKEN: ${{ secrets.AW_CONTROL_TOKEN }}
          REPOSITORY: ${{ needs.prepare.outputs.repository }}
          HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
          LINUX_RESULT: ${{ needs.linux.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -Eeuo pipefail

          state=failure
          description="Central CI failed"
          if [[ "$LINUX_RESULT" == "success" ]] && [[ "$WINDOWS_RESULT" == "success" || "$WINDOWS_RESULT" == "skipped" ]]; then
            state=success
            description="Central CI passed"
          fi

          for context in "CI Evidence" "ci-evidence" "validate-merge"; do
            gh api --method POST "repos/$REPOSITORY/statuses/$HEAD_SHA"               -f "state=$state"               -f "context=$context"               -f "description=$description"               -f "target_url=$RUN_URL" >/dev/null
          done

          if [[ "$state" != "success" ]]; then
            exit 1
          fi
