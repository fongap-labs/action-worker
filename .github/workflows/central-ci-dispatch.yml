name: 自动 · CI 分发

on:
  repository_dispatch:
    types: [run-central-ci, run-central-ci-ref]

permissions:
  contents: read
  actions: read
  pull-requests: read
  statuses: read

concurrency:
  # Isolate revisions; a duplicate request for the same head must never cancel running tests.
  # GitHub keeps one running and one pending run per group, replacing older pending duplicates.
  group: central-ci-${{ github.event.client_payload.repository }}-${{ github.event.client_payload.head_sha }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Central CI
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      repository: ${{ steps.payload.outputs.repository || steps.ref_facts.outputs.repository }}
      owner: ${{ steps.api_scope.outputs.owner }}
      repository_name: ${{ steps.api_scope.outputs.repository_name }}
      pr_number: ${{ steps.payload.outputs.pr_number || steps.ref_facts.outputs.pr_number }}
      base_sha: ${{ steps.merge_ref.outputs.base_sha || steps.facts.outputs.base_sha || steps.ref_facts.outputs.base_sha }}
      diff_base_sha: ${{ steps.facts.outputs.base_sha || steps.ref_facts.outputs.base_sha }}
      head_sha: ${{ steps.facts.outputs.head_sha || steps.ref_facts.outputs.head_sha }}
      merge_sha: ${{ steps.merge_ref.outputs.merge_sha || '' }}
      control_ref: ${{ steps.ci_control.outputs.control_ref || steps.ref_facts.outputs.control_ref || 'main' }}
      candidate_control: ${{ steps.ci_control.outputs.candidate_control || 'false' }}
      is_private: ${{ steps.visibility.outputs.is_private }}
      has_windows: ${{ steps.capabilities.outputs.has_windows }}
      linux_shards: ${{ steps.capabilities.outputs.linux_shards }}
      private_windows_numeric_diagnostic: ${{ steps.capabilities.outputs.private_windows_numeric_diagnostic }}
      should_run: ${{ steps.ref_facts.outputs.should_run || 'true' }}
      native_private_pilot: ${{ steps.native_pilot.outputs.enabled || 'false' }}
      native_private_ref: ${{ steps.native_ref.outputs.enabled || 'false' }}

    steps:
      - name: Mask target repository and commit identities
        shell: bash
        run: |
          set -Eeuo pipefail
          # GitHub Actions drops job outputs whose values were previously masked.
          # Verify public visibility without echoing the repository into logs.
          # Private or unverifiable repositories remain masked (fail closed).
          target_repository="$(jq -r '.client_payload.repository // empty' "$GITHUB_EVENT_PATH")"
          public_repository=""
          if [[ "$target_repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            is_private="$(curl -fsS --max-time 8 --header 'Accept: application/vnd.github+json' "https://api.github.com/repos/$target_repository" 2>/dev/null | jq -r 'if .private == false then "false" else empty end' || true)"
            if [[ "$is_private" == "false" ]]; then
              public_repository="$target_repository"
            fi
          fi
          # Valid commit SHAs remain available for downstream integrity checks.
          jq -r '
            (.client_payload // {}) |
            [
              .repository, .base_sha, .merge_sha,
              (if (.head_sha | type) != "string" then .head_sha
               elif (.head_sha | test("^[0-9a-f]{40}$")) then null
               else .head_sha end)
            ] |
            .[]? | select(type == "string" and length > 0)
          ' "$GITHUB_EVENT_PATH" | while IFS= read -r identity; do
            if [[ -n "$public_repository" && "$identity" == "$public_repository" ]]; then
              continue
            fi
            printf '::add-mask::%s\n' "$identity"
          done

      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Validate PR request
        id: payload
        if: github.event.action == 'run-central-ci'
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: node scripts/validate-pr-payload.ts "$PAYLOAD"

      - name: Resolve central CI API scope
        id: api_scope
        env:
          TARGET_REPOSITORY: ${{ github.event.client_payload.repository }}
        run: node scripts/resolve-github-api-scope.ts pr

      # Same-repository reads use GITHUB_TOKEN; cross-repository reads use a scoped App
      # installation token. No personal PAT fallback when App creation fails.
      - name: Mint cross-repository central CI read token
        id: app_read
        if: steps.api_scope.outputs.is_control_repository == 'false'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.api_scope.outputs.owner }}
          repositories: ${{ format('{0},{1}', github.event.repository.name, steps.api_scope.outputs.repository_name) }}
          permission-contents: read
          permission-actions: read
          permission-statuses: read
          permission-pull-requests: read

      - name: Resolve branch CI request
        id: ref_facts
        if: github.event.action == 'run-central-ci-ref'
        env:
          GH_TOKEN: ${{ steps.api_scope.outputs.is_control_repository == 'true' && github.token || steps.app_read.outputs.token }}
          AW_CONTROL_TOKEN: ${{ steps.api_scope.outputs.is_control_repository == 'true' && github.token || steps.app_read.outputs.token }}
          AW_STATUS_API_TOKEN: ${{ steps.api_scope.outputs.is_control_repository == 'true' && github.token || steps.app_read.outputs.token }}
          AW_STATUS_KEYRING: ${{ secrets.AW_STATUS_KEYRING }}
          REPOSITORY: ${{ github.event.client_payload.repository }}
          REQUESTED_HEAD_SHA: ${{ github.event.client_payload.head_sha }}
          SCHEMA_VERSION: ${{ github.event.client_payload.schema_version }}
          REQUEST_ID: ${{ github.event.client_payload.request_id }}
        shell: bash
        run: |
          set -Eeuo pipefail

          [ "$SCHEMA_VERSION" = "1" ] || {
            echo "::error::Unsupported schema_version: $SCHEMA_VERSION" >&2
            exit 64
          }
          [ -n "$REQUEST_ID" ] || {
            echo "::error::request_id is required." >&2
            exit 64
          }
          [[ "$REQUESTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::head_sha must be a full commit SHA." >&2
            exit 64
          }

          default_branch="$(gh api "repos/$REPOSITORY" --jq '.default_branch')"
          if [ "$default_branch" != "main" ]; then
            echo "::error::Branch CI requires the admitted main branch." >&2
            exit 75
          fi
          default_sha="$(gh api "repos/$REPOSITORY/commits/$default_branch" --jq '.sha')"
          if [ "$REQUESTED_HEAD_SHA" != "$default_sha" ]; then
            # Only Delta's immutable #87 incident receipts can be re-verified
            # on an ancestor. All other historic/stale refs fail closed.
            approved="$(node scripts/delta-historical-ci.ts "$REPOSITORY" "$REQUESTED_HEAD_SHA" "$default_sha")"
            if [ "$approved" != "true" ]; then
              echo "::error::Central CI request is stale; default branch has moved." >&2
              exit 75
            fi
          fi

          base_sha="$(gh api "repos/$REPOSITORY/commits/$REQUESTED_HEAD_SHA" --jq '.parents[0].sha // .sha')"
          should_run="$(node scripts/should-run-central-ci.ts "$REPOSITORY" "$REQUESTED_HEAD_SHA")"
          {
            echo "repository=$REPOSITORY"
            echo "pr_number=0"
            echo "base_sha=$base_sha"
            echo "head_sha=$REQUESTED_HEAD_SHA"
            echo "control_ref=$REQUESTED_HEAD_SHA"
            echo "should_run=$should_run"
          } >> "$GITHUB_OUTPUT"

      - name: Validate central CI target
        env:
          REPOSITORY: ${{ steps.payload.outputs.repository || steps.ref_facts.outputs.repository }}
        run: node scripts/repository-policy.ts validate "$REPOSITORY" pr

      - name: Resolve target visibility
        id: visibility
        env:
          GH_TOKEN: ${{ steps.api_scope.outputs.is_control_repository == 'true' && github.token || steps.app_read.outputs.token }}
          REPOSITORY: ${{ steps.payload.outputs.repository || steps.ref_facts.outputs.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "is_private=$(gh api "repos/$REPOSITORY" --jq '.private')" >> "$GITHUB_OUTPUT"

      - name: Validate control credential
        if: github.event.action == 'run-central-ci'
        env:
          GH_TOKEN: ${{ steps.api_scope.outputs.is_control_repository == 'true' && github.token || steps.app_read.outputs.token }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          PR_NUMBER: ${{ steps.payload.outputs.pr_number }}
        run: node scripts/validate-control-access.ts "$REPOSITORY" "$PR_NUMBER"

      # Re-checked here because this workflow is the one that executes change code.
      - name: Enforce PR trust
        if: github.event.action == 'run-central-ci'
        env:
          GH_TOKEN: ${{ steps.api_scope.outputs.is_control_repository == 'true' && github.token || steps.app_read.outputs.token }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          PR_NUMBER: ${{ steps.payload.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ github.event.client_payload.head_sha }}
        run: node scripts/pr-trust.ts "$REPOSITORY" "$PR_NUMBER" "$EXPECTED_HEAD_SHA"

      - name: Resolve PR CI control
        id: ci_control
        if: github.event.action == 'run-central-ci'
        env:
          AW_CONTROL_TOKEN: ${{ steps.api_scope.outputs.is_control_repository == 'true' && github.token || steps.app_read.outputs.token }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          PR_NUMBER: ${{ steps.payload.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ github.event.client_payload.head_sha }}
        run: node scripts/resolve-ci-control-ref.ts "$REPOSITORY" "$PR_NUMBER" "$EXPECTED_HEAD_SHA"

      - name: Resolve CI capabilities
        id: capabilities
        env:
          AW_CONTROL_TOKEN: ${{ steps.api_scope.outputs.is_control_repository == 'true' && github.token || steps.app_read.outputs.token }}
          REPOSITORY: ${{ steps.payload.outputs.repository || steps.ref_facts.outputs.repository }}
          CONTROL_REF: ${{ steps.ci_control.outputs.control_ref || steps.ref_facts.outputs.control_ref || 'main' }}
          IS_PRIVATE: ${{ steps.visibility.outputs.is_private }}
        run: node scripts/resolve-ci-capabilities.ts "$REPOSITORY" "$CONTROL_REF"

      # A versioned allowlist, not environment variables, controls opt-in.
      - name: Resolve native private CI pilot
        id: native_pilot
        env:
          REPOSITORY: ${{ steps.payload.outputs.repository || steps.ref_facts.outputs.repository }}
          IS_PRIVATE: ${{ steps.visibility.outputs.is_private }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ steps.payload.outputs.pr_number || steps.ref_facts.outputs.pr_number || '0' }}
        run: node scripts/native-ci-enrollment.ts "$REPOSITORY" "$IS_PRIVATE" "$EVENT_ACTION" "$PR_NUMBER"

      - name: Resolve source-owned private main
        id: native_ref
        env:
          REPOSITORY: ${{ steps.payload.outputs.repository || steps.ref_facts.outputs.repository }}
          IS_PRIVATE: ${{ steps.visibility.outputs.is_private }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ steps.payload.outputs.pr_number || steps.ref_facts.outputs.pr_number || '0' }}
        run: node scripts/native-ref-enrollment.ts "$REPOSITORY" "$IS_PRIVATE" "$EVENT_ACTION" "$PR_NUMBER"

      - name: Resolve PR facts
        id: facts
        if: github.event.action == 'run-central-ci'
        env:
          GH_TOKEN: ${{ steps.api_scope.outputs.is_control_repository == 'true' && github.token || steps.app_read.outputs.token }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          PR_NUMBER: ${{ steps.payload.outputs.pr_number }}
        run: node scripts/resolve-pr-facts.ts fetch

      - name: Pin PR merge snapshot
        id: merge_ref
        if: github.event.action == 'run-central-ci'
        env:
          GH_TOKEN: ${{ steps.api_scope.outputs.is_control_repository == 'true' && github.token || steps.app_read.outputs.token }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          PR_NUMBER: ${{ steps.payload.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ steps.facts.outputs.head_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          # GitHub's synthetic refs/pull/N/merge can lag behind a fresh PR push.
          # Retry a bounded number of times; never accept a different head/base.
          initial_base_ref=""
          merge_sha=""
          merge_base_sha=""
          merge_head_sha=""
          for attempt in 1 2 3 4 5 6; do
            pull="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
            base_ref="$(jq -r '.base.ref // empty' <<< "$pull")"
            current_head_sha="$(jq -r '.head.sha // empty' <<< "$pull")"
            head_ref="$(jq -r '.head.ref // empty' <<< "$pull")"
            pull_state="$(jq -r '.state // empty' <<< "$pull")"
            if [[ "$base_ref" != "main" || -z "$head_ref" || "$head_ref" == "main" || "$head_ref" == "dev" || "$pull_state" != "open" || "$current_head_sha" != "$EXPECTED_HEAD_SHA" ]]; then
              echo "::error::PR target branch or head changed while preparing the CI snapshot." >&2
              exit 75
            fi
            if [[ -n "$initial_base_ref" && "$base_ref" != "$initial_base_ref" ]]; then
              echo "::error::PR target branch changed during CI snapshot retry." >&2
              exit 75
            fi
            initial_base_ref="$base_ref"
            encoded_base_ref="$(jq -nr --arg ref "$base_ref" '$ref | @uri')"
            current_base_sha="$(gh api "repos/$REPOSITORY/branches/$encoded_base_ref" --jq '.commit.sha')"
            [[ "$current_base_sha" =~ ^[0-9a-f]{40}$ ]] || {
              echo "::error::Cannot resolve the live PR target branch SHA." >&2
              exit 75
            }
            merge_sha="$(gh api "repos/$REPOSITORY/git/ref/pull/$PR_NUMBER/merge" --jq '.object.sha' 2>/dev/null || true)"
            merge_base_sha=""
            merge_head_sha=""
            if [[ "$merge_sha" =~ ^[0-9a-f]{40}$ ]]; then
              merge_commit="$(gh api "repos/$REPOSITORY/git/commits/$merge_sha" 2>/dev/null || true)"
              merge_base_sha="$(jq -r '.parents[0].sha // empty' <<< "$merge_commit")"
              merge_head_sha="$(jq -r '.parents[1].sha // empty' <<< "$merge_commit")"
            fi
            if [[ "$merge_base_sha" != "$current_base_sha" || "$merge_head_sha" != "$EXPECTED_HEAD_SHA" ]]; then
              if [[ "$attempt" -eq 6 ]]; then
                echo "::error::GitHub PR merge snapshot remains stale after six attempts; expected base=$current_base_sha head=$EXPECTED_HEAD_SHA; actual base=$merge_base_sha head=$merge_head_sha" >&2
                exit 75
              fi
              echo "::notice::GitHub PR merge snapshot is updating (attempt $attempt/6); retrying with current base/head."
              sleep 3
              continue
            fi
            break
          done
          echo "base_sha=$merge_base_sha" >> "$GITHUB_OUTPUT"
          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"
          echo "Pinned PR merge snapshot: $merge_sha (base: $merge_base_sha, head: $merge_head_sha)"

      - name: Validate requested revision
        if: github.event.action == 'run-central-ci'
        env:
          REQUESTED_HEAD_SHA: ${{ github.event.client_payload.head_sha }}
          RESOLVED_HEAD_SHA: ${{ steps.facts.outputs.head_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$REQUESTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [ "$REQUESTED_HEAD_SHA" != "$RESOLVED_HEAD_SHA" ]; then
            echo "::error::Central CI request is stale; PR head changed after dispatch." >&2
            exit 75
          fi

      # Applies to both central sandboxes and source-owned native private CI evidence.
      # No target code is checked out or executed in this privileged preparation job.
      - name: Enforce central engineering ownership before CI routing
        env:
          AW_CONTROL_TOKEN: ${{ steps.api_scope.outputs.is_control_repository == 'true' && github.token || steps.app_read.outputs.token }}
          REPOSITORY: ${{ steps.payload.outputs.repository || steps.ref_facts.outputs.repository }}
          POLICY_BASE_SHA: ${{ steps.merge_ref.outputs.base_sha || steps.ref_facts.outputs.base_sha }}
          POLICY_HEAD_SHA: ${{ steps.facts.outputs.head_sha || steps.ref_facts.outputs.head_sha }}
          TARGET_PRIVATE: ${{ steps.visibility.outputs.is_private }}
        run: node scripts/engineering-gate-api.ts "$REPOSITORY" "$POLICY_BASE_SHA" "$POLICY_HEAD_SHA"

      - name: Mint CI lease status token
        id: lease_status_app
        if: github.event.action == 'run-central-ci-ref' && steps.ref_facts.outputs.should_run == 'true'
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.api_scope.outputs.owner }}
          repositories: ${{ steps.api_scope.outputs.repository_name }}
          permission-statuses: write

      # Intake's two-minute pending lease points at the short-lived intake run. Once Central CI
      # starts, transfer CI Evidence ownership to this long-running run so later intakes see
      # an active verdict job even after the original lease expires.
      - name: Attach Main CI lease to active Central CI run
        if: github.event.action == 'run-central-ci-ref' && steps.ref_facts.outputs.should_run == 'true'
        env:
          AW_STATUS_API_TOKEN: ${{ steps.lease_status_app.outputs.token }}
          AW_STATUS_KEYRING: ${{ secrets.AW_STATUS_KEYRING }}
          REPOSITORY: ${{ steps.ref_facts.outputs.repository }}
          HEAD_SHA: ${{ steps.ref_facts.outputs.head_sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Cannot attach Central CI lease to an invalid head SHA." >&2
            exit 65
          }
          node scripts/write-commit-status.ts "$REPOSITORY" "$HEAD_SHA" pending \
            "CI Evidence" "Central CI running; awaiting test verdict" "$RUN_URL"

      # On PR dispatch the first governance run can now finish while CI
      # continues. Transfer the pending lease to the real Central CI run.
      - name: Mint active PR CI lease token
        id: pr_lease_status_app
        if: github.event.action == 'run-central-ci'
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.api_scope.outputs.owner }}
          repositories: ${{ steps.api_scope.outputs.repository_name }}
          permission-statuses: write

      - name: Attach PR CI lease to active Central CI run
        if: github.event.action == 'run-central-ci'
        env:
          AW_STATUS_API_TOKEN: ${{ steps.pr_lease_status_app.outputs.token }}
          AW_STATUS_KEYRING: ${{ secrets.AW_STATUS_KEYRING }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          HEAD_SHA: ${{ steps.facts.outputs.head_sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/write-commit-status.ts "$REPOSITORY" "$HEAD_SHA" pending \
            "CI Evidence" "Central CI running; awaiting test verdict" "$RUN_URL"

  native-private-pilot:
    name: Verify native private CI evidence (pilot)
    needs: prepare
    if: needs.prepare.outputs.should_run != 'false' && needs.prepare.outputs.native_private_pilot == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions: {}

    steps:
      - name: Mask target repository and commit identities
        shell: bash
        run: |
          set -Eeuo pipefail
          # Never put unmasked client_payload values into a workflow expression or step env.
          jq -r '
            (.client_payload // {}) |
            [.repository, .head_sha, .base_sha, .merge_sha] |
            .[]? | select(type == "string" and length > 0)
          ' "$GITHUB_EVENT_PATH" | while IFS= read -r identity; do
            printf '::add-mask::%s\n' "$identity"
          done

      - name: Checkout trusted controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Mint source-only read token
        id: source_read_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ needs.prepare.outputs.owner }}
          repositories: ${{ needs.prepare.outputs.repository_name }}
          permission-actions: read
          permission-contents: read
          permission-pull-requests: read

      # Observational pilot: it never checks out or executes the private repository,
      # and cannot publish CI Evidence. The existing gate remains authoritative.
      - name: Verify immutable source CI evidence
        env:
          AW_NATIVE_PRIVATE_CI_READ_TOKEN: ${{ steps.source_read_app.outputs.token }}
          REPOSITORY: ${{ format('{0}/{1}', needs.prepare.outputs.owner, needs.prepare.outputs.repository_name) }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
          MERGE_SHA: ${{ needs.prepare.outputs.merge_sha }}
          LINUX_SHARDS: ${{ needs.prepare.outputs.linux_shards }}
          HAS_WINDOWS: ${{ needs.prepare.outputs.has_windows }}
          AW_NATIVE_PRIVATE_CI_WAIT_SECONDS: "2520"
        shell: bash
        run: |
          set -Eeuo pipefail
          # A single process retains exact-SHA evidence, queries live jobs at a
          # conservative interval, and respects GitHub primary quota reset.
          # Incomplete, stale or rate-limited verification never returns success.
          node scripts/private-ci-gate.ts "$REPOSITORY" "$PR_NUMBER" "$BASE_SHA" "$HEAD_SHA" "$MERGE_SHA" "$LINUX_SHARDS" "$HAS_WINDOWS"
          echo "Native private CI evidence verified for this immutable PR snapshot."

  native-private-ref:
    name: Verify native private main CI evidence
    needs: prepare
    if: needs.prepare.outputs.should_run != 'false' && needs.prepare.outputs.native_private_ref == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions: {}

    steps:
      - name: Mask target repository and commit identities
        shell: bash
        run: |
          set -Eeuo pipefail
          # Never put unmasked client_payload values into a workflow expression or step env.
          jq -r '
            (.client_payload // {}) |
            [.repository, .head_sha, .base_sha, .merge_sha] |
            .[]? | select(type == "string" and length > 0)
          ' "$GITHUB_EVENT_PATH" | while IFS= read -r identity; do
            printf '::add-mask::%s\n' "$identity"
          done

      - name: Checkout trusted controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Mint source-only private main read token
        id: source_read_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ needs.prepare.outputs.owner }}
          repositories: ${{ needs.prepare.outputs.repository_name }}
          permission-actions: read
          permission-contents: read

      - name: Verify source-owned immutable main CI evidence
        env:
          AW_NATIVE_PRIVATE_CI_READ_TOKEN: ${{ steps.source_read_app.outputs.token }}
          REPOSITORY: ${{ format('{0}/{1}', needs.prepare.outputs.owner, needs.prepare.outputs.repository_name) }}
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
          LINUX_SHARDS: ${{ needs.prepare.outputs.linux_shards }}
          HAS_WINDOWS: ${{ needs.prepare.outputs.has_windows }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for attempt in {1..40}; do
            if node scripts/private-ref-gate.ts "$REPOSITORY" "$BASE_SHA" "$HEAD_SHA" "$LINUX_SHARDS" "$HAS_WINDOWS"; then
              echo "Native private main CI evidence verified for the immutable push."
              exit 0
            fi
            if [ "$attempt" -eq 40 ]; then
              echo "::error::Private main CI evidence not verified after bounded retry." >&2
              exit 65
            fi
            sleep 60
          done

  linux:
    name: Central CI / Linux (${{ matrix.shard }})
    needs: prepare
    if: needs.prepare.outputs.should_run != 'false' && needs.prepare.outputs.native_private_pilot != 'true' && needs.prepare.outputs.native_private_ref != 'true'
    strategy:
      fail-fast: true
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.linux_shards || '["all"]') }}
    uses: ./.github/workflows/central-ci-sandbox.yml
    with:
      platform: linux
      shard: ${{ matrix.shard }}
      repository: ${{ format('{0}/{1}', needs.prepare.outputs.owner, needs.prepare.outputs.repository_name) }}
      owner: ${{ needs.prepare.outputs.owner }}
      repository_name: ${{ needs.prepare.outputs.repository_name }}
      app_client_id: ${{ vars.AW_APP_CLIENT_ID }}
      pr_number: ${{ needs.prepare.outputs.pr_number }}
      base_sha: ${{ needs.prepare.outputs.base_sha }}
      diff_base_sha: ${{ needs.prepare.outputs.diff_base_sha }}
      head_sha: ${{ needs.prepare.outputs.head_sha }}
      merge_sha: ${{ needs.prepare.outputs.merge_sha }}
      control_ref: ${{ needs.prepare.outputs.control_ref }}
      is_private: ${{ needs.prepare.outputs.is_private }}
    secrets:
      # The key is used only by the trusted token-mint action; change code receives no credential.
      app_private_key: ${{ needs.prepare.outputs.is_private == 'true' && secrets.AW_APP_PRIVATE_KEY || '' }}

  security:
    name: Central CI / Security
    needs: prepare
    if: needs.prepare.outputs.should_run != 'false' && needs.prepare.outputs.native_private_pilot != 'true' && needs.prepare.outputs.native_private_ref != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Mask target repository and commit identities
        shell: bash
        run: |
          set -Eeuo pipefail
          # Never put unmasked client_payload values into a workflow expression or step env.
          jq -r '
            (.client_payload // {}) |
            [.repository, .head_sha, .base_sha, .merge_sha] |
            .[]? | select(type == "string" and length > 0)
          ' "$GITHUB_EVENT_PATH" | while IFS= read -r identity; do
            printf '::add-mask::%s\n' "$identity"
          done

      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Resolve private security checkout scope
        id: security_scope
        if: needs.prepare.outputs.is_private == 'true'
        env:
          TARGET_REPOSITORY: ${{ format('{0}/{1}', needs.prepare.outputs.owner, needs.prepare.outputs.repository_name) }}
        run: node scripts/resolve-github-api-scope.ts pr

      - name: Mint private security checkout read token
        id: security_read_app
        if: needs.prepare.outputs.is_private == 'true'
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.security_scope.outputs.owner }}
          repositories: ${{ steps.security_scope.outputs.repository_name }}
          permission-contents: read

      - name: Require private checkout token
        if: needs.prepare.outputs.is_private == 'true'
        env:
          CHECKOUT_TOKEN: ${{ steps.security_read_app.outputs.token }}
        shell: bash
        run: |
          if [ -z "${CHECKOUT_TOKEN:-}" ]; then
            echo "::error::Missing scoped App read token for private security checkout. Verify App installation Contents: Read on target; no PAT fallback." >&2
            exit 77
          fi

      - name: Checkout private target source
        if: needs.prepare.outputs.is_private == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ format('{0}/{1}', needs.prepare.outputs.owner, needs.prepare.outputs.repository_name) }}
          ref: ${{ needs.prepare.outputs.head_sha }}
          token: ${{ steps.security_read_app.outputs.token }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout public target source
        if: needs.prepare.outputs.is_private != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ format('{0}/{1}', needs.prepare.outputs.owner, needs.prepare.outputs.repository_name) }}
          ref: ${{ needs.prepare.outputs.head_sha }}
          token: ${{ github.token }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Validate security gate
        env:
          TARGET_PRIVATE: ${{ needs.prepare.outputs.is_private }}
          BASE_SHA: ${{ needs.prepare.outputs.diff_base_sha }}
          HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
        run: node scripts/validate-security.ts "$BASE_SHA" "$HEAD_SHA" "$GITHUB_WORKSPACE/target" "$GITHUB_WORKSPACE/policies/security.json"

      - name: Check dependency lockfile integrity
        env:
          BASE_SHA: ${{ needs.prepare.outputs.diff_base_sha }}
          HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
        run: node scripts/dependency-lock-integrity.ts "$GITHUB_WORKSPACE/target" "$BASE_SHA" "$HEAD_SHA"

  windows:
    name: Central CI / Windows
    needs: prepare
    if: needs.prepare.outputs.should_run != 'false' && needs.prepare.outputs.has_windows == 'true' && needs.prepare.outputs.native_private_pilot != 'true' && needs.prepare.outputs.native_private_ref != 'true'
    uses: ./.github/workflows/central-ci-sandbox.yml
    with:
      platform: windows
      private_windows_numeric_diagnostic: ${{ needs.prepare.outputs.private_windows_numeric_diagnostic }}
      repository: ${{ format('{0}/{1}', needs.prepare.outputs.owner, needs.prepare.outputs.repository_name) }}
      owner: ${{ needs.prepare.outputs.owner }}
      repository_name: ${{ needs.prepare.outputs.repository_name }}
      app_client_id: ${{ vars.AW_APP_CLIENT_ID }}
      pr_number: ${{ needs.prepare.outputs.pr_number }}
      base_sha: ${{ needs.prepare.outputs.base_sha }}
      diff_base_sha: ${{ needs.prepare.outputs.diff_base_sha }}
      head_sha: ${{ needs.prepare.outputs.head_sha }}
      merge_sha: ${{ needs.prepare.outputs.merge_sha }}
      control_ref: ${{ needs.prepare.outputs.control_ref }}
      is_private: ${{ needs.prepare.outputs.is_private }}
    secrets:
      # The key is used only by the trusted token-mint action; change code receives no credential.
      app_private_key: ${{ needs.prepare.outputs.is_private == 'true' && secrets.AW_APP_PRIVATE_KEY || '' }}

  finalize:
    name: Publish Central CI
    needs:
      - prepare
      - linux
      - security
      - windows
      - native-private-pilot
      - native-private-ref
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.should_run != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: read
      actions: read

    steps:
      - name: Mask target repository and commit identities
        shell: bash
        run: |
          set -Eeuo pipefail
          # Never put unmasked client_payload values into a workflow expression or step env.
          jq -r '
            (.client_payload // {}) |
            [.repository, .head_sha, .base_sha, .merge_sha] |
            .[]? | select(type == "string" and length > 0)
          ' "$GITHUB_EVENT_PATH" | while IFS= read -r identity; do
            printf '::add-mask::%s\n' "$identity"
          done

      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Resolve status publication scope
        id: status_scope
        env:
          TARGET_REPOSITORY: ${{ format('{0}/{1}', needs.prepare.outputs.owner, needs.prepare.outputs.repository_name) }}
        run: node scripts/resolve-github-api-scope.ts pr

      - name: Mint status write token
        id: status_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.status_scope.outputs.owner }}
          repositories: ${{ steps.status_scope.outputs.repository_name }}
          permission-statuses: write

      - name: Mint CI verdict target read token
        if: needs.prepare.outputs.pr_number != '0'
        id: verdict_read_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.status_scope.outputs.owner }}
          repositories: ${{ steps.status_scope.outputs.repository_name }}
          permission-pull-requests: read

      - name: Classify failed CI evidence
        if: >-
          always() &&
          (needs.linux.result == 'failure' || needs.security.result == 'failure' ||
          needs.windows.result == 'failure')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CI_FAILURE_TARGET_REPOSITORY: ${{ format('{0}/{1}', needs.prepare.outputs.owner, needs.prepare.outputs.repository_name) }}
          CI_FAILURE_SOURCE_SHA: ${{ needs.prepare.outputs.head_sha }}
          CI_FAILURE_WORKFLOW_PATH: .github/workflows/central-ci-dispatch.yml
          CI_FAILURE_REPAIR_OPERATION: central_ci_retry
        run: node scripts/diagnose-ci-failure.ts

      - name: Publish target status
        id: ci_publish
        if: always()
        env:
          AW_STATUS_API_TOKEN: ${{ steps.status_app.outputs.token }}
          AW_STATUS_KEYRING: ${{ secrets.AW_STATUS_KEYRING }}
          REPOSITORY: ${{ format('{0}/{1}', needs.prepare.outputs.owner, needs.prepare.outputs.repository_name) }}
          HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
          GH_TOKEN: ${{ steps.verdict_read_app.outputs.token }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          AW_CI_SCOPE_PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          AW_CI_SCOPE_BRANCH: main
          AW_CI_SCOPE_BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          AW_CI_SCOPE_MERGE_SHA: ${{ needs.prepare.outputs.merge_sha }}
          LINUX_RESULT: ${{ needs.linux.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          HAS_WINDOWS: ${{ needs.prepare.outputs.has_windows }}
          WINDOWS_DIAGNOSTIC: ${{ needs.windows.outputs.windows_diagnostic || '' }}
          NATIVE_PRIVATE_PILOT: ${{ needs.prepare.outputs.native_private_pilot }}
          NATIVE_PRIVATE_RESULT: ${{ needs['native-private-pilot'].result }}
          NATIVE_PRIVATE_REF: ${{ needs.prepare.outputs.native_private_ref }}
          NATIVE_PRIVATE_REF_RESULT: ${{ needs['native-private-ref'].result }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          # A cancelled run carries no verdict: a newer dispatch of the same head cancelled it, or
          # the pull request closed. Writing failure here would replace the pending status of the
          # newer run, and PR Governance would fail on a run that was superseded.
          if [[ "$NATIVE_PRIVATE_PILOT" != "true" && "$NATIVE_PRIVATE_REF" != "true" ]] && [[ "$LINUX_RESULT" == "cancelled" || "$SECURITY_RESULT" == "cancelled" || "$WINDOWS_RESULT" == "cancelled" ]]; then
            echo "Central CI was cancelled for $REPOSITORY@$HEAD_SHA; CI Evidence is left to the run that replaces it."
            exit 0
          fi

          if [ "$PR_NUMBER" != "0" ]; then
            [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ && -n "$GH_TOKEN" ]] || exit 75
            pull="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
            if ! jq -e --arg head "$HEAD_SHA" '.state == "open" and .base.ref == "main" and (.head.ref | type == "string" and length > 0 and . != "main" and . != "dev") and .head.sha == $head' <<< "$pull" >/dev/null; then
              echo "Central CI PR direction or head changed; no verdict for the stale scope."
              exit 0
            fi
          fi

          state=failure
          description="Central CI failed"
          # Enrolled private PRs have one authority: the audited source-owned run.
          # The public control plane may not execute the source or fall back to its old jobs.
          if [[ "$NATIVE_PRIVATE_REF" == "true" ]]; then
            if [[ "$NATIVE_PRIVATE_PILOT" == "true" || "$LINUX_RESULT" != "skipped" || "$SECURITY_RESULT" != "skipped" || "$WINDOWS_RESULT" != "skipped" ]]; then
              description="Private main CI isolation contract violated"
            elif [[ "$NATIVE_PRIVATE_REF_RESULT" == "success" ]]; then
              state=success
              description="Native private main CI evidence verified"
            else
              description="Native private main CI evidence failed"
            fi
          elif [[ "$NATIVE_PRIVATE_PILOT" == "true" ]]; then
            if [[ "$LINUX_RESULT" != "skipped" || "$SECURITY_RESULT" != "skipped" || "$WINDOWS_RESULT" != "skipped" ]]; then
              description="Private CI isolation contract violated"
            elif [[ "$NATIVE_PRIVATE_RESULT" == "success" ]]; then
              state=success
              description="Native private CI evidence verified"
            else
              description="Native private CI evidence failed"
            fi
          else
            # The reusable Windows sandbox exports only an indexed failure
            # count, never private paths, log output, test names or source code.
            # The signed status is posted to the private target repository.
            if [[ "$WINDOWS_RESULT" == "failure" && "$WINDOWS_DIAGNOSTIC" =~ ^wc-tests-([0-9]{1,3}(\.[0-9]{1,3}){0,4})-([1-9][0-9]{0,2})$ ]]; then
              numbers="${BASH_REMATCH[1]}"
              count="${BASH_REMATCH[3]}"
              description="Windows regression failed cases ${numbers//./,} ($count failures)"
            fi
            if node scripts/ci-required-jobs.ts "$LINUX_RESULT" "$SECURITY_RESULT" "$WINDOWS_RESULT" "$HAS_WINDOWS"; then
              state=success
              description="Central CI passed"
            fi

          fi

          node scripts/write-commit-status.ts "$REPOSITORY" "$HEAD_SHA" "$state" \
            "CI Evidence" "$description" "$RUN_URL"
          echo "published=true" >> "$GITHUB_OUTPUT"
          if [[ "$state" != "success" ]]; then
            echo "::error::Central CI failed for $REPOSITORY@$HEAD_SHA: linux=$LINUX_RESULT security=$SECURITY_RESULT windows=$WINDOWS_RESULT"
            exit 1
          fi

      - name: Dispatch asynchronous CI follow-ups
        if: success() && steps.ci_publish.outputs.published == 'true'
        uses: ./.github/actions/mint-app-token
        id: followup_dispatch_app
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Send CI follow-up event
        if: success() && steps.ci_publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ steps.followup_dispatch_app.outputs.token }}
          TARGET_REPOSITORY: ${{ format('{0}/{1}', needs.prepare.outputs.owner, needs.prepare.outputs.repository_name) }}
          TARGET_HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
          TARGET_PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
        shell: bash
        run: |
          set -Eeuo pipefail
          payload="$(jq -cn \
            --arg repository "$TARGET_REPOSITORY" \
            --arg head_sha "$TARGET_HEAD_SHA" \
            --argjson pr_number "$TARGET_PR_NUMBER" \
            --argjson ci_run_id "$GITHUB_RUN_ID" \
            '{event_type:"run-ci-follow-up",client_payload:{repository:$repository,head_sha:$head_sha,pr_number:$pr_number,ci_run_id:$ci_run_id}}')"
          gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" --input - <<< "$payload"

      # On a failed CI the normal successful follow-up does not run.
      # Resume governance to publish a red PR verdict without waiting for intake.
      - name: Mint failed CI PR identity read token
        id: failed_pr_read_app
        if: ${{ always() && steps.ci_publish.outputs.published == 'true' && steps.ci_publish.outcome == 'failure' && needs.prepare.outputs.pr_number != '0' }}
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.status_scope.outputs.owner }}
          repositories: ${{ steps.status_scope.outputs.repository_name }}
          permission-pull-requests: read

      - name: Mint failed CI PR continuation token
        id: failed_pr_dispatch_app
        if: ${{ always() && steps.ci_publish.outputs.published == 'true' && steps.ci_publish.outcome == 'failure' && needs.prepare.outputs.pr_number != '0' }}
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Resume PR governance after failed CI
        if: ${{ always() && steps.ci_publish.outputs.published == 'true' && steps.ci_publish.outcome == 'failure' && needs.prepare.outputs.pr_number != '0' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.failed_pr_dispatch_app.outputs.token }}
          PR_READ_TOKEN: ${{ steps.failed_pr_read_app.outputs.token }}
          TARGET_REPOSITORY: ${{ format('{0}/{1}', needs.prepare.outputs.owner, needs.prepare.outputs.repository_name) }}
          TARGET_HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
          TARGET_PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
        shell: bash
        run: |
          set -Eeuo pipefail
          current_head="$(GH_TOKEN="$PR_READ_TOKEN" gh api "repos/$TARGET_REPOSITORY/pulls/$TARGET_PR_NUMBER" --jq '.head.sha' 2>/dev/null)" || exit 0
          [[ "$current_head" == "$TARGET_HEAD_SHA" ]] || exit 0
          payload="$(jq -cn \
            --arg repository "$TARGET_REPOSITORY" \
            --arg head_sha "$TARGET_HEAD_SHA" \
            --argjson pr_number "$TARGET_PR_NUMBER" \
            --arg request_id "ci-fail-$GITHUB_RUN_ID" \
            '{event_type:"run-pr-governance",client_payload:{schema_version:"1",request_id:$request_id,repository:$repository,pr_number:$pr_number,head_sha:$head_sha}}')"
          gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" --input - <<< "$payload"

  # A pull request whose CI stops in prepare (for example a CI control change from an untrusted
  # author) never reaches finalize. Without this job the pending CI Evidence written by the
  # dispatcher stays pending and PR Governance waits until its CI timeout.
  prepare-failure:
    name: Report Central CI Prepare Failure
    needs: prepare
    if: always() && needs.prepare.result == 'failure' && (github.event.action == 'run-central-ci' || github.event.action == 'run-central-ci-ref') && needs.prepare.outputs.owner != '' && needs.prepare.outputs.repository_name != '' && needs.prepare.outputs.head_sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Mask target repository and commit identities
        shell: bash
        run: |
          set -Eeuo pipefail
          # Never put unmasked client_payload values into a workflow expression or step env.
          jq -r '
            (.client_payload // {}) |
            [.repository, .head_sha, .base_sha, .merge_sha] |
            .[]? | select(type == "string" and length > 0)
          ' "$GITHUB_EVENT_PATH" | while IFS= read -r identity; do
            printf '::add-mask::%s\n' "$identity"
          done

      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Resolve failed CI status scope
        id: status_scope
        env:
          TARGET_REPOSITORY: ${{ format('{0}/{1}', needs.prepare.outputs.owner, needs.prepare.outputs.repository_name) }}
        run: node scripts/resolve-github-api-scope.ts pr

      - name: Mint failed CI status token
        id: status_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.status_scope.outputs.owner }}
          repositories: ${{ steps.status_scope.outputs.repository_name }}
          permission-statuses: write

      - name: Mint failed CI target read token
        id: failed_ci_read_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.status_scope.outputs.owner }}
          repositories: ${{ steps.status_scope.outputs.repository_name }}
          permission-pull-requests: read
          permission-contents: read

      - name: Publish failed CI Evidence for the current head
        id: prepare_publish
        env:
          GH_TOKEN: ${{ steps.failed_ci_read_app.outputs.token }}
          AW_CONTROL_TOKEN: ${{ steps.failed_ci_read_app.outputs.token }}
          AW_STATUS_API_TOKEN: ${{ steps.status_app.outputs.token }}
          AW_STATUS_KEYRING: ${{ secrets.AW_STATUS_KEYRING }}
          REPOSITORY: ${{ format('{0}/{1}', needs.prepare.outputs.owner, needs.prepare.outputs.repository_name) }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          REQUESTED_HEAD_SHA: ${{ github.event.client_payload.head_sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$REQUESTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 0

          # A failed PREPARE has no Linux/Windows verdict. Only the immutable
          # source revision that remains current may receive its signed red gate.
          if [ "$PR_NUMBER" = "0" ]; then
            default_branch="$(gh api "repos/$REPOSITORY" --jq '.default_branch')"
            [ "$default_branch" = "main" ] || exit 0
            encoded_branch="$(jq -rn --arg branch "$default_branch" '$branch | @uri')"
            current_head="$(gh api "repos/$REPOSITORY/commits/$encoded_branch" --jq '.sha')"
          elif [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            pull="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
            if ! jq -e '.state == "open" and .base.ref == "main" and (.head.ref | type == "string" and length > 0 and . != "main" and . != "dev")' <<< "$pull" >/dev/null; then
              echo "Central CI PR direction changed; no failure verdict for the stale scope."
              exit 0
            fi
            current_head="$(jq -r '.head.sha' <<< "$pull")"
          else
            exit 0
          fi
          if [ "$current_head" != "$REQUESTED_HEAD_SHA" ]; then
            echo "Central CI target changed; no verdict for the stale head."
            exit 0
          fi

          node scripts/write-commit-status.ts "$REPOSITORY" "$REQUESTED_HEAD_SHA" failure \
            "CI Evidence" "Central CI stopped before running tests; open the run for the reason" "$RUN_URL"
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Mint prepare failure PR continuation token
        id: prepare_pr_dispatch_app
        if: steps.prepare_publish.outputs.published == 'true' && needs.prepare.outputs.pr_number != '0'
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Resume PR governance after CI prepare failure
        if: steps.prepare_publish.outputs.published == 'true' && needs.prepare.outputs.pr_number != '0'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.prepare_pr_dispatch_app.outputs.token }}
          TARGET_REPOSITORY: ${{ format('{0}/{1}', needs.prepare.outputs.owner, needs.prepare.outputs.repository_name) }}
          TARGET_HEAD_SHA: ${{ github.event.client_payload.head_sha }}
          TARGET_PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
        shell: bash
        run: |
          set -Eeuo pipefail
          payload="$(jq -cn \
            --arg repository "$TARGET_REPOSITORY" \
            --arg head_sha "$TARGET_HEAD_SHA" \
            --argjson pr_number "$TARGET_PR_NUMBER" \
            --arg request_id "ci-prepare-fail-$GITHUB_RUN_ID" \
            '{event_type:"run-pr-governance",client_payload:{schema_version:"1",request_id:$request_id,repository:$repository,pr_number:$pr_number,head_sha:$head_sha}}')"
          gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" --input - <<< "$payload"

  # Runs only after a passing CI Evidence was published. A failure here must not turn the CI run
  # itself red: the PR gate and the release, deploy and task source checks accept CI Evidence only
  # from a run that concluded successfully.
  # always() is required: without a status function GitHub adds an implicit success(), which also
  # looks at the jobs finalize depends on, so a skipped `windows` job (a target without Windows CI)
  # would skip this job and no security scan, main write attestation or deploy would be dispatched.
