name: 自动 · CI 分发

on:
  repository_dispatch:
    types: [run-central-ci, run-central-ci-ref]

permissions:
  contents: read

concurrency:
  # Isolate revisions; a duplicate request for the same head must never cancel running tests.
  # GitHub keeps one running and one pending run per group, replacing older pending duplicates.
  group: central-ci-${{ github.event.client_payload.repository }}-${{ github.event.client_payload.head_sha }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Central CI
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      repository: ${{ steps.payload.outputs.repository || steps.ref_facts.outputs.repository }}
      pr_number: ${{ steps.payload.outputs.pr_number || steps.ref_facts.outputs.pr_number }}
      base_sha: ${{ steps.merge_ref.outputs.base_sha || steps.facts.outputs.base_sha || steps.ref_facts.outputs.base_sha }}
      diff_base_sha: ${{ steps.facts.outputs.base_sha || steps.ref_facts.outputs.base_sha }}
      head_sha: ${{ steps.facts.outputs.head_sha || steps.ref_facts.outputs.head_sha }}
      merge_sha: ${{ steps.merge_ref.outputs.merge_sha || '' }}
      control_ref: ${{ steps.ci_control.outputs.control_ref || steps.ref_facts.outputs.control_ref || 'main' }}
      candidate_control: ${{ steps.ci_control.outputs.candidate_control || 'false' }}
      is_private: ${{ steps.visibility.outputs.is_private }}
      has_windows: ${{ steps.capabilities.outputs.has_windows }}
      linux_shards: ${{ steps.capabilities.outputs.linux_shards }}
      should_run: ${{ steps.ref_facts.outputs.should_run || 'true' }}

    steps:
      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Validate PR request
        id: payload
        if: github.event.action == 'run-central-ci'
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          AW_REPOSITORY_POLICY: ${{ vars.AW_REPOSITORY_POLICY }}
        run: node scripts/validate-pr-payload.ts "$PAYLOAD"

      # Only trusted control-plane steps receive the installation token. Do not pass it
      # to the sandbox or replace the persistent CI Evidence signing key.
      - name: Mint MCP Hub central CI read token
        id: mcp_ci_read
        if: github.event.client_payload.repository == 'fongap-labs/mcp-hub'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            action-worker
            mcp-hub
          permission-contents: read
          permission-actions: read

      - name: Resolve branch CI request
        id: ref_facts
        if: github.event.action == 'run-central-ci-ref'
        env:
          GH_TOKEN: ${{ (github.event.client_payload.repository == 'fongap-labs/mcp-hub' && steps.mcp_ci_read.outputs.token) || (github.event.client_payload.repository != 'fongap-labs/mcp-hub' && secrets.AW_CONTROL_TOKEN) }}
          AW_CONTROL_TOKEN: ${{ (github.event.client_payload.repository == 'fongap-labs/mcp-hub' && steps.mcp_ci_read.outputs.token) || (github.event.client_payload.repository != 'fongap-labs/mcp-hub' && secrets.AW_CONTROL_TOKEN) }}
          AW_STATUS_TOKEN: ${{ secrets.AW_STATUS_TOKEN }}
          REPOSITORY: ${{ github.event.client_payload.repository }}
          REQUESTED_HEAD_SHA: ${{ github.event.client_payload.head_sha }}
          SCHEMA_VERSION: ${{ github.event.client_payload.schema_version }}
          REQUEST_ID: ${{ github.event.client_payload.request_id }}
        shell: bash
        run: |
          set -Eeuo pipefail

          [ "$SCHEMA_VERSION" = "1" ] || {
            echo "::error::Unsupported schema_version: $SCHEMA_VERSION" >&2
            exit 64
          }
          [ -n "$REQUEST_ID" ] || {
            echo "::error::request_id is required." >&2
            exit 64
          }
          [[ "$REQUESTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::head_sha must be a full commit SHA." >&2
            exit 64
          }

          default_branch="$(gh api "repos/$REPOSITORY" --jq '.default_branch')"
          default_sha="$(gh api "repos/$REPOSITORY/commits/$default_branch" --jq '.sha')"
          [ "$REQUESTED_HEAD_SHA" = "$default_sha" ] || {
            echo "::error::Central CI request is stale; default branch has moved." >&2
            exit 75
          }

          base_sha="$(gh api "repos/$REPOSITORY/commits/$REQUESTED_HEAD_SHA" --jq '.parents[0].sha // .sha')"
          should_run="$(node scripts/should-run-central-ci.ts "$REPOSITORY" "$REQUESTED_HEAD_SHA")"
          {
            echo "repository=$REPOSITORY"
            echo "pr_number=0"
            echo "base_sha=$base_sha"
            echo "head_sha=$REQUESTED_HEAD_SHA"
            echo "control_ref=$REQUESTED_HEAD_SHA"
            echo "should_run=$should_run"
          } >> "$GITHUB_OUTPUT"

      - name: Validate central CI target
        env:
          AW_REPOSITORY_POLICY: ${{ vars.AW_REPOSITORY_POLICY }}
          REPOSITORY: ${{ steps.payload.outputs.repository || steps.ref_facts.outputs.repository }}
        run: node scripts/repository-policy.ts validate "$REPOSITORY" pr

      - name: Resolve target visibility
        id: visibility
        env:
          GH_TOKEN: ${{ (github.event.client_payload.repository == 'fongap-labs/mcp-hub' && steps.mcp_ci_read.outputs.token) || (github.event.client_payload.repository != 'fongap-labs/mcp-hub' && secrets.AW_CONTROL_TOKEN) }}
          REPOSITORY: ${{ steps.payload.outputs.repository || steps.ref_facts.outputs.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "is_private=$(gh api "repos/$REPOSITORY" --jq '.private')" >> "$GITHUB_OUTPUT"

      - name: Validate control credential
        if: github.event.action == 'run-central-ci'
        env:
          GH_TOKEN: ${{ secrets.AW_CONTROL_TOKEN }}
          AW_STATUS_TOKEN: ${{ secrets.AW_STATUS_TOKEN }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          PR_NUMBER: ${{ steps.payload.outputs.pr_number }}
        run: node scripts/validate-control-access.ts "$REPOSITORY" "$PR_NUMBER"

      # Re-checked here because this workflow is the one that executes change code.
      - name: Enforce PR trust
        if: github.event.action == 'run-central-ci'
        env:
          GH_TOKEN: ${{ secrets.AW_CONTROL_TOKEN }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          PR_NUMBER: ${{ steps.payload.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ github.event.client_payload.head_sha }}
        run: node scripts/pr-trust.ts "$REPOSITORY" "$PR_NUMBER" "$EXPECTED_HEAD_SHA"

      - name: Resolve PR CI control
        id: ci_control
        if: github.event.action == 'run-central-ci'
        env:
          AW_CONTROL_TOKEN: ${{ secrets.AW_CONTROL_TOKEN }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          PR_NUMBER: ${{ steps.payload.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ github.event.client_payload.head_sha }}
        run: node scripts/resolve-ci-control-ref.ts "$REPOSITORY" "$PR_NUMBER" "$EXPECTED_HEAD_SHA"

      - name: Resolve CI capabilities
        id: capabilities
        env:
          AW_CONTROL_TOKEN: ${{ (github.event.client_payload.repository == 'fongap-labs/mcp-hub' && steps.mcp_ci_read.outputs.token) || (github.event.client_payload.repository != 'fongap-labs/mcp-hub' && secrets.AW_CONTROL_TOKEN) }}
          REPOSITORY: ${{ steps.payload.outputs.repository || steps.ref_facts.outputs.repository }}
          CONTROL_REF: ${{ steps.ci_control.outputs.control_ref || steps.ref_facts.outputs.control_ref || 'main' }}
        run: node scripts/resolve-ci-capabilities.ts "$REPOSITORY" "$CONTROL_REF"

      - name: Resolve PR facts
        id: facts
        if: github.event.action == 'run-central-ci'
        env:
          GH_TOKEN: ${{ secrets.AW_CONTROL_TOKEN }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          PR_NUMBER: ${{ steps.payload.outputs.pr_number }}
        run: node scripts/resolve-pr-facts.ts fetch

      - name: Pin PR merge snapshot
        id: merge_ref
        if: github.event.action == 'run-central-ci'
        env:
          GH_TOKEN: ${{ secrets.AW_CONTROL_TOKEN }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          PR_NUMBER: ${{ steps.payload.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ steps.facts.outputs.head_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          pull="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          base_ref="$(jq -r '.base.ref // empty' <<< "$pull")"
          current_head_sha="$(jq -r '.head.sha // empty' <<< "$pull")"
          if [[ -z "$base_ref" || "$current_head_sha" != "$EXPECTED_HEAD_SHA" ]]; then
            echo "::error::PR target branch or head changed while preparing the CI snapshot." >&2
            exit 75
          fi
          encoded_base_ref="$(jq -nr --arg ref "$base_ref" '$ref | @uri')"
          current_base_sha="$(gh api "repos/$REPOSITORY/branches/$encoded_base_ref" --jq '.commit.sha')"
          [[ "$current_base_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Cannot resolve the live PR target branch SHA." >&2
            exit 75
          }
          merge_sha="$(gh api "repos/$REPOSITORY/git/ref/pull/$PR_NUMBER/merge" --jq '.object.sha')"
          [[ "$merge_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::GitHub did not provide a valid immutable PR merge SHA; retry after the merge ref is prepared." >&2
            exit 75
          }
          merge_commit="$(gh api "repos/$REPOSITORY/git/commits/$merge_sha")"
          merge_base_sha="$(jq -r '.parents[0].sha // empty' <<< "$merge_commit")"
          merge_head_sha="$(jq -r '.parents[1].sha // empty' <<< "$merge_commit")"
          if [[ "$merge_base_sha" != "$current_base_sha" || "$merge_head_sha" != "$EXPECTED_HEAD_SHA" ]]; then
            echo "::error::GitHub PR merge snapshot does not match the current base/head; retry after the merge ref is refreshed. expected base=$current_base_sha head=$EXPECTED_HEAD_SHA; actual base=$merge_base_sha head=$merge_head_sha" >&2
            exit 75
          fi
          echo "base_sha=$merge_base_sha" >> "$GITHUB_OUTPUT"
          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"
          echo "Pinned PR merge snapshot: $merge_sha (base: $merge_base_sha, head: $merge_head_sha)"

      - name: Validate requested revision
        if: github.event.action == 'run-central-ci'
        env:
          REQUESTED_HEAD_SHA: ${{ github.event.client_payload.head_sha }}
          RESOLVED_HEAD_SHA: ${{ steps.facts.outputs.head_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$REQUESTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [ "$REQUESTED_HEAD_SHA" != "$RESOLVED_HEAD_SHA" ]; then
            echo "::error::Central CI request is stale; PR head changed after dispatch." >&2
            exit 75
          fi

      # Intake's two-minute pending lease points at the short-lived intake run. Once Central CI
      # starts, transfer CI Evidence ownership to this long-running run so later intakes see
      # an active verdict job even after the original lease expires.
      - name: Attach Main CI lease to active Central CI run
        if: github.event.action == 'run-central-ci-ref' && steps.ref_facts.outputs.should_run == 'true'
        env:
          AW_STATUS_TOKEN: ${{ secrets.AW_STATUS_TOKEN }}
          REPOSITORY: ${{ steps.ref_facts.outputs.repository }}
          HEAD_SHA: ${{ steps.ref_facts.outputs.head_sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Cannot attach Central CI lease to an invalid head SHA." >&2
            exit 65
          }
          node scripts/write-commit-status.ts "$REPOSITORY" "$HEAD_SHA" pending \
            "CI Evidence" "Central CI running; awaiting test verdict" "$RUN_URL"

  linux:
    name: Central CI / Linux (${{ matrix.shard }})
    needs: prepare
    if: needs.prepare.outputs.should_run != 'false'
    strategy:
      fail-fast: true
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.linux_shards || '["all"]') }}
    uses: ./.github/workflows/central-ci-sandbox.yml
    with:
      platform: linux
      shard: ${{ matrix.shard }}
      repository: ${{ needs.prepare.outputs.repository }}
      pr_number: ${{ needs.prepare.outputs.pr_number }}
      base_sha: ${{ needs.prepare.outputs.base_sha }}
      diff_base_sha: ${{ needs.prepare.outputs.diff_base_sha }}
      head_sha: ${{ needs.prepare.outputs.head_sha }}
      merge_sha: ${{ needs.prepare.outputs.merge_sha }}
      control_ref: ${{ needs.prepare.outputs.control_ref }}
      is_private: ${{ needs.prepare.outputs.is_private }}
    secrets:
      # Evaluated by GitHub before the sandbox starts; public targets receive no credential.
      checkout_token: ${{ needs.prepare.outputs.is_private == 'true' && secrets.AW_CHECKOUT_TOKEN || '' }}

  security:
    name: Central CI / Security
    needs: prepare
    if: needs.prepare.outputs.should_run != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Require private checkout token
        if: needs.prepare.outputs.is_private == 'true'
        env:
          CHECKOUT_TOKEN: ${{ secrets.AW_CHECKOUT_TOKEN }}
        shell: bash
        run: |
          if [ -z "${CHECKOUT_TOKEN:-}" ]; then
            echo "::error::Missing AW_CHECKOUT_TOKEN. Configure action-worker → Settings → Secrets and variables → Actions; grant Contents: Read to private target repositories." >&2
            exit 77
          fi

      - name: Checkout private target source
        if: needs.prepare.outputs.is_private == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.prepare.outputs.repository }}
          ref: ${{ needs.prepare.outputs.head_sha }}
          token: ${{ secrets.AW_CHECKOUT_TOKEN }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout public target source
        if: needs.prepare.outputs.is_private != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.prepare.outputs.repository }}
          ref: ${{ needs.prepare.outputs.head_sha }}
          token: ${{ github.token }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Validate security gate
        env:
          BASE_SHA: ${{ needs.prepare.outputs.diff_base_sha }}
          HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
        run: node scripts/validate-security.ts "$BASE_SHA" "$HEAD_SHA" "$GITHUB_WORKSPACE/target" "$GITHUB_WORKSPACE/policies/security.json"

  windows:
    name: Central CI / Windows
    needs: prepare
    if: needs.prepare.outputs.should_run != 'false' && needs.prepare.outputs.has_windows == 'true'
    uses: ./.github/workflows/central-ci-sandbox.yml
    with:
      platform: windows
      repository: ${{ needs.prepare.outputs.repository }}
      pr_number: ${{ needs.prepare.outputs.pr_number }}
      base_sha: ${{ needs.prepare.outputs.base_sha }}
      diff_base_sha: ${{ needs.prepare.outputs.diff_base_sha }}
      head_sha: ${{ needs.prepare.outputs.head_sha }}
      merge_sha: ${{ needs.prepare.outputs.merge_sha }}
      control_ref: ${{ needs.prepare.outputs.control_ref }}
      is_private: ${{ needs.prepare.outputs.is_private }}
    secrets:
      # Evaluated by GitHub before the sandbox starts; public targets receive no credential.
      checkout_token: ${{ needs.prepare.outputs.is_private == 'true' && secrets.AW_CHECKOUT_TOKEN || '' }}

  finalize:
    name: Publish Central CI
    needs:
      - prepare
      - linux
      - security
      - windows
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.should_run != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Publish target status
        env:
          AW_STATUS_TOKEN: ${{ secrets.AW_STATUS_TOKEN }}
          REPOSITORY: ${{ needs.prepare.outputs.repository }}
          HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
          LINUX_RESULT: ${{ needs.linux.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          WINDOWS_DIAGNOSTIC: ${{ needs.windows.outputs.windows_diagnostic || '' }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          # A cancelled run carries no verdict: a newer dispatch of the same head cancelled it, or
          # the pull request closed. Writing failure here would replace the pending status of the
          # newer run, and PR Governance would fail on a run that was superseded.
          if [[ "$LINUX_RESULT" == "cancelled" || "$SECURITY_RESULT" == "cancelled" || "$WINDOWS_RESULT" == "cancelled" ]]; then
            echo "Central CI was cancelled for $REPOSITORY@$HEAD_SHA; CI Evidence is left to the run that replaces it."
            exit 0
          fi

          state=failure
          description="Central CI failed"
          # The reusable Windows sandbox exports only an indexed failure
          # count, never private paths, log output, test names or source code.
          # The signed status is posted to the private target repository.
          if [[ "$WINDOWS_RESULT" == "failure" && "$WINDOWS_DIAGNOSTIC" =~ ^wc-tests-([0-9]{1,3}(\.[0-9]{1,3}){0,4})-([1-9][0-9]{0,2})$ ]]; then
            numbers="${BASH_REMATCH[1]}"
            count="${BASH_REMATCH[3]}"
            description="Windows regression failed cases ${numbers//./,} ($count failures)"
          fi
          if [[ "$LINUX_RESULT" == "success" ]] && [[ "$SECURITY_RESULT" == "success" ]] && [[ "$WINDOWS_RESULT" == "success" || "$WINDOWS_RESULT" == "skipped" ]]; then
            state=success
            description="Central CI passed"
          fi

          node scripts/write-commit-status.ts "$REPOSITORY" "$HEAD_SHA" "$state" \
            "CI Evidence" "$description" "$RUN_URL"

          if [[ "$state" != "success" ]]; then
            echo "::error::Central CI failed for $REPOSITORY@$HEAD_SHA: linux=$LINUX_RESULT security=$SECURITY_RESULT windows=$WINDOWS_RESULT"
            exit 1
          fi

      - name: Dispatch asynchronous CI follow-ups
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ needs.prepare.outputs.repository }}
          TARGET_HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
          TARGET_PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
        shell: bash
        run: |
          set -Eeuo pipefail
          payload="$(jq -cn \
            --arg repository "$TARGET_REPOSITORY" \
            --arg head_sha "$TARGET_HEAD_SHA" \
            --argjson pr_number "$TARGET_PR_NUMBER" \
            --argjson ci_run_id "$GITHUB_RUN_ID" \
            '{event_type:"run-ci-follow-up",client_payload:{repository:$repository,head_sha:$head_sha,pr_number:$pr_number,ci_run_id:$ci_run_id}}')"
          gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" --input - <<< "$payload"

  # A pull request whose CI stops in prepare (for example a CI control change from an untrusted
  # author) never reaches finalize. Without this job the pending CI Evidence written by the
  # dispatcher stays pending and PR Governance waits until its CI timeout.
  prepare-failure:
    name: Report Central CI Prepare Failure
    needs: prepare
    if: always() && needs.prepare.result == 'failure' && github.event.action == 'run-central-ci' && needs.prepare.outputs.repository != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Publish failed CI Evidence for the current head
        env:
          GH_TOKEN: ${{ secrets.AW_CONTROL_TOKEN }}
          AW_CONTROL_TOKEN: ${{ secrets.AW_CONTROL_TOKEN }}
          AW_STATUS_TOKEN: ${{ secrets.AW_STATUS_TOKEN }}
          REPOSITORY: ${{ needs.prepare.outputs.repository }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          REQUESTED_HEAD_SHA: ${{ github.event.client_payload.head_sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 0
          [[ "$REQUESTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 0

          # Only the head that is still current gets a verdict; a newer head has its own CI run.
          current_head="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
          if [ "$current_head" != "$REQUESTED_HEAD_SHA" ]; then
            echo "PR head moved to $current_head; no verdict for the stale head."
            exit 0
          fi

          node scripts/write-commit-status.ts "$REPOSITORY" "$REQUESTED_HEAD_SHA" failure \
            "CI Evidence" "Central CI stopped before running tests; open the run for the reason" "$RUN_URL"

  # Runs only after a passing CI Evidence was published. A failure here must not turn the CI run
  # itself red: the PR gate and the release, deploy and task source checks accept CI Evidence only
  # from a run that concluded successfully.
  # always() is required: without a status function GitHub adds an implicit success(), which also
  # looks at the jobs finalize depends on, so a skipped `windows` job (a target without Windows CI)
  # would skip this job and no security scan, main write attestation or deploy would be dispatched.
