name: Main Write Guard

# Proves that each push to Action Worker's own main came from a merged pull request whose local
# validate-merge check passed. Managed repositories are attested by the main-writes job of Intake
# and by the Central CI follow-up, both through scripts/audit-main-writes.ts.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-write-guard
  cancel-in-progress: false

jobs:
  guard:
    name: Main Write Guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      pull-requests: read
      statuses: write

    steps:
      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Validate main write provenance
        env:
          MAIN_WRITE_TOKEN: ${{ github.token }}
          MAIN_WRITE_REQUIRE_POLICY: "false"
          MAIN_WRITE_REQUIRE_CENTRAL_STATUSES: "false"
          MAIN_WRITE_REPOSITORY: ${{ github.repository }}
          MAIN_WRITE_BEFORE_SHA: ${{ github.event.before }}
          MAIN_WRITE_HEAD_SHA: ${{ github.sha }}
          MAIN_WRITE_EVENT: push
          MAIN_WRITE_REQUEST_ID: push:${{ github.run_id }}
          MAIN_WRITE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/main-write-guard.ts
