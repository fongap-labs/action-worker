name: 自动 · 主分支审计

# Proves that each push to Action Worker's own main came from a merged pull request whose local
# validate-merge check passed. Managed repositories are attested by the main-writes job of Intake
# and by the Central CI follow-up, both through scripts/audit-main-writes.ts.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-write-guard
  cancel-in-progress: false

jobs:
  guard:
    name: Main Write Guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
      issues: read
      pull-requests: read
      statuses: read

    steps:
      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve central runtime versions
        id: runtime
        run: node scripts/resolve-runtime-versions.mjs --github-output .

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.runtime.outputs.node }}

      - name: Mint main write status token
        id: status_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-statuses: write

      - name: Mint main write read token
        id: guard_read_app
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: read
          permission-checks: read
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
          permission-statuses: read

      - name: Validate main write provenance
        env:
          MAIN_WRITE_TOKEN: ${{ steps.guard_read_app.outputs.token }}
          AW_NATIVE_TOKEN: ${{ github.token }}
          AW_GITHUB_API_METRICS: "1"
          AW_STATUS_API_TOKEN: ${{ steps.status_app.outputs.token }}
          AW_STATUS_KEYRING: ${{ secrets.AW_STATUS_KEYRING }}
          MAIN_WRITE_REQUIRE_POLICY: "false"
          MAIN_WRITE_REQUIRE_CENTRAL_STATUSES: "false"
          MAIN_WRITE_REPOSITORY: ${{ github.repository }}
          MAIN_WRITE_BEFORE_SHA: ${{ github.event.before }}
          MAIN_WRITE_HEAD_SHA: ${{ github.sha }}
          MAIN_WRITE_EVENT: push
          MAIN_WRITE_REQUEST_ID: push:${{ github.run_id }}
          MAIN_WRITE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/main-write-guard.ts
