name: Handle Task Dispatch

on:
  repository_dispatch:
    types: [run-task]

permissions: {}

jobs:
  validate:
    name: Validate dispatch request
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      contents: read

    outputs:
      schema_version: ${{ steps.payload.outputs.schema_version }}
      request_id: ${{ steps.payload.outputs.request_id }}
      project: ${{ steps.payload.outputs.project }}
      bootstrap_ref: ${{ steps.payload.outputs.bootstrap_ref }}
      repository: ${{ steps.payload.outputs.repository }}
      agent_domain: ${{ steps.payload.outputs.agent_domain }}
      operation: ${{ steps.payload.outputs.operation }}
      is_private: ${{ steps.visibility.outputs.is_private }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Validate request payload
        id: payload
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          AW_REPOSITORY_POLICY: ${{ vars.AW_REPOSITORY_POLICY }}
        run: node scripts/validate-dispatch-payload.ts "$PAYLOAD"

      - name: Validate task source
        env:
          AW_CONTROL_TOKEN: ${{ secrets.AW_CONTROL_TOKEN }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          BOOTSTRAP_REF: ${{ steps.payload.outputs.bootstrap_ref }}
        run: node scripts/validate-task-source.ts "$REPOSITORY" "$BOOTSTRAP_REF"

      - name: Resolve task source visibility
        id: visibility
        env:
          GH_TOKEN: ${{ secrets.AW_CONTROL_TOKEN }}
          REPOSITORY: ${{ steps.payload.outputs.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          is_private="$(gh api "repos/$REPOSITORY" --jq '.private')"
          [[ "$is_private" == "true" || "$is_private" == "false" ]]
          echo "is_private=$is_private" >> "$GITHUB_OUTPUT"

  execute:
    name: Execute task
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 65

    permissions:
      actions: read

    env:
      AW_SOURCE_DIR: ${{ github.workspace }}/task-source
      SCHEMA_VERSION: ${{ needs.validate.outputs.schema_version }}
      REQUEST_ID: ${{ needs.validate.outputs.request_id }}
      PROJECT: ${{ needs.validate.outputs.project }}
      BOOTSTRAP_REF: ${{ needs.validate.outputs.bootstrap_ref }}
      AGENT_DOMAIN: ${{ needs.validate.outputs.agent_domain }}
      OPERATION: ${{ needs.validate.outputs.operation }}
      TASK_SOURCE_PRIVATE: ${{ needs.validate.outputs.is_private }}
      TASK_SOURCE_REPOSITORY: ${{ needs.validate.outputs.repository }}
      AW_TASK_SECRET_POLICY_MODE: ${{ vars.AW_TASK_SECRET_POLICY_MODE || 'warn' }}

    concurrency:
      group: action-worker-${{ needs.validate.outputs.repository }}-${{ needs.validate.outputs.project }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Checkout task source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.validate.outputs.repository }}
          ref: ${{ needs.validate.outputs.bootstrap_ref }}
          token: ${{ secrets.AW_CONTROL_TOKEN }}
          path: task-source
          fetch-depth: 1
          persist-credentials: false

      - name: Export repository variables
        env:
          REPOSITORY_VARS_JSON: ${{ toJSON(vars) }}
        run: node scripts/export-repository-variables.ts

      - name: Resolve agent skills
        id: skills
        run: node scripts/resolve-agent-skills.ts "$AGENT_DOMAIN" "$OPERATION"

      - name: Build agent prompt
        id: prompt
        env:
          AGENT_SKILLS_JSON: ${{ steps.skills.outputs.skills }}
          AGENT_PROMPT_OUTPUT_PATH: ${{ runner.temp }}/action-worker-agent-prompt.md
        run: |
          node scripts/build-agent-prompt.ts
          {
            echo "AGENT_SYSTEM_PROMPT_PATH=${AGENT_PROMPT_OUTPUT_PATH}"
            echo "AGENT_SKILLS=${AGENT_SKILLS_JSON}"
          } >> "$GITHUB_ENV"

      - name: Snapshot base environment
        shell: bash
        run: |
          set -Eeuo pipefail

          compgen -e |
            LC_ALL=C sort -u \
            > "${RUNNER_TEMP}/action-worker-base-env.names"

          chmod 600 "${RUNNER_TEMP}/action-worker-base-env.names"

      - name: Restore previous task state
        id: task_state
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ needs.validate.outputs.repository }}
          PROJECT: ${{ needs.validate.outputs.project }}
        shell: bash
        run: |
          set -Eeuo pipefail

          # One artifact name per exact (repository, project) pair; a manifest inside the artifact is
          # checked again on restore (scripts/task-state.ts).
          artifact_name="$(node scripts/task-state.ts name "$SOURCE_REPOSITORY" "$PROJECT")"
          # Transition only: artifacts written before the hashed name existed (retention is 30 days, so
          # this branch goes quiet by itself). They carry no manifest and cannot be verified.
          safe_repository="${SOURCE_REPOSITORY//\//-}"
          safe_repository="${safe_repository//[^A-Za-z0-9_.-]/-}"
          safe_project="${PROJECT//[^A-Za-z0-9_.-]/-}"
          legacy_artifact_name="task-state-${safe_repository}-${safe_project}"
          state_root="${RUNNER_TEMP}/action-worker-task-state"

          mkdir -p "$state_root/previous" "$state_root/current"
          {
            echo "AW_TASK_STATE_DIR=$state_root"
            echo "AW_TASK_STATE_ARTIFACT=$artifact_name"
          } >> "$GITHUB_ENV"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

          mapfile -t run_ids < <(
            gh run list \
              --workflow handle-task-dispatch.yml \
              --status success \
              --limit 50 \
              --json databaseId \
              --jq '.[].databaseId'
          )

          candidate="$state_root/candidate"
          for run_id in "${run_ids[@]}"; do
            [ -n "$run_id" ] || continue
            rm -rf "$candidate"
            mkdir -p "$candidate"
            if gh run download "$run_id" -n "$artifact_name" -D "$candidate" >/dev/null 2>&1; then
              if node scripts/task-state.ts verify "$candidate" "$SOURCE_REPOSITORY" "$PROJECT"; then
                cp -a "$candidate/." "$state_root/previous/"
                rm -rf "$candidate"
                echo "Restored task state from run $run_id."
                exit 0
              fi
              echo "Ignoring task state from run $run_id: its manifest does not match this repository and project."
            fi
          done

          for run_id in "${run_ids[@]}"; do
            [ -n "$run_id" ] || continue
            rm -rf "$candidate"
            mkdir -p "$candidate"
            if gh run download "$run_id" -n "$legacy_artifact_name" -D "$candidate" >/dev/null 2>&1; then
              cp -a "$candidate/." "$state_root/previous/"
              rm -rf "$candidate"
              echo "Restored legacy-named task state from run $run_id."
              exit 0
            fi
          done
          rm -rf "$candidate"

          echo "No previous task state found."

      - name: Execute downstream task
        id: task
        env: ${{ secrets }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'

          node scripts/validate-repository-variables.ts

          if [ ! -d "${AW_SOURCE_DIR:-}" ]; then
              echo "::error::AW_SOURCE_DIR is required." >&2
              exit 1
          fi

          resolved_source_sha="$(git -C "$AW_SOURCE_DIR" rev-parse HEAD)"
          if [ "$resolved_source_sha" != "$BOOTSTRAP_REF" ]; then
              echo "::error::Task source SHA mismatch." >&2
              exit 1
          fi

          TMP_SCRIPT="$AW_SOURCE_DIR/bootstrap.sh"
          if [ ! -s "$TMP_SCRIPT" ]; then
              echo "::error::bootstrap.sh is missing from the verified task source." >&2
              exit 1
          fi

          if ! bash -n "$TMP_SCRIPT"; then
              echo "::error::bootstrap.sh has a shell syntax error." >&2
              exit 1
          fi

          # This repository's run logs are world-readable. For a private task source the project name,
          # full commit and request id are shown only as short hashes (scripts/task-state.ts).
          log_visibility=private
          [ "$TASK_SOURCE_PRIVATE" = "false" ] && log_visibility=public
          {
              IFS= read -r log_project
              IFS= read -r log_ref
              IFS= read -r log_request_id
          } < <(node scripts/task-state.ts log-view "$log_visibility" "$PROJECT" "$BOOTSTRAP_REF" "$REQUEST_ID")

          echo "::group::Task Info"
          echo "Run ID        : ${GITHUB_RUN_ID}"
          echo "Request ID    : ${log_request_id}"
          echo "Schema        : ${SCHEMA_VERSION}"
          echo "Project       : ${log_project}"
          echo "Bootstrap Ref : ${log_ref}"
          echo "Agent Domain  : ${AGENT_DOMAIN}"
          echo "Operation     : ${OPERATION}"
          echo "Skills        : ${AGENT_SKILLS}"
          echo "Prompt Path   : ${AGENT_SYSTEM_PROMPT_PATH}"
          echo "Runner OS     : ${RUNNER_OS}"
          echo "Start Time    : $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          echo "::endgroup::"

          project_dir="$AW_SOURCE_DIR/projects/$PROJECT"
          secret_scope="$(
              node scripts/resolve-secret-scope.ts \
                "${RUNNER_TEMP}/action-worker-base-env.names" \
                "$project_dir/.secrets.required" \
                "$project_dir/.secrets.allowed" \
                "AIG_ACCESS_KEY_AGENT" \
                "policies/task-secrets.json" \
                "$TASK_SOURCE_REPOSITORY" \
                "$PROJECT"
          )"

          while IFS= read -r secret_name; do
              [ -n "$secret_name" ] && unset "$secret_name"
          done < <(jq -r '.unset[]' <<< "$secret_scope")

          for central_name in AW_CONTROL_TOKEN AW_ADMIN_TOKEN AIG_ACCESS_KEY_AGENT AW_DISPATCH_TOKEN; do
              if [ -n "${!central_name+x}" ]; then
                  echo "::error::Central credential survived task isolation: ${central_name}." >&2
                  exit 1
              fi
          done

          chmod 700 "$TMP_SCRIPT"

          echo "Executing bootstrap.sh ..."

          # exec replaces this shell, so the task does not run beside a process that was started
          # with every secret in its environment.
          if [ "$TASK_SOURCE_PRIVATE" = "false" ]; then
              exec bash "$TMP_SCRIPT" "$PROJECT" "$BOOTSTRAP_REF" "$REQUEST_ID"
          fi
          # Run logs of this public repository are world-readable; keep private task output off them.
          # Artifacts of a public repository are downloadable by any signed-in GitHub user, so this
          # log stays on the runner and is never uploaded.
          exec bash "$TMP_SCRIPT" "$PROJECT" "$BOOTSTRAP_REF" "$REQUEST_ID"               >"${RUNNER_TEMP}/action-worker-task.log" 2>&1

      - name: Report task result
        if: always() && steps.task.outcome != 'skipped'
        env:
          TASK_OUTCOME: ${{ steps.task.outcome }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f             "${RUNNER_TEMP}/action-worker-base-env.names"             "${RUNNER_TEMP}/action-worker-repository-vars.json"             "${RUNNER_TEMP}/action-worker-task.log"

          log_visibility=private
          [ "$TASK_SOURCE_PRIVATE" = "false" ] && log_visibility=public
          {
            IFS= read -r log_project
            IFS= read -r log_ref
            IFS= read -r log_request_id
          } < <(node scripts/task-state.ts log-view "$log_visibility" "$PROJECT" "$BOOTSTRAP_REF" "$REQUEST_ID")

          echo "::group::Task Result"
          echo "Request ID    : ${log_request_id}"
          echo "Project       : ${log_project}"
          echo "Bootstrap Ref : ${log_ref}"
          echo "Outcome       : ${TASK_OUTCOME}"
          echo "End Time      : $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          echo "::endgroup::"

          if [ "$TASK_SOURCE_PRIVATE" != "false" ]; then
            echo "Task output is suppressed because the task source repository is private."
          fi
          if [ "$TASK_OUTCOME" != "success" ]; then
            echo "::error::bootstrap.sh execution failed." >&2
          fi

      - name: Write task state manifest
        if: always()
        shell: bash
        run: node scripts/task-state.ts write "${RUNNER_TEMP}/action-worker-task-state/current" "$TASK_SOURCE_REPOSITORY" "$PROJECT" "$BOOTSTRAP_REF"

      - name: Upload task state
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.task_state.outputs.artifact_name }}
          path: ${{ runner.temp }}/action-worker-task-state/current/
          if-no-files-found: ignore
          retention-days: 30

      - name: Validate staged publication
        id: publication
        env:
          AW_REPOSITORY_POLICY: ${{ vars.AW_REPOSITORY_POLICY }}
          SOURCE_REPOSITORY: ${{ needs.validate.outputs.repository }}
        run: node scripts/validate-task-publication.ts

      - name: Publish staged artifact
        if: steps.publication.outputs.staged == 'true'
        env:
          GH_TOKEN: ${{ secrets.AW_CONTROL_TOKEN }}
          TARGET_REPOSITORY: ${{ steps.publication.outputs.target_repository }}
          DEST_DIR: ${{ steps.publication.outputs.dest_dir }}
          DELETE_STALE: ${{ steps.publication.outputs.delete_stale }}
          COMMIT_MESSAGE: ${{ steps.publication.outputs.commit_message }}
          PAYLOAD_DIR: ${{ steps.publication.outputs.payload_dir }}
          SOURCE_REPOSITORY: ${{ needs.validate.outputs.repository }}
          PROJECT: ${{ needs.validate.outputs.project }}
        shell: bash
        run: |
          set -Eeuo pipefail

          PUBLISH_ROOT="${RUNNER_TEMP}/action-worker-publication"
          WORK_DIR="$(mktemp -d)"
          branch="task-publication/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          pr_number=""
          # shellcheck disable=SC2317  # invoked from the EXIT trap
          cleanup_publication() {
              rc=$?
              if [ "$rc" -ne 0 ] && [ -n "$pr_number" ]; then
                  gh pr close "$pr_number" --repo "$TARGET_REPOSITORY" --delete-branch >/dev/null 2>&1 || true
              fi
              rm -rf "$WORK_DIR" "$PUBLISH_ROOT"
          }
          trap cleanup_publication EXIT

          gh auth setup-git

          rm -rf "$WORK_DIR/target"
          gh repo clone "$TARGET_REPOSITORY" "$WORK_DIR/target" -- --depth 1
          git -C "$WORK_DIR/target" switch -c "$branch"

          target_dir="$WORK_DIR/target/$DEST_DIR"
          if [ "$DELETE_STALE" = "true" ]; then
              rm -rf "$target_dir"
          fi
          mkdir -p "$target_dir"
          cp -a "$PAYLOAD_DIR"/. "$target_dir"/

          git -C "$WORK_DIR/target" config user.name "Fongap Labs Action Worker"
          git -C "$WORK_DIR/target" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$WORK_DIR/target" add -- "$DEST_DIR"

          if git -C "$WORK_DIR/target" diff --cached --quiet; then
              echo "No publication changes."
              exit 0
          fi

          git -C "$WORK_DIR/target" commit -m "$COMMIT_MESSAGE"
          git -C "$WORK_DIR/target" push --force origin "HEAD:refs/heads/$branch"

          pr_number="$(gh pr list --repo "$TARGET_REPOSITORY" --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr_number" ]; then
              pr_title="chore: ${COMMIT_MESSAGE}"
              pr_body="Automated task publication from ${SOURCE_REPOSITORY} project ${PROJECT}. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              pr_number="$(gh pr create --repo "$TARGET_REPOSITORY" --base main --head "$branch" --title "$pr_title" --body "$pr_body")"
          fi
          echo "Publication pull request: ${pr_number}"

          gh workflow run pr-intake.yml --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || true

          deadline=$((SECONDS + 1800))
          while [ "$SECONDS" -lt "$deadline" ]; do
              state="$(gh pr view "$pr_number" --repo "$TARGET_REPOSITORY" --json state --jq .state)"
              if [ "$state" = "MERGED" ]; then
                  echo "Published task artifact to $TARGET_REPOSITORY/$DEST_DIR via pull request #${pr_number}."
                  exit 0
              fi
              if [ "$state" = "CLOSED" ]; then
                  echo "::error::Publication pull request #${pr_number} was closed without merging." >&2
                  exit 1
              fi

              merge_state="$(gh pr view "$pr_number" --repo "$TARGET_REPOSITORY" --json mergeStateStatus --jq .mergeStateStatus)"
              if [ "$merge_state" = "DIRTY" ]; then
                  echo "::error::Publication pull request #${pr_number} conflicts with $TARGET_REPOSITORY/main; a concurrent change touched $DEST_DIR." >&2
                  exit 1
              fi
              if [ "$merge_state" = "BEHIND" ]; then
                  gh pr update-branch "$pr_number" --repo "$TARGET_REPOSITORY" >/dev/null 2>&1 || true
                  sleep 10
                  continue
              fi

              check_state="$(gh pr view "$pr_number" --repo "$TARGET_REPOSITORY" --json statusCheckRollup --jq '[.statusCheckRollup[] | select((.name // .context) == "validate-merge")] | if length == 0 then "missing" elif any(.conclusion? == "FAILURE" or .state? == "FAILURE") then "failure" elif any(.conclusion? == "SUCCESS" or .state? == "SUCCESS") then "success" else "pending" end')"
              case "$check_state" in
                  success)
                      head_oid="$(gh pr view "$pr_number" --repo "$TARGET_REPOSITORY" --json headRefOid --jq .headRefOid)"
                      gh pr merge "$pr_number" --repo "$TARGET_REPOSITORY" --squash --match-head-commit "$head_oid" && continue
                      sleep 10
                      ;;
                  failure)
                      echo "::error::Publication pull request #${pr_number} failed the validate-merge check." >&2
                      exit 1
                      ;;
                  *)
                      sleep 20
                      ;;
              esac
          done

          echo "::error::Publication pull request #${pr_number} did not merge within 30 minutes." >&2
          exit 1
