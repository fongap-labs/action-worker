name: Handle Task Dispatch

on:
  repository_dispatch:
    types: [run-task]

permissions: {}

jobs:
  validate:
    name: Validate dispatch request
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      contents: read

    outputs:
      schema_version: ${{ steps.payload.outputs.schema_version }}
      request_id: ${{ steps.payload.outputs.request_id }}
      project: ${{ steps.payload.outputs.project }}
      bootstrap_ref: ${{ steps.payload.outputs.bootstrap_ref }}
      repository: ${{ steps.payload.outputs.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Validate request payload
        id: payload
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          AW_REPOSITORY_POLICY: ${{ vars.AW_REPOSITORY_POLICY }}
        run: node scripts/validate-dispatch-payload.ts "$PAYLOAD"

  execute:
    name: Execute task
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 65

    permissions: {}

    env:
      AW_SOURCE_DIR: ${{ github.workspace }}/task-source
      SCHEMA_VERSION: ${{ needs.validate.outputs.schema_version }}
      REQUEST_ID: ${{ needs.validate.outputs.request_id }}
      PROJECT: ${{ needs.validate.outputs.project }}
      BOOTSTRAP_REF: ${{ needs.validate.outputs.bootstrap_ref }}

    concurrency:
      group: action-worker-${{ needs.validate.outputs.project }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Checkout task source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.validate.outputs.repository }}
          ref: ${{ needs.validate.outputs.bootstrap_ref }}
          token: ${{ secrets.AW_CONTROL_TOKEN }}
          path: task-source
          fetch-depth: 1
          persist-credentials: false

      - name: Export repository variables
        env:
          REPOSITORY_VARS_JSON: ${{ toJSON(vars) }}
        run: node scripts/export-repository-variables.ts

      - name: Snapshot base environment
        shell: bash
        run: |
          set -Eeuo pipefail

          compgen -e |
            LC_ALL=C sort -u \
            > "${RUNNER_TEMP}/action-worker-base-env.names"

          chmod 600 "${RUNNER_TEMP}/action-worker-base-env.names"

      - name: Execute downstream task
        env: ${{ secrets }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'

          node scripts/validate-repository-variables.ts

          if [ ! -d "${AW_SOURCE_DIR:-}" ]; then
              echo "::error::AW_SOURCE_DIR is required." >&2
              exit 1
          fi

          resolved_source_sha="$(git -C "$AW_SOURCE_DIR" rev-parse HEAD)"
          if [ "$resolved_source_sha" != "$BOOTSTRAP_REF" ]; then
              echo "::error::Task source SHA mismatch." >&2
              exit 1
          fi

          TMP_SCRIPT="$AW_SOURCE_DIR/bootstrap.sh"
          if [ ! -s "$TMP_SCRIPT" ]; then
              echo "::error::bootstrap.sh is missing from the verified task source." >&2
              exit 1
          fi

          if ! bash -n "$TMP_SCRIPT"; then
              echo "::error::bootstrap.sh has a shell syntax error." >&2
              exit 1
          fi

          echo "::group::Task Info"
          echo "Run ID        : ${GITHUB_RUN_ID}"
          echo "Request ID    : ${REQUEST_ID}"
          echo "Schema        : ${SCHEMA_VERSION}"
          echo "Project       : ${PROJECT}"
          echo "Bootstrap Ref : ${BOOTSTRAP_REF}"
          echo "Runner OS     : ${RUNNER_OS}"
          echo "Start Time    : $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          echo "::endgroup::"

          cleanup() {
              rm -f "${RUNNER_TEMP}/action-worker-base-env.names" 2>/dev/null || true
              rm -f "${RUNNER_TEMP}/action-worker-repository-vars.json" 2>/dev/null || true
          }

          trap cleanup EXIT

          project_dir="$AW_SOURCE_DIR/projects/$PROJECT"
          secret_scope="$(
              node scripts/resolve-secret-scope.ts \
                "${RUNNER_TEMP}/action-worker-base-env.names" \
                "$project_dir/.secrets.required" \
                "$project_dir/.secrets.allowed"
          )"

          while IFS= read -r secret_name; do
              [ -n "$secret_name" ] && unset "$secret_name"
          done < <(jq -r '.unset[]' <<< "$secret_scope")

          for central_name in AW_CONTROL_TOKEN AW_ADMIN_TOKEN AIG_ACCESS_KEY_AGENT AW_DISPATCH_TOKEN; do
              if [ -n "${!central_name+x}" ]; then
                  echo "::error::Central credential survived task isolation: ${central_name}." >&2
                  exit 1
              fi
          done

          chmod 700 "$TMP_SCRIPT"

          echo "Executing bootstrap.sh ..."

          bootstrap_rc=0
          set +e
          bash "$TMP_SCRIPT" "$PROJECT" "$BOOTSTRAP_REF" "$REQUEST_ID"
          bootstrap_rc=$?
          set -e

          echo "::group::Task Result"
          echo "Request ID    : ${REQUEST_ID}"
          echo "Project       : ${PROJECT}"
          echo "Bootstrap Ref : ${BOOTSTRAP_REF}"
          echo "Exit Code     : ${bootstrap_rc}"
          echo "End Time      : $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          echo "::endgroup::"

          if [ "$bootstrap_rc" -ne 0 ]; then
              echo "::error::bootstrap.sh execution failed (exit=${bootstrap_rc})." >&2
              exit "$bootstrap_rc"
          fi

      - name: Validate staged publication
        id: publication
        env:
          AW_REPOSITORY_POLICY: ${{ vars.AW_REPOSITORY_POLICY }}
        run: node scripts/validate-task-publication.ts

      - name: Publish staged artifact
        if: steps.publication.outputs.staged == 'true'
        env:
          GH_TOKEN: ${{ secrets.AW_CONTROL_TOKEN }}
          TARGET_REPOSITORY: ${{ steps.publication.outputs.target_repository }}
          DEST_DIR: ${{ steps.publication.outputs.dest_dir }}
          DELETE_STALE: ${{ steps.publication.outputs.delete_stale }}
          COMMIT_MESSAGE: ${{ steps.publication.outputs.commit_message }}
          PAYLOAD_DIR: ${{ steps.publication.outputs.payload_dir }}
        shell: bash
        run: |
          set -Eeuo pipefail

          PUBLISH_ROOT="${RUNNER_TEMP}/action-worker-publication"
          WORK_DIR="$(mktemp -d)"
          cleanup_publication() {
              rm -rf "$WORK_DIR" "$PUBLISH_ROOT"
          }
          trap cleanup_publication EXIT

          gh auth setup-git

          attempt=1
          while [ "$attempt" -le 3 ]; do
              rm -rf "$WORK_DIR/target"
              gh repo clone "$TARGET_REPOSITORY" "$WORK_DIR/target" -- --depth 1

              branch="$(git -C "$WORK_DIR/target" branch --show-current)"
              target_dir="$WORK_DIR/target/$DEST_DIR"

              if [ "$DELETE_STALE" = "true" ]; then
                  rm -rf "$target_dir"
              fi
              mkdir -p "$target_dir"
              cp -a "$PAYLOAD_DIR"/. "$target_dir"/

              git -C "$WORK_DIR/target" config user.name "Fongap Labs Action Worker"
              git -C "$WORK_DIR/target" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git -C "$WORK_DIR/target" add -- "$DEST_DIR"

              if git -C "$WORK_DIR/target" diff --cached --quiet; then
                  echo "No publication changes."
                  exit 0
              fi

              git -C "$WORK_DIR/target" commit -m "$COMMIT_MESSAGE"

              if git -C "$WORK_DIR/target" push origin "HEAD:$branch"; then
                  echo "Published task artifact to $TARGET_REPOSITORY/$DEST_DIR"
                  exit 0
              fi

              if [ "$attempt" -ge 3 ]; then
                  echo "::error::Task publication failed after 3 attempts." >&2
                  exit 1
              fi

              echo "::warning::Target branch changed during publication; retrying." >&2
              sleep "$attempt"
              attempt=$((attempt + 1))
          done
