name: 自动 · 组织配置作用域审计

# Run whenever central scope policy changes and periodically detect out-of-band drift.
# Secrets list APIs expose names only. GitHub Variable list APIs may include values; discard them without logging.
on:
  push:
    branches: [main]
    paths:
      - policies/config-audit-targets.json
      - policies/repository-access.json
      - policies/task-secrets.json
      - policies/deploy-secrets.json
      - scripts/config-storage-audit.ts
      - scripts/config-security-classification.ts
      - scripts/audit-privacy-coverage.ts
      - scripts/security-coverage-audit.ts
      - policies/security.json
      - .github/workflows/audit-config-scope.yml
  schedule:
    - cron: "27 5 * * *"

permissions:
  contents: read

concurrency:
  group: organization-config-scope-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Audit all managed repository/organization/Environment scopes
    if: github.repository == 'fongap-labs/action-worker' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: admin-ops
      deployment: false
    permissions:
      contents: read
    steps:
      - name: Checkout trusted control-plane policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Read configuration metadata using existing protected admin identity
        env:
          AW_CONFIG_AUDIT_READ_TOKEN: ${{ secrets.AW_ADMIN_TOKEN }}
        run: node scripts/config-storage-audit.ts
      # Only metadata from the accessible GitHub App installation is inspected.
      - name: Mint organization inventory read token
        id: privacy_inventory
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      - name: Audit privacy governance coverage
        env:
          AW_INVENTORY_TOKEN: ${{ steps.privacy_inventory.outputs.token }}
        run: node scripts/audit-privacy-coverage.ts

      - name: Audit CI bridge and protected polling coverage
        env:
          AW_INVENTORY_TOKEN: ${{ steps.privacy_inventory.outputs.token }}
        run: node scripts/security-coverage-audit.ts

      - name: Record no-mutation audit result
        if: success()
        shell: bash
        run: |
          {
            echo '## Organization configuration scope audit'
            echo
            echo '- Coverage: complete, control-only or repository-only fallback (unknown scopes are null) (see JSON summary)'
            echo '- Inputs: GitHub names and scope metadata only'
            echo '- Secret values: not available; Variable values: discarded without output or persistence'
            echo '- Actions: no configuration changes or automatic credential migration'
          } >> "$GITHUB_STEP_SUMMARY"
