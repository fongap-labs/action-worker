name: 自动 · 组织配置作用域审计

# Run whenever central scope policy changes and periodically detect out-of-band drift.
# Secrets list APIs expose names only. GitHub Variable list APIs may include values; discard them without logging.
on:
  push:
    branches: [main]
    paths:
      - policies/config-audit-targets.json
      - policies/repository-access.json
      - policies/task-secrets.json
      - policies/deploy-secrets.json
      - scripts/config-storage-audit.ts
      - scripts/config-security-classification.ts
      - scripts/audit-privacy-coverage.ts
      - scripts/security-coverage-audit.ts
      - scripts/audit-dependency-inventory.ts
      - scripts/dependency-version-policy.ts
      - scripts/plan-dependency-remediation.ts
      - policies/dependency-versions.json
      - policies/security.json
      - .github/workflows/audit-config-scope.yml
  schedule:
    - cron: "27 5 * * *"
  workflow_dispatch:
    inputs:
      confirm:
        description: 确认批量创建版本整改 PR（默认仅检查）
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: organization-config-scope-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Audit all managed repository/organization/Environment scopes
    if: github.event_name != 'workflow_dispatch' && github.repository == 'fongap-labs/action-worker' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: admin-ops
      deployment: false
    permissions:
      contents: read
    steps:
      - name: Checkout trusted control-plane policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve central runtime versions
        id: runtime
        run: node scripts/resolve-runtime-versions.mjs --github-output .

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.runtime.outputs.node }}
      - name: Read configuration metadata using existing protected admin identity
        env:
          AW_CONFIG_AUDIT_READ_TOKEN: ${{ secrets.AW_ADMIN_TOKEN }}
        run: node scripts/config-storage-audit.ts
      # Only metadata from the accessible GitHub App installation is inspected.
      - name: Mint organization inventory read token
        id: privacy_inventory
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      - name: Audit privacy governance coverage
        env:
          AW_INVENTORY_TOKEN: ${{ steps.privacy_inventory.outputs.token }}
        run: node scripts/audit-privacy-coverage.ts

      - name: Audit CI bridge and protected polling coverage
        env:
          AW_INVENTORY_TOKEN: ${{ steps.privacy_inventory.outputs.token }}
        run: node scripts/security-coverage-audit.ts

      - name: Install trusted inventory parsers
        run: npm ci --ignore-scripts

      - name: Audit organization dependency declarations
        env:
          AW_INVENTORY_TOKEN: ${{ steps.privacy_inventory.outputs.token }}
        run: node scripts/audit-dependency-inventory.ts

      - name: Record no-mutation audit result
        if: success()
        shell: bash
        run: |
          {
            echo '## Organization configuration scope audit'
            echo
            echo '- Coverage: complete, control-only or repository-only fallback (unknown scopes are null) (see JSON summary)'
            echo '- Inputs: GitHub names and scope metadata only'
            echo '- Secret values: not available; Variable values: discarded without output or persistence'
            echo '- Actions: no configuration changes or automatic credential migration'
          } >> "$GITHUB_STEP_SUMMARY"

  discover-proposals:
    name: Discover public dependency proposal targets
    if: github.event_name == 'workflow_dispatch' && github.repository == 'fongap-labs/action-worker' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: admin-ops
      deployment: false
    outputs:
      count: ${{ steps.discover.outputs.count }}
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - name: Checkout trusted control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve central runtime versions
        id: runtime
        run: node scripts/resolve-runtime-versions.mjs --github-output .

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.runtime.outputs.node }}

      - name: Install trusted inventory parsers
        run: npm ci --ignore-scripts

      - name: Mint organization inventory read token
        id: inventory
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      - name: Discover proposal targets
        id: discover
        env:
          AW_INVENTORY_TOKEN: ${{ steps.inventory.outputs.token }}
        run: node scripts/propose-dependency-update.ts discover

  compute-proposals:
    name: Compute public dependency proposal / ${{ matrix.repository }} / ${{ matrix.branch }}
    needs: discover-proposals
    if: github.event_name == 'workflow_dispatch' && github.repository == 'fongap-labs/action-worker' && github.ref == 'refs/heads/main' && needs.discover-proposals.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.discover-proposals.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout trusted control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve central runtime versions
        id: runtime
        run: node scripts/resolve-runtime-versions.mjs --github-output .

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.runtime.outputs.node }}
          package-manager-cache: false

      - name: Install trusted inventory parsers
        run: npm ci --ignore-scripts

      - name: Compute public immutable lock proposal
        env:
          TARGET_REPOSITORY: ${{ matrix.repository }}
          TARGET_BRANCH: ${{ matrix.branch }}
          AW_PROPOSAL_READ_TOKEN: ${{ github.token }}
          OPERATOR_CONFIRMED: ${{ inputs.confirm }}
        run: node scripts/propose-dependency-update.ts compute

      - name: Upload public proposal evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-proposal-${{ strategy.job-index }}-${{ matrix.branch }}
          path: dependency-proposal.json
          if-no-files-found: error
          retention-days: 1

  propose-dependencies:
    name: Plan dependency proposal / ${{ matrix.repository }} / ${{ matrix.branch }}
    needs: [discover-proposals, compute-proposals]
    if: github.event_name == 'workflow_dispatch' && github.repository == 'fongap-labs/action-worker' && github.ref == 'refs/heads/main' && needs.discover-proposals.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.discover-proposals.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: admin-ops
      deployment: false
    steps:
      - name: Checkout trusted control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve central runtime versions
        id: runtime
        run: node scripts/resolve-runtime-versions.mjs --github-output .

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.runtime.outputs.node }}

      - name: Install trusted inventory parsers
        run: npm ci --ignore-scripts

      - name: Resolve managed PR scope
        id: scope
        env:
          TARGET_REPOSITORY: ${{ matrix.repository }}
        run: node scripts/resolve-github-api-scope.ts pr

      - name: Mint proposal read token
        id: read
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.scope.outputs.owner }}
          repositories: ${{ steps.scope.outputs.repository_name }}
          permission-contents: read
          permission-pull-requests: read

      - name: Verify administrator and prepare immutable proposal
        id: plan
        env:
          TARGET_REPOSITORY: ${{ matrix.repository }}
          TARGET_BRANCH: ${{ matrix.branch }}
          AW_PROPOSAL_READ_TOKEN: ${{ steps.read.outputs.token }}
          AW_PROPOSAL_ADMIN_READ_TOKEN: ${{ secrets.AW_ADMIN_TOKEN }}
        run: node scripts/propose-dependency-update.ts prepare

      - name: Download public proposal evidence
        if: inputs.confirm && steps.plan.outputs.changed == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dependency-proposal-${{ strategy.job-index }}-${{ matrix.branch }}

      - name: Mint target-scoped proposal writer
        id: writer
        if: inputs.confirm && steps.plan.outputs.changed == 'true'
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ steps.scope.outputs.owner }}
          repositories: ${{ steps.scope.outputs.repository_name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Revalidate and publish proposal
        if: inputs.confirm && steps.plan.outputs.changed == 'true'
        env:
          TARGET_REPOSITORY: ${{ matrix.repository }}
          TARGET_BRANCH: ${{ matrix.branch }}
          AW_PROPOSAL_READ_TOKEN: ${{ steps.read.outputs.token }}
          AW_PROPOSAL_ADMIN_READ_TOKEN: ${{ secrets.AW_ADMIN_TOKEN }}
          AW_PROPOSAL_WRITE_TOKEN: ${{ steps.writer.outputs.token }}
          PROPOSAL_IDENTITY: ${{ steps.plan.outputs.identity }}
          OPERATOR_CONFIRMED: ${{ inputs.confirm }}
        run: node scripts/propose-dependency-update.ts publish

  private-proposals:
    name: Process private dependency metadata (aggregate only)
    if: github.event_name == 'workflow_dispatch' && github.repository == 'fongap-labs/action-worker' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: admin-ops
      deployment: false
    steps:
      - name: Checkout trusted control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve central runtime versions
        id: runtime
        run: node scripts/resolve-runtime-versions.mjs --github-output .

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.runtime.outputs.node }}

      - name: Install trusted inventory parsers
        run: npm ci --ignore-scripts

      - name: Mint organization inventory read token
        id: inventory
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read
          permission-pull-requests: read

      - name: Process private metadata proposals
        env:
          AW_INVENTORY_TOKEN: ${{ steps.inventory.outputs.token }}
          AW_PROPOSAL_ADMIN_READ_TOKEN: ${{ secrets.AW_ADMIN_TOKEN }}
          AW_PROPOSAL_APP_CLIENT_ID: ${{ vars.AW_APP_CLIENT_ID }}
          AW_PROPOSAL_APP_PRIVATE_KEY: ${{ inputs.confirm && secrets.AW_APP_PRIVATE_KEY || '' }}
          OPERATOR_CONFIRMED: ${{ inputs.confirm }}
        run: node scripts/propose-dependency-update.ts private
