name: Server Edge Deploy

on:
  repository_dispatch:
    types: [run-server-edge-deploy]

permissions:
  contents: read

concurrency:
  group: server-edge-deploy
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate Server Edge deploy request
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source_repository: ${{ steps.source.outputs.source_repository }}
      source_sha: ${{ steps.source.outputs.source_sha }}

    steps:
      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Validate deploy source
        id: source
        env:
          AW_CONTROL_TOKEN: ${{ secrets.AW_CONTROL_TOKEN }}
          DEPLOY_REQUEST_JSON: ${{ toJSON(github.event.client_payload) }}
        run: node scripts/validate-deploy-source.ts fongap-labs/internal-vault true

  deploy:
    name: Deploy Server Edge
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SERVER_EDGE_ENVIRONMENT: server-edge-cloud-edge
      SERVER_EDGE_TRANSPORT: ${{ vars.SERVER_EDGE_TRANSPORT }}
      SERVER_EDGE_TARGET_HOST: ${{ vars.SERVER_EDGE_TARGET_HOST }}
      SERVER_EDGE_TARGET_USER: ${{ vars.SERVER_EDGE_TARGET_USER }}
      SERVER_EDGE_TARGET_PORT: ${{ vars.SERVER_EDGE_TARGET_PORT }}
      SERVER_EDGE_TARGET_ROOT: ${{ vars.SERVER_EDGE_TARGET_ROOT }}
      SERVER_EDGE_PROFILE: ${{ vars.SERVER_EDGE_PROFILE }}
      SERVER_EDGE_SSH_KNOWN_HOSTS: ${{ vars.SERVER_EDGE_SSH_KNOWN_HOSTS }}
      SERVER_EDGE_CONFIG_BUNDLE: ${{ vars.SERVER_EDGE_CONFIG_BUNDLE }}
      SERVER_EDGE_SSH_PRIVATE_KEY: ${{ secrets.SERVER_EDGE_SSH_PRIVATE_KEY }}
      SERVER_EDGE_SECRET_BUNDLE: ${{ secrets.SERVER_EDGE_SECRET_BUNDLE }}
      SERVER_EDGE_TAILSCALE_AUTH_KEY: ${{ secrets.SERVER_EDGE_TAILSCALE_AUTH_KEY }}

    steps:
      - name: Checkout Internal Vault
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.prepare.outputs.source_repository }}
          ref: ${{ needs.prepare.outputs.source_sha }}
          token: ${{ secrets.AW_CONTROL_TOKEN }}
          path: target
          persist-credentials: false

      - name: Validate central deployment inputs
        shell: bash
        run: |
          set -Eeuo pipefail

          missing=()
          require() {
            local name="$1"
            [ -n "${!name:-}" ] || missing+=("$name")
          }

          require SERVER_EDGE_TARGET_HOST
          require SERVER_EDGE_TARGET_USER
          require SERVER_EDGE_CONFIG_BUNDLE
          require SERVER_EDGE_SECRET_BUNDLE

          transport="${SERVER_EDGE_TRANSPORT:-ssh}"
          case "$transport" in
            ssh)
              require SERVER_EDGE_SSH_PRIVATE_KEY
              require SERVER_EDGE_SSH_KNOWN_HOSTS
              ;;
            tailscale)
              require SERVER_EDGE_TAILSCALE_AUTH_KEY
              ;;
            *)
              echo "::error::SERVER_EDGE_TRANSPORT must be ssh or tailscale." >&2
              exit 2
              ;;
          esac

          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing Action Worker deployment configuration: %s\n' "$(IFS=,; echo "${missing[*]}")" >&2
            exit 77
          fi

      - name: Connect deployment runner to Tailnet
        if: env.SERVER_EDGE_TRANSPORT == 'tailscale'
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          authkey: ${{ secrets.SERVER_EDGE_TAILSCALE_AUTH_KEY }}
          hostname: server-edge-deploy-${{ github.run_id }}
          args: --accept-dns=false

      - name: Deploy Server Edge
        working-directory: target
        env:
          EDGE_ENVIRONMENT: ${{ env.SERVER_EDGE_ENVIRONMENT }}
          EDGE_REF: ${{ needs.prepare.outputs.source_sha }}
          EDGE_TRANSPORT: ${{ env.SERVER_EDGE_TRANSPORT }}
          EDGE_TARGET_HOST: ${{ env.SERVER_EDGE_TARGET_HOST }}
          EDGE_TARGET_USER: ${{ env.SERVER_EDGE_TARGET_USER }}
          EDGE_TARGET_PORT: ${{ env.SERVER_EDGE_TARGET_PORT }}
          EDGE_TARGET_ROOT: ${{ env.SERVER_EDGE_TARGET_ROOT }}
          EDGE_PROFILE: ${{ env.SERVER_EDGE_PROFILE }}
          SSH_KNOWN_HOSTS: ${{ env.SERVER_EDGE_SSH_KNOWN_HOSTS }}
          EDGE_CONFIG_BUNDLE: ${{ env.SERVER_EDGE_CONFIG_BUNDLE }}
          SSH_PRIVATE_KEY: ${{ env.SERVER_EDGE_SSH_PRIVATE_KEY }}
          EDGE_SECRET_BUNDLE: ${{ env.SERVER_EDGE_SECRET_BUNDLE }}
        run: bash environments/server-edge/deploy.sh

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Server Edge central deployment"
            echo
            echo "- Source: ${{ needs.prepare.outputs.source_repository }}@${{ needs.prepare.outputs.source_sha }}"
            echo "- Environment: ${{ env.SERVER_EDGE_ENVIRONMENT }}"
            echo "- Transport: ${{ env.SERVER_EDGE_TRANSPORT }}"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
